function renderModal(){
  if(!pendingModal) return "";
  const mm = pendingModal;
  let body = `<p>${esc(mm.message).replace(/\n/g,"<br>")}</p>`;
  mm.confirmDisabled = false;
  if(mm.type==="confirm-result"){
    const m = getMatch(mm.matchId);
    if(!m || !m.a || !m.b){
      body = `<p>此對戰資料異常，無法確認結果。</p>`;
      mm.confirmDisabled = true;
    } else if(m.completed || m.status==="completed"){
      body = `<p>此場比賽已完成確認。</p>`;
      mm.confirmDisabled = true;
    } else {
      const aName = playerName(m.a.playerId), bName = playerName(m.b.playerId);
      // Winner side is recomputed fresh on every render, straight from the live score.
      // There is no clickable selection here — nothing in this modal can change winnerId.
      const winSide = checkWinnerSide(m);
      if(!winSide){
        const tieMsg = (m.scoreA===m.scoreB) ? "目前比分相同，無法確認獲勝者。" : "比分尚未達到獲勝條件，請重新確認。";
        body = `<p class="result-invalid-msg">${esc(tieMsg)}</p>
        <div class="radio-row">
          <div class="radio-opt result-locked">${esc(aName)}<br><span style="font-size:12px;color:var(--metal)">${m.scoreA} 分</span></div>
          <div class="radio-opt result-locked">${esc(bName)}<br><span style="font-size:12px;color:var(--metal)">${m.scoreB} 分</span></div>
        </div>`;
        mm.confirmDisabled = true;
      } else {
        const aWins = winSide==="A";
        const winName = aWins ? aName : bName, winScore = aWins ? m.scoreA : m.scoreB;
        const loseName = aWins ? bName : aName, loseScore = aWins ? m.scoreB : m.scoreA;
        body = `<p>系統已依目前比分判定本場獲勝者，請確認比分無誤。</p>
        <div class="radio-row">
          <div class="radio-opt result-winner" aria-disabled="false">
            <span class="result-crown">${WINNER_CROWN_SVG}</span><br>
            ${esc(winName)}<br><span style="font-size:12px;">${winScore} 分</span><br>
            <span class="result-tag result-tag-win">系統判定獲勝</span>
          </div>
          <div class="radio-opt result-loser" tabindex="-1" aria-disabled="true">
            ${esc(loseName)}<br><span style="font-size:12px;color:var(--metal)">${loseScore} 分</span><br>
            <span class="result-tag result-tag-lose">未達獲勝條件</span>
          </div>
        </div>`;
        mm.confirmDisabled = false;
      }
    }
  }
  if(mm.type==="confirm-quick"){
    const m = getMatch(mm.matchId);
    if(!m || !m.a || !m.b){
      body = `<p>此對戰資料異常，無法確認結果。</p>`;
      mm.confirmDisabled = true;
    } else if(m.completed || m.status==="completed" || m.winnerId){
      body = `<p>本場比賽已完成判定。</p>`;
      mm.confirmDisabled = true;
    } else if(mm.selectedWinnerId!==m.a.playerId && mm.selectedWinnerId!==m.b.playerId){
      body = `<p>賽事資料已變更或不符合判定條件，請重新確認。</p>`;
      mm.confirmDisabled = true;
    } else {
      const aWins = mm.selectedWinnerId===m.a.playerId;
      const winName = aWins ? playerName(m.a.playerId) : playerName(m.b.playerId);
      const loseName = aWins ? playerName(m.b.playerId) : playerName(m.a.playerId);
      body = `<p>比賽輪次：第 ${m.indexInRound+1} 場　比賽台：台${m.station}</p>
      <div class="radio-row">
        <div class="radio-opt result-winner" aria-disabled="false">
          <span class="result-crown">${WINNER_CROWN_SVG}</span><br>
          ${esc(winName)}<br>
          <span class="result-tag result-tag-win">本場獲勝</span>
        </div>
        <div class="radio-opt result-loser" tabindex="-1" aria-disabled="true">
          ${esc(loseName)}<br>
          <span class="result-tag result-tag-lose">本場落敗</span>
        </div>
      </div>
      <p class="hint" style="margin-top:10px;">簡易判定模式不記錄比分。確認後，獲勝選手將直接晉級下一輪。</p>`;
      mm.confirmDisabled = false;
    }
  }
  if(mm.type==="reauth-unarchive"){
    body = `<p>此賽事已封存為歷史紀錄。更正歷史結果需要重新確認您的身分。</p>
    ${mm.error ? `<div class="auth-error">${esc(mm.error)}</div>` : ""}
    <div class="field"><label>請再次輸入登入密碼</label><input type="password" id="reauth-password-input" autocomplete="current-password"></div>
    <p class="hint" style="margin-top:6px;">驗證成功後，此次操作會記錄修改前的名次資料、修改者與修改時間。</p>`;
    mm.confirmDisabled = false;
  }
  return `<div class="modal-overlay" data-action="modal-overlay">
    <div class="modal-box">
      <h3>${esc(mm.title)}</h3>
      ${body}
      <div class="btn-row">
        <button id="modal-cancel-btn" class="btn btn-ghost btn-block" data-action="modal-cancel" type="button">${esc(mm.cancelLabel||"取消")}</button>
        <button id="modal-confirm-btn" class="btn ${mm.danger?'btn-danger-solid':'btn-primary'} btn-block" data-action="modal-confirm" type="button" ${(mm.confirmDisabled||mm.confirmBusy)?'disabled':''}>${mm.confirmBusy?'處理中……':esc(mm.confirmLabel||"確認")}</button>
      </div>
    </div>
  </div>`;
}

function recName(rec, id){ const p = rec.players.find(x=>x.id===id); return p?p.name:"—"; }

function renderStandingsTableGeneric(stats, fmt){
  if(fmt==="roundrobin"){
    const rows = stats.map(p=>`<tr><td>${p.tied?"並列"+p.rank:p.rank}</td><td>${esc(p.name)}</td><td>${p.played}</td><td>${p.wins}</td><td>${p.losses}</td><td>${p.diff>0?"+":""}${p.diff}</td><td>${p.tied?'<span class="badge badge-danger">需要加賽</span>':''}</td></tr>`).join("");
    return `<div class="rank-scroll"><table class="rank-table"><thead><tr><th>名次</th><th>選手</th><th>出賽</th><th>勝</th><th>敗</th><th>得失分差</th><th>備註</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  const rows = stats.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${p.wins}</td><td>${p.losses}</td><td>${p.diff>0?"+":""}${p.diff}</td><td>${esc(p.status||"")}</td></tr>`).join("");
  return `<div class="rank-scroll"><table class="rank-table"><thead><tr><th>名次</th><th>選手</th><th>勝</th><th>敗</th><th>得失分差</th><th>狀態</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderHistoryDetail(rec){
  const saved = state;
  state = rec;
  let bracketHtml, stats;
  try{
    const fmt0 = rec.meta.formatType || "single";
    if(!rec.bracketSize){ bracketHtml = '<div class="panel"><div class="empty-state">此賽事尚未產生對戰表</div></div>'; }
    else if(fmt0==="double") bracketHtml = renderDoubleElimBracket();
    else if(fmt0==="roundrobin") bracketHtml = renderRoundRobinBracket();
    else bracketHtml = renderSingleElimBracket();
    bracketHtml = bracketHtml
      .replace(/data-action="open-match"/g, "")
      .replace(/<button class="btn btn-ghost btn-sm" data-action="print-bracket">[^<]*<\/button>/g, "");
    stats = computeStats();
  } finally {
    state = saved;
  }

  const fmt = rec.meta.formatType || "single";
  const realMatches = rec.matches.filter(m=>!m.isBye);
  const doneCount = realMatches.filter(m=>m.completed).length;
  const pct = realMatches.length ? Math.round(doneCount/realMatches.length*100) : 0;

  const playerRows = rec.players.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.checkedIn?'<span class="badge badge-neon">已報到</span>':'<span class="badge badge-metal">未報到</span>'}</td></tr>`).join("");

  const championHtml = rec.championId ? `
  <div class="champion-box">
    <div class="cap">最終名次</div>
    <div class="name">${esc(recName(rec, rec.championId))}</div>
    <div class="hint" style="margin-top:10px;">
      亞軍：${rec.runnerUpId?esc(recName(rec,rec.runnerUpId)):"—"}　
      季軍：${rec.thirdId?esc(recName(rec,rec.thirdId)):"—"}　
      殿軍：${rec.fourthId?esc(recName(rec,rec.fourthId)):"—"}
    </div>
    <div style="margin-top:14px;"><button class="btn btn-primary btn-sm" data-action="view-celebration" data-id="${rec.id}">查看最終排名慶祝畫面</button></div>
  </div>` : "";

  return `
  <div class="panel">
    <div class="panel-title"><span>${esc(rec.meta.name)}</span><button class="btn btn-ghost btn-sm" data-action="back-to-history-list">← 返回列表</button></div>
    <div class="grid grid-4">
      <div class="stat-box"><div class="label">日期</div><div class="value small">${esc(rec.meta.date||"—")}</div></div>
      <div class="stat-box"><div class="label">地點</div><div class="value small">${esc(rec.meta.location||"—")}</div></div>
      <div class="stat-box"><div class="label">賽制</div><div class="value small">${esc(FORMAT_LABELS[fmt]||"")}</div></div>
      <div class="stat-box"><div class="label">狀態</div><div class="value small">${esc(ARCHIVE_LABELS[rec.archiveStatus]||rec.archiveStatus)}</div></div>
    </div>
    <div class="grid grid-4" style="margin-top:12px;">
      <div class="stat-box"><div class="label">參賽人數</div><div class="value">${rec.players.length}</div></div>
      <div class="stat-box"><div class="label">總場次</div><div class="value">${realMatches.length}</div></div>
      <div class="stat-box"><div class="label">完成率</div><div class="value">${pct}%</div></div>
      <div class="stat-box"><div class="label">完成時間</div><div class="value small">${rec.completedAt?esc(new Date(rec.completedAt).toLocaleString()):"—"}</div></div>
    </div>
    ${rec.archiveStatus==="completed" ? `<div class="banner" style="margin-top:14px;"><span>此為已封存的唯讀歷史紀錄，不可直接修改。</span><button class="btn btn-ghost btn-sm" data-action="unarchive-record" data-id="${rec.id}">解除封存並編輯</button></div>` : `<div class="btn-row" style="margin-top:14px;">${rec.id!==state.id ? `<button class="btn btn-primary btn-sm" data-action="resume-record" data-id="${rec.id}">繼續此賽事</button>`:''}</div>`}
  </div>
  ${championHtml}
  <div class="panel">
    <div class="panel-title">選手名單與報到狀態</div>
    <div class="rank-scroll"><table class="rank-table"><thead><tr><th>選手</th><th>報到狀態</th></tr></thead><tbody>${playerRows}</tbody></table></div>
  </div>
  <div class="panel">
    <div class="panel-title">最終排名</div>
    ${renderStandingsTableGeneric(stats, fmt)}
  </div>
  ${bracketHtml}
  `;
}

function renderHistory(){
  if(viewingRecordId){
    if(!viewingRecordData){
      return `<div class="panel"><div class="empty-state">載入中…</div></div>`;
    }
    return renderHistoryDetail(viewingRecordData);
  }

  const hasAnyRecords = recordIndex.length > 0;
  const hasActiveFilters = !!(historyFilters.search || historyFilters.date || historyFilters.format!=="all");
  const filtered = recordIndex.filter(r=>{
    if(historyFilters.search && !(r.name||"").toLowerCase().includes(historyFilters.search.toLowerCase())) return false;
    if(historyFilters.date && recordFilterDate(r)!==historyFilters.date) return false;
    if(historyFilters.format!=="all" && r.formatType!==historyFilters.format) return false;
    return true;
  }).sort((a,b)=> ((b.completedAt||b.archivedAt||b.updatedAt||0)-(a.completedAt||a.archivedAt||a.updatedAt||0)));

  const rows = filtered.map(r=>{
    const isCurrent = r.id===state.id;
    return `
    <div class="panel" style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
        <div>
          <div style="font-family:var(--font-d);font-weight:700;font-size:16px;color:var(--white);">${esc(r.name)} ${isCurrent?'<span class="badge badge-neon">目前賽事</span>':''}</div>
          <div class="hint" style="margin-top:4px;">${esc(r.date||"未設定日期")}　${esc(r.location||"")}　${esc(FORMAT_LABELS[r.formatType]||r.format||"")}　${r.playerCount} 人</div>
        </div>
        <span class="badge ${r.archiveStatus==='completed'?'badge-neon':r.archiveStatus==='paused'?'badge-metal':'badge-danger'}">${esc(ARCHIVE_LABELS[r.archiveStatus]||r.archiveStatus)}</span>
      </div>
      <div class="hint" style="margin-top:6px;">冠軍：${r.championName?esc(r.championName):"—"}</div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn btn-ghost btn-sm" data-action="view-record" data-id="${r.id}">查看完整紀錄</button>
        ${r.archiveStatus!=='completed' && !isCurrent ? `<button class="btn btn-ghost btn-sm" data-action="resume-record" data-id="${r.id}">繼續此賽事</button>`:''}
        <button class="btn btn-ghost btn-sm" data-action="duplicate-record" data-id="${r.id}">複製賽事</button>
        <button class="btn btn-ghost btn-sm" data-action="export-record" data-id="${r.id}">匯出</button>
        <button class="btn btn-danger btn-sm" data-action="delete-record" data-id="${r.id}">刪除</button>
      </div>
    </div>`;
  }).join("");

  return `
  <div class="panel">
    <div class="panel-title">賽事紀錄</div>
    <div class="grid grid-3">
      <div class="field"><label>搜尋賽事名稱</label><input type="text" id="hist-search" value="${esc(historyFilters.search)}" placeholder="輸入賽事名稱關鍵字"></div>
      <div class="field"><label>依日期篩選</label><input type="date" id="hist-date" value="${esc(historyFilters.date)}"></div>
      <div class="field"><label>依賽制篩選</label><select id="hist-format">
        <option value="all" ${historyFilters.format==='all'?'selected':''}>全部賽制</option>
        <option value="single" ${historyFilters.format==='single'?'selected':''}>單淘汰賽</option>
        <option value="double" ${historyFilters.format==='double'?'selected':''}>雙敗制</option>
        <option value="roundrobin" ${historyFilters.format==='roundrobin'?'selected':''}>單循環賽</option>
      </select></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" data-action="new-tournament-copy">建立新賽事（複製目前設定）</button>
      <button class="btn btn-ghost" data-action="new-tournament-blank">建立空白新賽事</button>
      <button class="btn btn-ghost" data-action="export-all-backup">全部備份匯出</button>
      <button class="btn btn-ghost" data-action="import-backup-trigger">匯入備份</button>
      ${hasActiveFilters ? `<button class="btn btn-ghost" data-action="clear-history-filters">清除篩選</button>` : ""}
    </div>
    <input type="file" id="import-backup-input" accept="application/json" style="display:none;">
  </div>
  ${filtered.length===0 ? `<div class="panel"><div class="empty-state">${hasAnyRecords ? "目前篩選條件下沒有賽事紀錄" : "尚無賽事紀錄"}</div></div>` : rows}
  `;
}

function cloudStatusBarHtml(){
  const configured = (typeof window!=="undefined" && window.cloudSync && window.cloudSync.isConfigured && window.cloudSync.isConfigured());
  const testBtn = hasAdminAccess() ? `<button class="btn btn-ghost" data-action="cloud-test-connection" ${cloudTestBusy?'disabled':''}>${cloudTestBusy?'測試中……':'測試雲端連線'}</button>` : "";
  const isGuest = currentRole==="guest";

  if(state.cloudCode){
    const dotClass = cloudStatus==="connected" ? "green" : (cloudStatus==="connecting" ? "yellow" : (cloudStatus==="error" ? "red" : "gray"));
    const label = cloudStatus==="connected" ? "☁ 雲端已同步" : (cloudStatus==="connecting" ? "☁ 同步中…" : (cloudStatus==="error" ? "⚠ 雲端連線異常" : "☁ 僅本機"));
    let actionBtns = "";
    if(hasAdminAccess()){
      if(cloudStatus!=="connected"){ actionBtns += `<button class="btn btn-ghost" data-action="cloud-retry-connect">重試連線</button>`; }
      actionBtns += `<button class="btn btn-ghost" data-action="cloud-leave-room">離開雲端同步</button>`;
    } else if(isGuest){
      actionBtns = `<button class="btn btn-ghost" data-action="cloud-open-join-modal">切換賽事</button><button class="btn btn-ghost" data-action="cloud-leave-room">離開賽事</button>`;
    }
    return `<div class="cloud-status-bar">
      <span class="cloud-dot-v2 ${dotClass}"></span>
      <span>${label}</span>
      <span class="cloud-code-chip">代碼 ${esc(state.cloudCode)}</span>
      ${testBtn}
      ${actionBtns}
    </div>`;
  }

  let actionBtns = "";
  let dotClass = "gray";
  let label = "等待賽事架構中";
  if(hasAdminAccess()){
    if(!configured){
      label = "僅本機（未設定雲端）"; dotClass = "gray";
    } else if(cloudStatus==="connecting"){
      label = "☁ 建立雲端賽事中…"; dotClass = "yellow";
    } else if(cloudStatus==="error"){
      label = "⚠ 雲端連線失敗，暫時使用本機模式"; dotClass = "red";
      actionBtns += `<button class="btn btn-ghost" data-action="cloud-retry-connect">重試連線</button>`;
    } else {
      label = "等待賽事架構中"; dotClass = "gray";
    }
    actionBtns += `<button class="btn btn-ghost" data-action="cloud-open-join-modal">輸入代碼加入</button>`;
  } else if(isGuest){
    actionBtns = `<button class="btn btn-ghost" data-action="cloud-open-join-modal">輸入賽事代碼</button>`;
  }
  return `<div class="cloud-status-bar">
    <span class="cloud-dot-v2 ${dotClass}"></span>
    <span>${label}</span>
    ${testBtn}
    ${actionBtns}
  </div>`;
}

function renderCloudTestResultModal(){

  const stepRow = (label, ok, extra)=> `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-soft);"><span>${label}</span><span style="color:${ok?'var(--ok)':'var(--danger)'};font-weight:700;">${ok?'✓ 成功':'✕ 失敗'}</span></div>${extra||""}`;
  return `<div class="modal-overlay" data-action="cloud-close-test-result">
    <div class="modal-box">
      <h3>雲端連線測試結果</h3>

async function searchPlayerNames(query){
  const names = new Set();
  const q = (query||"").trim();
  const idx = await loadIndex();
  const allRecordIds = idx.map(r=>r.id);
  for(const rid of allRecordIds){
    const rec = rid===state.id ? state : (await loadRecord(rid));
    if(!rec || !rec.players) continue;
    rec.players.forEach(p=>{
      if(!q || p.name.toLowerCase().includes(q.toLowerCase())) names.add(p.name);
    });
  }
  return Array.from(names).sort();
}

async function buildPlayerCenterData(name){
  const idx = await loadIndex();
  const records = [];
  let currentCheckin = "—";
  for(const r of idx){
    const rec = r.id===state.id ? state : (await loadRecord(r.id));
    if(!rec || !rec.players) continue;
    const p = rec.players.find(pl=>pl.name===name);
    if(!p) continue;
    let placement = "—";
    if(rec.championId===p.id) placement="冠軍";
    else if(rec.runnerUpId===p.id) placement="亞軍";
    else if(rec.thirdId===p.id) placement="季軍";
    else if(rec.fourthId===p.id) placement="殿軍";
    else if(rec.matches && rec.matches.some(m=>!m.isBye && m.completed && ((m.a&&m.a.playerId===p.id)||(m.b&&m.b.playerId===p.id)))) placement="已淘汰";
    else placement="—";
    let wins=0, losses=0;
    (rec.matches||[]).forEach(m=>{
      if(m.isBye || !m.completed || !m.winnerId) return;
      const aId = m.a&&m.a.playerId, bId = m.b&&m.b.playerId;
      if(m.winnerId===p.id) wins++;
      else if((aId===p.id||bId===p.id)) losses++;
    });
    records.push({ recordId: rec.id, date: rec.meta.date, eventName: rec.meta.name, formatType: rec.meta.formatType, playerCount: rec.players.length, placement, wins, losses });
    if(r.id===state.id){
      currentCheckin = p.checkedIn ? "已報到" : "未報到";
    }
  }
  records.sort((a,b)=> (b.date||"").localeCompare(a.date||""));
  return { name, records, currentCheckin };
}

let __html2canvasLoadPromise = null;
function ensureHtml2Canvas(){
  if(typeof window.html2canvas==="function") return Promise.resolve();
  if(__html2canvasLoadPromise) return __html2canvasLoadPromise;
  __html2canvasLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error("html2canvas-load-failed"));
    document.head.appendChild(s);
  });
  return __html2canvasLoadPromise;
}

async function exportBoardAsImage(){
  const shell = document.getElementById("board-shell");
  if(!shell){ showToast("找不到看板內容，請先切換至賽事看板模式", true); return; }
  showToast("正在產生圖片……");
  shell.classList.add("board-export-freeze");
  const prevZoom = boardZoom, prevPanX = boardPanX, prevPanY = boardPanY;
  try{
    await ensureHtml2Canvas();
    boardZoom = 1; boardPanX = 0; boardPanY = 0;
    applyBoardTransform();
    await new Promise(r=>setTimeout(r,50));
    const canvas = await window.html2canvas(shell, { backgroundColor:"#070808", scale:2, useCORS:true });
    const dataUrl = canvas.toDataURL("image/png");
    const dateStr = new Date().toISOString().slice(0,10);
    const safeName = (state.meta.name||"賽事").replace(/[\\\/:*?"<>|]/g,"_");
    const fname = "BXH_"+safeName+"_"+dateStr+"_對戰表.png";

    document.body.appendChild(a); a.click(); a.remove();
    showToast("圖片已匯出");
  }catch(e){
    showToast("匯出圖片失敗，請稍後再試", true);
  }finally{
    boardZoom = prevZoom; boardPanX = prevPanX; boardPanY = prevPanY;
    applyBoardTransform();
    shell.classList.remove("board-export-freeze");
  }
}

function bindBoardModeInteractions(){
  if(bracketViewMode!=="board") return;
  try{
    const viewport = document.getElementById("board-viewport");
    const canvas = document.getElementById("board-canvas");
    if(!viewport || !canvas) return;

    viewport.addEventListener("wheel", (e)=>{
      if(!e.ctrlKey) return;
      e.preventDefault();
      setBoardZoom(boardZoom + (e.deltaY<0 ? 0.1 : -0.1));
    }, { passive:false });

    let dragging=false, startX=0, startY=0, startPanX=0, startPanY=0;
    viewport.addEventListener("mousedown", (e)=>{
      dragging=true; startX=e.clientX; startY=e.clientY; startPanX=boardPanX; startPanY=boardPanY;
      viewport.style.cursor="grabbing";
    });
    window.addEventListener("mousemove", (e)=>{
      if(!dragging) return;
      boardPanX = startPanX + (e.clientX-startX);
      boardPanY = startPanY + (e.clientY-startY);
      applyBoardTransform();
    });
    window.addEventListener("mouseup", ()=>{ dragging=false; viewport.style.cursor="grab"; });

    let touchStartDist=0, touchStartZoom=1, touchStartX=0, touchStartY=0, touchStartPanX=0, touchStartPanY=0;
    viewport.addEventListener("touchstart", (e)=>{
      if(e.touches.length===2){
        touchStartDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
        touchStartZoom = boardZoom;
      } else if(e.touches.length===1){
        touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
        touchStartPanX = boardPanX; touchStartPanY = boardPanY;
      }
    }, { passive:true });
    viewport.addEventListener("touchmove", (e)=>{
      if(e.touches.length===2){
        e.preventDefault();
        const dist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
        if(touchStartDist>0) setBoardZoom(touchStartZoom * (dist/touchStartDist));
      } else if(e.touches.length===1){
        boardPanX = touchStartPanX + (e.touches[0].clientX-touchStartX);
        boardPanY = touchStartPanY + (e.touches[0].clientY-touchStartY);
        applyBoardTransform();
      }
    }, { passive:false });

    const themeSelect = document.getElementById("board-theme-select");
    if(themeSelect){
      themeSelect.addEventListener("change", ()=>{
        boardTheme = themeSelect.value;
        const shell = document.getElementById("board-shell");
        if(shell) shell.setAttribute("data-board-theme", boardTheme);
        saveBoardThemePreference(boardTheme);
      });
    }
  }catch(e){ /* pointer/touch APIs unavailable outside a real browser; board mode still renders statically */ }
}

/* ==== actions ==== */
function handleAction(action, target){
  const id = target.getAttribute("data-id");
  if(ADMIN_ONLY_ACTIONS.has(action) && !hasAdminAccess()){
    showToast("目前身分沒有此操作權限。", true);
    return;
  }
  if(SUPER_ADMIN_ONLY_ACTIONS.has(action) && !isSuperAdmin()){
    showToast("只有最高管理員可以管理其他後台帳號。", true);
    return;
  }
  if(ADMIN_TIER_ONLY_ACTIONS.has(action) && !isAdminTierOrAbove()){
    showToast("只有 super_admin 或 admin 可以執行此操作。", true);
    return;
  }
  if(action==="switch-tab"){
    const targetTab = target.getAttribute("data-tab");
    if((targetTab==="referee" || targetTab==="settings") && !hasAdminAccess()){
      showToast("目前身分沒有此操作權限。", true);
      return;
    }
    activeTab = targetTab; if(activeTab!=="history"){ viewingRecordId=null; viewingRecordData=null; } render(); return;
  }
  if(action==="select-role-admin"){
    (async ()=>{
      loginError=""; authFormError="";
      try{
        const res = await window.storage.get(REMEMBER_EMAIL_KEY);
        rememberedUsername = (res && res.value) ? res.value : "";
        rememberUsername = !!rememberedUsername;
      }catch(e){ rememberedUsername=""; }
      if(!authAvailable()){
        // give the module a brief moment to finish connecting if it hasn't yet
        if(window.cloudSync && window.cloudSync.connect){ await window.cloudSync.connect(); }
      }
      if(!authAvailable()){
        appPhase="admin-login"; // shows the "雲端服務尚未連線" banner rather than blocking entirely
        render();
        return;
      }
      superAdminExists = await window.cloudAuth.hasSuperAdmin();
      appPhase = (superAdminExists===false) ? "admin-setup" : "admin-login";
      render();
    })();
    return;

document.addEventListener("click", (e)=>{
  const target = e.target.closest("[data-action]");
  if(!target) return;
  const action = target.getAttribute("data-action");
  if(action==="modal-overlay" && e.target!==target){ return; }
  if(action==="close-share-modal" && e.target!==target){ return; }
  if(action==="cloud-close-join-modal" && e.target!==target){ return; }
  if(action==="cloud-close-test-result" && e.target!==target){ return; }
  handleAction(action, target);
});

/* ==== init ==== */
async function init(){
  loadBoardThemePreference();
  let idx = await loadIndex();
  let currentId = await getCurrentId();

  if(idx.length===0 && !currentId){
    let legacy = null;
    try{
      const res = await window.storage.get(LEGACY_KEY);
      if(res && res.value) legacy = JSON.parse(res.value);
    }catch(e){}
    if(legacy){
      state = Object.assign(defaultState(), legacy);
      state.id = uid("t");
      state.createdAt = state.createdAt || Date.now();
      state.archiveStatus = state.archiveStatus || "ongoing";
    } else {
      state = defaultState();
    }
    await saveRecord(state);
    await setCurrentId(state.id);
    idx = await loadIndex();
  } else if(currentId){
    const rec = await loadRecord(currentId);
    if(rec){
      state = Object.assign(defaultState(currentId), rec);
    } else {
      state = defaultState();
      await saveRecord(state);
      await setCurrentId(state.id);
      idx = await loadIndex();
    }
  } else {
    state = defaultState();
    await saveRecord(state);
    await setCurrentId(state.id);
    idx = await loadIndex();
  }

  recordIndex = idx;
  rebuildPropagation();

  // One-time repair: if this tournament is already marked archived/completed but
  // somehow has no matching (or a stale) entry in the lightweight record index —
  // e.g. from a previous session where the index write silently failed — rebuild
  // that index entry now from the real, still-intact tournament data. This never
  // touches other historical records and never re-creates a duplicate.
  if((state.archiveStatus==="completed" || state.archiveStatus==="archived") && state.championId!==undefined){
    const existingEntry = recordIndex.find(r=>r.id===state.id);
    const needsRepair = !existingEntry || existingEntry.archiveStatus!==state.archiveStatus || (state.archivedAt && existingEntry.archivedAt!==state.archivedAt);
    if(needsRepair){
      await saveRecord(state);
      recordIndex = await loadIndex();
    }
  }

  appPhase = "landing"; // default; onAuthStateChanged (wired below) is the sole source of truth for admin login state and will override this if a valid Firebase session already exists
  const watchParam = getWatchParamFromUrl();
  if(watchParam){
    await attemptWatchUrlEntry(watchParam);
  } else {
    try{
      const guestSession = await loadGuestSession();
      if(guestSession && guestSession.cloudCode && state.cloudCode && guestSession.cloudCode===state.cloudCode){
        currentRole = "guest";
        appPhase = "app";
        activeTab = "live";
      }
    }catch(e){}
    render();
  }

  // Cloud sync + Firebase Authentication: wire up without ever blocking the local-only startup path above.
  try{
    if(typeof window!=="undefined"){
      const wireUpCloud = async ()=>{
        if(!window.cloudSync) return;
        await window.cloudSync.connect();
        if(state.cloudCode && cloudAvailable()){
          cloudStatus = "connecting"; render();
          if(cloudUnsub){ try{ cloudUnsub(); }catch(e){} }
          cloudUnsub = window.cloudSync.subscribe(state.cloudCode, applyRemoteState);
          cloudStatus = "connected"; cloudLastSyncAt = Date.now();
          render();
        } else if(state.cloudCode && !cloudAvailable()){
          cloudStatus = "local"; render();
        }

        if(window.cloudAuth && window.cloudAuth.isReady()){
          superAdminExists = await window.cloudAuth.hasSuperAdmin();
          try{ await window.cloudAuth.checkRedirectResult(); }catch(e){}
          if(authUnsub){ try{ authUnsub(); }catch(e){} }
          // Single-authority auth-state handler, extracted into a named,
          // reusable function so it can be invoked from exactly one place in
          // normal operation (the onAuthStateChanged listener below), but ALSO
          // manually re-invoked as a recovery path if that listener's event
          // simply never fires (see the verifying-timeout fallback further
          // down) — without ever creating a SECOND, independently-racing
          // routing path. Wrapped in try/catch/finally end-to-end: whatever
          // happens (success, an unexpected thrown error, a hung sub-call that
          // eventually settles) the finally block guarantees verifying/busy
          // states are never left stuck.
          async function processAuthStateChangeImpl(fbUser){
            try{
              if(fbUser){
                firebaseUser = { uid: fbUser.uid, email: fbUser.email };
                const profile = await window.cloudAuth.getUserProfile(fbUser.uid);
                if(profile && profile.active===true){
                  // Determine which mode this specific sign-in should land in.
                  // pendingLoginIntent (set by whichever button was clicked) wins;
                  // failing that, fall back to a previously-persisted activeMode
                  // (e.g. restoring a session on page refresh); failing that,
                  // default sensibly by role so existing behavior is preserved
                  // for accounts that have never touched activeMode before.
                  const storedMode = await loadActiveMode();
                  const intent = pendingLoginIntent || storedMode || (mapRoleToAppRole(profile.role)==="player" ? "player" : "admin");
                  pendingLoginIntent = null;

                  if(!roleAllowsMode(profile.role, intent)){
                    // e.g. a player account attempted to sign in through the
                    // admin entry point — reject cleanly, never show "admin
                    // login success" first and hide it later.
                    await window.cloudAuth.signOutUser();
                    userProfile = null; currentRole = null; firebaseUser = null;
                    await clearActiveMode();
                    loginError = "此帳號沒有管理權限";
                    appPhase = "admin-login";
                    return;
                  }

                  userProfile = profile;
                  await saveActiveMode(intent);
                  currentRole = (intent==="player") ? "player" : mapRoleToAppRole(profile.role);
                  adminDisplayName = profile.displayName || profile.email;
                  window.cloudAuth.touchLastLogin(fbUser.uid);
                  loginAttempts = 0; loginLockoutUntil = 0;
                  loginError = "";
                  if(pendingRememberEmail!==null){
                    try{ await window.storage.set(REMEMBER_EMAIL_KEY, pendingRememberEmail); }catch(e){}
                    pendingRememberEmail = null;
                  } else if(intent==="admin"){
                    try{ await window.storage.delete(REMEMBER_EMAIL_KEY); }catch(e){}
                  }

                  if(appPhase==="landing" || appPhase==="admin-login" || appPhase==="admin-setup" || appPhase==="admin-success" || appPhase==="player-login" || appPhase==="player-apply" || currentRole==="guest"){
                    if(intent==="admin"){
                      appPhase = "admin-success";
                      render();
                      setTimeout(()=>{ if(appPhase==="admin-success"){ appPhase="app"; activeTab="live"; render(); } }, 600);
                      ensureCloudRoomForTournament();
                      return;
                    }
                    // intent === "player": any role (including existing
                    // super_admin/admin/staff accounts) lands in player mode.
                    // If this account has never filled in player-facing fields
                    // (very likely true the first time an existing staff member
                    // tries player mode), route to completion instead of a
                    // player center with blank name fields.
                    if(!profile.realName){
                      pendingExistingAccountProfile = { uid: fbUser.uid, email: fbUser.email };
                      appPhase = "player-complete-profile";
                    } else {
                      appPhase = "player-center";
                      activeTab = "live";
                      if(window.cloudAuth.ensurePublicPlayerDoc){
                        window.cloudAuth.ensurePublicPlayerDoc(fbUser.uid, { publicName: profile.displayName||profile.nickname||profile.realName, avatarUrl: profile.avatarUrl||null });
                      }
                    }
                  }
                  if(currentRole==="admin"){ ensureCloudRoomForTournament(); }
                  if(currentRole==="player"){
                    try{ playerLookupResult = await searchPlayerNames(profile.realName||""); }catch(e){ playerLookupResult=null; }
                  }
                } else if(!profile){
                  // No users/{uid} document yet — most likely a first-time Google
                  // sign-in (or a prior sign-up whose Firestore write failed).
                  // Never re-create the Auth account here; just let them (re)complete
                  // their profile using the SAME existing Auth session.
                  userProfile = null; currentRole = null;
                  pendingLoginIntent = null;
                  pendingGoogleProfile = { uid: fbUser.uid, email: fbUser.email };
                  appPhase = "player-complete-profile";
                } else {
                  userProfile = null; currentRole = null; firebaseUser = null;
                  pendingLoginIntent = null;
                  await window.cloudAuth.signOutUser();
                  await clearActiveMode();
                  loginError = "此帳號已被停用，請聯絡系統管理員";
                  playerLoginError = "此帳號已被停用，請聯絡系統管理員";
                  appPhase = (appPhase==="player-login" || appPhase==="player-home") ? "player-login" : "admin-login";
                }
              } else {
                firebaseUser = null; userProfile = null;
                if(currentRole==="admin"){
                  currentRole = null; adminDisplayName = null;
                  if(appPhase==="app" || appPhase==="account-management" || appPhase==="admin-change-password"){
                    appPhase = "landing";
                  }
                }
                if(currentRole==="player"){
                  currentRole = null;
                  if(appPhase==="player-center"){ appPhase = "landing"; }
                }
              }
            }catch(e){
              // Requirement 3/4: ANY unexpected failure anywhere in this flow
              // (a thrown error from getUserProfile(), a Firestore permission
              // issue, anything) must still result in a usable screen, never a
              // silently-stuck one.
              console.warn("BXH ARENA：登入狀態處理發生非預期錯誤", e);
              if(fbUser){
                loginError = "驗證時發生錯誤，請重試";
                playerLoginError = "驗證時發生錯誤，請重試";
              }
            }finally{
              // Guaranteed cleanup regardless of which branch above ran, an
              // exception was thrown, or nothing matched — verifying/busy
              // states can NEVER be left stuck after this function returns.
              clearVerifyingTimeout();
              authVerifying = false;
              loginBusy = false; playerLoginBusy = false;
              render();
            }
          }

          processAuthStateChange = processAuthStateChangeImpl;
          authUnsub = window.cloudAuth.onAuthChange(processAuthStateChangeImpl);
        }
      };
      if(window.cloudSync){ wireUpCloud(); }
      else { window.addEventListener("bxh-cloud-ready", wireUpCloud, { once:true }); }
    }
  }catch(e){ /* cloud sync is always optional; never let it break local mode */ }
}
init();
</script>

      promise.then((v)=>{ if(!settled){ settled = true; clearTimeout(timer); resolve(v); } },

    },

    async sendResetEmail(email){
      if(!authReady) return { ok:false, error:"雲端服務尚未就緒" };
      try{ await ax.sendPasswordResetEmail(authHandle, email); return { ok:true }; }
      catch(e){ return { ok:false, error: friendlyAuthError(e) }; }
    },

    async changePassword(currentPassword, newPassword){
      if(!authReady) return { ok:false, error:"雲端服務尚未就緒" };
      const user = authHandle.currentUser;
      if(!user || !user.email) return { ok:false, error:"尚未登入" };
      try{
        const credential = ax.EmailAuthProvider.credential(user.email, currentPassword);
        await ax.reauthenticateWithCredential(user, credential);
        await ax.updatePassword(user, newPassword);
        return { ok:true };
      }catch(e){
        return { ok:false, error: friendlyAuthError(e) };
      }
    },

    // Verifies the currently signed-in user's password WITHOUT changing anything —
    // used to re-confirm identity before a sensitive action (e.g. correcting an
    // already-archived historical result).
    async reauthenticate(password){
      if(!authReady) return { ok:false, error:"雲端服務尚未就緒" };
      const user = authHandle.currentUser;
      if(!user || !user.email) return { ok:false, error:"尚未登入" };
      try{
        const credential = ax.EmailAuthProvider.credential(user.email, password);
        await ax.reauthenticateWithCredential(user, credential);
        return { ok:true };
      }catch(e){
        return { ok:false, error: friendlyAuthError(e) };
      }
    }
  };


  function generateRoomCode(){
    let code = "";
    for(let i=0;i<ROOM_CODE_LENGTH;i++) code += ROOM_CODE_CHARS[Math.floor(Math.random()*ROOM_CODE_CHARS.length)];
    return ROOM_CODE_PREFIX + code;
  }

  function computeTournamentPhase(data){
    const realMatches = ((data && data.matches) || []).filter(m=>!m.isBye);
    if(realMatches.length===0) return "waiting";
    return realMatches.every(m=>m.completed) ? "done" : "live";
  }

  function currentUserUidForWrites(){
    try{ return (authReady && authHandle && authHandle.currentUser) ? authHandle.currentUser.uid : null; }
    catch(e){ return null; }
  }

  async function docExists(code){
    const snap = await fx.getDoc(fx.doc(dbHandle, "tournaments", code));
    return snap.exists();
  }

  window.cloudSync = {
    async connect(){ return await tryInitFirebase(); },
    isConfigured(){ return isConfigPresent(); },
    isEnabled(){ return cloudEnabled; },

    // Player-facing browsing (Phase 2): fetches public tournaments for the
    // "找賽事" screen. Deliberately uses a SINGLE where() clause (visibility
    // == 'public') to avoid requiring a composite index — everything else
    // (phase, registration status, keyword/date/region/format) is filtered
    // client-side in the calling code. Fine for the scale BXH actually runs
    // at; would need real indexes + pagination if this ever needs to handle
    // thousands of concurrent public tournaments.
    async queryPublicTournaments(){
      if(!cloudEnabled) return [];
      try{
        const q = fx.query(fx.collection(dbHandle,"publicTournaments"), fx.where("visibility","==","public"));
        const snap = await fx.getDocs(q);
        const results = [];
        snap.forEach(docSnap=>{
          const d = docSnap.data();
          try{
            results.push(Object.assign({ code: docSnap.id }, d, { parsedData: JSON.parse(d.data) }));
          }catch(e){ /* skip corrupt entries rather than fail the whole list */ }
        });
        return results;
      }catch(e){
        console.warn("查詢公開賽事失敗", e);
        return [];
      }
    },

    // Real round-trip diagnostic: writes a small test document, reads it back,
    // deletes it, and reports exactly what happened at each stage (with the
    // raw Firebase error message if something fails) so this can be trusted
    // as ground truth rather than a guess.
    async testConnection(){
      const result = { configured:false, sdkLoaded:false, writeOk:false, readOk:false, deleteOk:false, latencyMs:null, error:null, projectId: FIREBASE_CONFIG.projectId||null };
      result.configured = isConfigPresent();
      if(!result.configured){
        result.error = "尚未在 FIREBASE_CONFIG 填入設定值";
        return result;
      }
      const t0 = Date.now();
      const ok = await tryInitFirebase();
      result.sdkLoaded = ok && cloudEnabled;
      if(!result.sdkLoaded){
        result.error = "Firebase SDK 初始化失敗（可能是網路被阻擋、專案設定錯誤，或此環境不允許對外連線）";
        return result;
      }
      try{
        const testDocRef = fx.doc(dbHandle, "tournaments", "_bxh_diagnostic_ping");
        await fx.setDoc(testDocRef, { ts: Date.now() });
        result.writeOk = true;
        const snap = await fx.getDoc(testDocRef);
        result.readOk = snap.exists();
        if(fx.deleteDoc){
          try{ await fx.deleteDoc(testDocRef); result.deleteOk = true; }catch(e){ result.deleteOk = false; }
        }
        result.latencyMs = Date.now() - t0;
      }catch(e){
        result.error = (e && e.code) ? (e.code + "："+(e.message||"")) : String(e);
        result.latencyMs = Date.now() - t0;
      }
      return result;
    },

    async createRoom(data){
      if(!cloudEnabled) return null;
      try{
        let code, tries=0;
        do{
          code = generateRoomCode();
          tries++;
        } while(tries<12 && await docExists(code));
        const m = (data && data.meta) || {};
        const registrationFields = {
          registrationEnabled: !!m.registrationEnabled,
          registrationOpenAt: m.registrationOpenAt || null,
          registrationCloseAt: m.registrationCloseAt || null,
          registrationStatus: m.registrationStatus || null,
          capacity: m.registrationCapacity || null,
          waitlistEnabled: !!m.waitlistEnabled,
          waitlistCapacity: m.waitlistCapacity || null,
          confirmedCount: 0,
          waitlistCount: 0,
          registrationVisibility: m.registrationVisibility || "public",
          publishedAt: m.publishedAt || null,
          eventDate: m.date || "",
          checkInAt: m.checkin || "",
          startAt: m.startTime || "",
          fee: (m.registrationFee!=null ? m.registrationFee : null),
          timezone: "Asia/Taipei",
          assignedStaffUids: Array.isArray(m.assignedStaffUids) ? m.assignedStaffUids : [],
          tournamentPhase: computeTournamentPhase(data),
          location: data.meta && data.meta.location || "",
          formatType: data.meta && data.meta.formatType || "single",
          name: data.meta && data.meta.name || ""
        };
        const publicData = Object.assign({}, data, { registrations: [] });
        await fx.setDoc(fx.doc(dbHandle,"tournaments",code), Object.assign({
          data: JSON.stringify(data),
          updatedAt: Date.now(),
          visibility: "public",
          createdBy: currentUserUidForWrites()
        }, registrationFields));
        await fx.setDoc(fx.doc(dbHandle,"publicTournaments",code), Object.assign({
          data: JSON.stringify(publicData),
          updatedAt: Date.now(),
          visibility: "public"
        }, registrationFields));
        return code;
      }catch(e){
        console.warn("建立雲端賽事代碼失敗", e);
        return null;
      }
    },

    // Admin/staff use only — reads the FULL tournament document (includes
    // registrations with partial phone numbers etc). Guests must use
    // joinRoomPublic() instead, which the new Security Rules also enforce
    // server-side regardless of which function the client calls.
    async joinRoom(code){
      if(!cloudEnabled || !code) return null;
      try{
        const snap = await fx.getDoc(fx.doc(dbHandle,"tournaments",String(code).toUpperCase()));
        if(!snap.exists()) return null;
        const d = snap.data();
        return JSON.parse(d.data);
      }catch(e){
        console.warn("加入雲端賽事代碼失敗", e);
        return null;
      }
    },

    // Guest/public use — reads the filtered publicTournaments document only.
    async joinRoomPublic(code){
      if(!cloudEnabled || !code) return null;
      try{
        const snap = await fx.getDoc(fx.doc(dbHandle,"publicTournaments",String(code).toUpperCase()));
        if(!snap.exists()) return null;
        const d = snap.data();
        return JSON.parse(d.data);
      }catch(e){
        console.warn("加入雲端賽事代碼失敗", e);
        return null;
      }
    },

    async pushUpdate(code, data){
      if(!cloudEnabled || !code) return false;
      try{
        const m = (data && data.meta) || {};
        const registrationFields = {
          // Top-level fields mirrored from meta so Phase 2+ can query across
          // tournaments (e.g. "find open registration events") without needing
          // to parse the full JSON blob. Kept in sync on every push.
          registrationEnabled: !!m.registrationEnabled,
          registrationOpenAt: m.registrationOpenAt || null,
          registrationCloseAt: m.registrationCloseAt || null,
          registrationStatus: m.registrationStatus || null,
          capacity: m.registrationCapacity || null,
          waitlistEnabled: !!m.waitlistEnabled,
          waitlistCapacity: m.waitlistCapacity || null,
          confirmedCount: 0, // Phase 1: no real registrations subcollection yet — never fabricate a count
          waitlistCount: 0,
          registrationVisibility: m.registrationVisibility || "public",
          publishedAt: m.publishedAt || null,
          eventDate: m.date || "",
          checkInAt: m.checkin || "",
          startAt: m.startTime || "",
          fee: (m.registrationFee!=null ? m.registrationFee : null),
          timezone: "Asia/Taipei",
          assignedStaffUids: Array.isArray(m.assignedStaffUids) ? m.assignedStaffUids : [],
          tournamentPhase: computeTournamentPhase(data),
          location: data.meta && data.meta.location || "",
          formatType: data.meta && data.meta.formatType || "single",
          name: data.meta && data.meta.name || ""
        };
        const publicData = Object.assign({}, data, { registrations: [] });
        await fx.setDoc(fx.doc(dbHandle,"tournaments",String(code).toUpperCase()), Object.assign({
          data: JSON.stringify(data),
          updatedAt: Date.now(),
          visibility: "public"
        }, registrationFields), { merge:true });
        await fx.setDoc(fx.doc(dbHandle,"publicTournaments",String(code).toUpperCase()), Object.assign({
          data: JSON.stringify(publicData),
          updatedAt: Date.now(),
          visibility: "public"
        }, registrationFields), { merge:true });
        return true;
      }catch(e){
        console.warn("雲端同步寫入失敗", e);
        return false;
      }
    },

    // Re-reads the tournament document inside a real Firestore transaction, hands the
    // freshest server-known state to validateAndApplyFn (which must return
    // {ok:true, state} or {ok:false, reason}), and only commits the write if the
    // caller's own validation approves it against that fresh data. If another device
    // changed the document between when this client last read it and now, this read
    // sees the newer data, so the win-condition check runs against reality, not a
    // stale local copy. If Firestore detects a write conflict during commit, it retries
    // the whole callback automatically (this is what runTransaction does), and if the
    // callback throws, the entire transaction is aborted with nothing written.
    // Also mirrors the result to publicTournaments/{code} (minus registrations) in the
    // SAME transaction, so guests watching live see the confirmed result immediately.
    async confirmMatchTransaction(code, validateAndApplyFn){
      if(!cloudEnabled || !code || !fx.runTransaction){
        return { ok:false, reason:"cloud-unavailable" };
      }
      const ref = fx.doc(dbHandle, "tournaments", String(code).toUpperCase());
      const publicRef = fx.doc(dbHandle, "publicTournaments", String(code).toUpperCase());
      try{
        const outcome = await fx.runTransaction(dbHandle, async (tx)=>{
          const snap = await tx.get(ref);
          if(!snap.exists()) throw new Error("not-found");
          const docData = snap.data();
          let remoteState;
          try{ remoteState = JSON.parse(docData.data); }catch(e){ throw new Error("corrupt-data"); }
          const result = validateAndApplyFn(remoteState);
          if(!result || !result.ok) throw new Error((result && result.reason) || "validation-failed");
          tx.set(ref, { data: JSON.stringify(result.state), updatedAt: Date.now() }, { merge:true });
          const publicState = Object.assign({}, result.state, { registrations: [] });
          tx.set(publicRef, { data: JSON.stringify(publicState), updatedAt: Date.now(), tournamentPhase: computeTournamentPhase(result.state) }, { merge:true });
          return result;
        });
        return { ok:true, state: outcome.state };
      }catch(e){
        return { ok:false, reason: (e && e.message) || String(e) };
      }
    },

    // callback(parsedData, updatedAt) 只會在「來自其他裝置的確認寫入」時觸發，
    // 不會因為自己剛剛送出的寫入而重複觸發一次自己
    // Admin/staff use only — subscribes to the FULL tournament document.
    subscribe(code, callback){
      if(!cloudEnabled || !code) return ()=>{};
      try{
        const ref = fx.doc(dbHandle,"tournaments",String(code).toUpperCase());
        const unsub = fx.onSnapshot(ref, { includeMetadataChanges:true }, (snap)=>{
          if(!snap.exists()) return;
          if(snap.metadata.hasPendingWrites) return; // 略過自己剛寫入、尚未確認的本地回音
          const d = snap.data();
          try{
            const parsed = JSON.parse(d.data);
            callback(parsed, d.updatedAt);
          }catch(e){}
        }, (err)=>{
          console.warn("雲端同步監聽發生錯誤，可能已離線", err);
        });
        return unsub;
      }catch(e){
        console.warn("建立雲端監聽失敗", e);
        return ()=>{};
      }
    },

    // Guest/public use — subscribes to the filtered publicTournaments document only.
    subscribePublic(code, callback){
      if(!cloudEnabled || !code) return ()=>{};
      try{
        const ref = fx.doc(dbHandle,"publicTournaments",String(code).toUpperCase());
        const unsub = fx.onSnapshot(ref, { includeMetadataChanges:true }, (snap)=>{
          if(!snap.exists()) return;
          if(snap.metadata.hasPendingWrites) return;
          const d = snap.data();
          try{
            const parsed = JSON.parse(d.data);
            callback(parsed, d.updatedAt);
          }catch(e){}
        }, (err)=>{
          console.warn("雲端同步監聽發生錯誤，可能已離線", err);
        });
        return unsub;
      }catch(e){
        console.warn("建立雲端監聽失敗", e);
        return ()=>{};
      }
    }
  };

  tryInitFirebase().then((ok)=>{
    window.dispatchEvent(new CustomEvent("bxh-cloud-ready", { detail:{ enabled: ok, configured: isConfigPresent() } }));
  });
</script>
</body>
</html>
