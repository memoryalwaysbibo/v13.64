<!DOCTYPE html>
<!--
========================================================================
BXH ARENA｜雲端同步設定教學（Firebase）
========================================================================

這個檔案預設是「純本機模式」，不需要任何設定就能正常運作，所有資料只存在
您目前使用的這個瀏覽器裡。

如果想要「跨裝置即時同步」（例如：主辦人用電腦操作比分，選手/觀眾用手機
即時看到最新戰況），可以照著以下步驟免費申請一組 Firebase 專案，大約
10 分鐘可以完成：

【第一步：建立 Firebase 專案】
1. 開啟 https://console.firebase.google.com/
2. 使用 Google 帳號登入。
3. 點擊「新增專案」，輸入專案名稱（例如：bxh-arena），一路下一步完成建立。
   （可以關閉 Google Analytics，不影響本系統使用）

【第二步：建立 Firestore 資料庫】
1. 左側選單點「Firestore Database」。
2. 點「建立資料庫」。
3. 位置選擇離您最近的地區（例如 asia-east1）。
4. 安全性規則先選「測試模式」（30 天後會過期，正式使用建議改用下方規則）。

【第三步：設定安全性規則（v13.5.0 重大安全性修正，請務必完整更新為以下版本，
不要只更新部分區塊）】
進入 Firestore Database →「規則」分頁，貼上以下規則後點「發布」：

    rules_version = '2';
    service cloud.firestore {
      match /databases/{database}/documents {

        // ==== 共用角色判斷函式 ====
        // 統一從這裡讀取角色與 active 狀態，避免各處判斷邏輯不一致。
        function isSignedIn() {
          return request.auth != null;
        }
        function myProfile() {
          return get(/databases/$(database)/documents/users/$(request.auth.uid)).data;
        }
        // 三層工作人員角色：super_admin（完整管理）> admin（可建立及管理賽事）
        // > staff（僅能操作被分派或未設限的賽事）。三者皆必須 active === true
        // 才視為有效，停用帳號一律視為無權限，即使角色欄位還是工作人員角色。
        function isSuperAdmin() {
          return isSignedIn() && myProfile().active == true && myProfile().role == 'super_admin';
        }
        function isAdminOrAbove() {
          return isSignedIn() && myProfile().active == true &&
            (myProfile().role == 'super_admin' || myProfile().role == 'admin');
        }
        function isStaffOrAbove() {
          return isSignedIn() && myProfile().active == true &&
            (myProfile().role == 'super_admin' || myProfile().role == 'admin' || myProfile().role == 'staff');
        }
        // staff 僅能操作「被分派」的賽事。為了不讓既有賽事（尚未設定
        // assignedStaffUids 欄位，或欄位為空陣列）把所有現職 staff 鎖在外面，
        // 未設定分派名單時預設視為「開放給任何在職 staff」，管理員可以之後
        // 針對特定賽事填入 assignedStaffUids 陣列來收緊到指定人員。
        function isAssignedStaff(tdata) {
          return isSignedIn() && myProfile().active == true && myProfile().role == 'staff' &&
            (!('assignedStaffUids' in tdata) || tdata.assignedStaffUids.size() == 0
             || request.auth.uid in tdata.assignedStaffUids);
        }
        function canManageTournament(tdata) {
          return isAdminOrAbove() || isAssignedStaff(tdata);
        }

        // ==== 系統啟動旗標 ====
        // 改用 exists() 安全判斷，避免文件尚未建立時 resource.data 為 null
        // 導致規則評估直接失敗；同時確保 superAdminExists 一旦為 true，之後
        // 任何人都無法再次寫入（包含改回 false 或覆寫），杜絕搶占。
        function bootstrapExists() {
          return exists(/databases/$(database)/documents/system/bootstrap) &&
                 get(/databases/$(database)/documents/system/bootstrap).data.superAdminExists == true;
        }
        match /system/bootstrap {
          allow read: if true;
          allow write: if isSignedIn()
            && request.resource.data.superAdminExists == true
            && !bootstrapExists();
        }

        // ==== 使用者帳號資料（私人，僅本人及管理層可完整讀取）====
        // read：僅本人或 admin 以上；staff 若需要辨識選手身分，改讀下方的
        // publicPlayers（不含 Email/電話）。
        //
        // create（安全性修正，v13.8.0）：原本只檢查 role 欄位本身，沒有限制
        // 「還夾帶了哪些其他欄位」，理論上可以在自行建立文件時夾帶
        // active/verified/approvalStatus/permissions/ladderPoints/ranking 等
        // 受保護欄位並自行賦予任意值。現在依照 HTML 實際寫入的欄位，分別為
        // 「玩家自助建立」與「工作人員由管理後台建立」各自訂出明確白名單
        // （request.resource.data.keys().hasOnly(...)），且對安全敏感欄位加上
        // 具體值與型別檢查，任何白名單以外或型別不符的欄位一律拒絕整筆寫入。
        match /users/{uid} {
          allow read: if isSignedIn() && (request.auth.uid == uid || isAdminOrAbove());

          allow create: if isSignedIn() && (
            (
              // 玩家自助建立帳號／完成 Google 資料：對應
              // applyPlayerAccount() 與 completePlayerProfile()
              // 實際寫入的完整欄位集合，一個都不能多、也不能少。
              request.auth.uid == uid
              && request.resource.data.keys().hasOnly([
                   'uid','email','displayName','realName','nickname','phone','phoneVerified',
                   'role','active','provider','profileCompleted','createdAt','updatedAt','lastLoginAt'
                 ])
              && request.resource.data.uid == uid
              && request.resource.data.email is string
              && request.resource.data.displayName is string
              && request.resource.data.realName is string
              && request.resource.data.nickname is string
              && request.resource.data.phone is string
              && request.resource.data.provider is string
              // 安全初始值：這些欄位第一次建立時必須固定為下列值，不可由
              // 使用者自行帶入其他值（例如提早把 active 設為 false 規避審核、
              // 或偽造 profileCompleted）。
              && request.resource.data.role == 'player'
              && request.resource.data.active == true
              && request.resource.data.phoneVerified == false
              && request.resource.data.profileCompleted == true
              // 明確禁止：不在白名單內，寫了就直接整筆拒絕，包含
              // permissions、ladderPoints、ranking、approvalStatus、
              // verified 等欄位。
            )
            || (
              // 系統尚未有任何 super_admin 時的一次性 bootstrap，或由現有
              // super_admin/admin 透過管理後台建立工作人員帳號。呼叫端使用
              // 獨立的暫時 Firebase App 實例建立 Auth 帳號，避免自己的登入
              // 狀態被換成新帳號，因此這裡的 request.auth 在「由管理員建立」
              // 的情況下，仍是原本呼叫的管理員本人。對應 createSuperAdmin()
              // 與 createManagedUser() 實際寫入的欄位集合。
              request.resource.data.keys().hasOnly(['displayName','email','role','active','createdAt','lastLoginAt'])
              && request.resource.data.displayName is string
              && request.resource.data.email is string
              && request.resource.data.active == true
              && (
                (request.auth.uid == uid && request.resource.data.role == 'super_admin' && !bootstrapExists())
                || (isSuperAdmin() && request.auth.uid != uid && request.resource.data.role == 'admin')
                || (isAdminOrAbove() && request.auth.uid != uid && request.resource.data.role == 'staff')
              )
            )
          );

          allow update: if isSuperAdmin()
            || (
              // admin 可以協助停用/恢復帳號，但不能碰 super_admin 帳號，也不能
              // 透過這個管道修改角色本身（角色升降只留給 super_admin）
              isAdminOrAbove() && resource.data.role != 'super_admin'
              && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['active','updatedAt'])
            )
            || (
              // 本人可自行更新暱稱/公開顯示名稱/頭像/電話——不分角色，
              // super_admin/admin/staff 第一次進入玩家模式補齊資料時也是走這裡。
              // realName 可以包含在這次更新裡，但只有在原本欄位是空的（第一次
              // 補齊）時才允許；一旦已經填過，之後就不能透過這個管道再自行
              // 更改（本名制，需要管理員協助更名）。
              isSignedIn() && request.auth.uid == uid
              && request.resource.data.diff(resource.data).affectedKeys()
                   .hasOnly(['nickname','publicDisplayName','avatarUrl','phone','realName','updatedAt'])
              && (
                !('realName' in request.resource.data.diff(resource.data).affectedKeys())
                || !('realName' in resource.data) || resource.data.realName == null || resource.data.realName == ""
              )
            );
          allow delete: if isSuperAdmin();

          match /registrationRefs/{tid} {
            allow read: if isSignedIn() && (request.auth.uid == uid || isStaffOrAbove());
            allow write: if isStaffOrAbove();
          }
        }

        // ==== 公開玩家資料（任何人可讀，僅限安全欄位）====
        // 供公開排行榜、觀賽頁面顯示玩家暱稱等用途。絕不包含 Email、電話、
        // 角色、天梯積分內部計算資料等敏感欄位。
        //
        // 安全性修正（v13.8.0）：
        // 1. 原本 allow write 用同一條 diff(resource.data) 同時處理
        //    create/update；文件第一次建立時 resource 尚不存在，diff() 對
        //    「原本不存在的文件」求值行為不明確，可能導致既有工作人員第一次
        //    進入玩家模式、要建立自己的 publicPlayers 文件時失敗。現在拆成
        //    獨立的 create（用 keys().hasOnly()）與 update（用
        //    diff().affectedKeys().hasOnly()），語意明確、互不干擾。
        // 2. 不論是 admin 以上或本人寫入，都必須通過同一份白名單與型別檢查，
        //    避免「反正是 admin 寫的就不檢查」造成 email/phone/realName/
        //    role/permissions/active/積分等私人或管理欄位被意外寫入公開集合。
        // 3. 本人不可刪除自己的公開玩家資料（避免玩家惡意消失於公開排行榜
        //    造成資料不一致），刪除僅限 admin 以上。
        match /publicPlayers/{uid} {
          allow read: if true;

          allow create: if (isAdminOrAbove() || (isSignedIn() && request.auth.uid == uid))
            && request.resource.data.keys().hasOnly(['publicName','avatarUrl','updatedAt'])
            && request.resource.data.publicName is string
            && (!('avatarUrl' in request.resource.data) || request.resource.data.avatarUrl == null || request.resource.data.avatarUrl is string)
            && request.resource.data.updatedAt is number;

          allow update: if (isAdminOrAbove() || (isSignedIn() && request.auth.uid == uid))
            && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['publicName','avatarUrl','updatedAt'])
            && request.resource.data.publicName is string
            && (!('avatarUrl' in request.resource.data) || request.resource.data.avatarUrl == null || request.resource.data.avatarUrl is string);

          allow delete: if isAdminOrAbove();
        }

        // ==== 賽事完整資料（管理用，僅工作人員可讀寫，絕不公開）====
        // 完整資料一律限定工作人員以上才能讀取；遊客／未登入者／player 一律
        // 改讀下方的 publicTournaments（只含安全公開欄位）。
        // create 限定 admin 以上，staff 不能自行「建立」新賽事。
        //
        // update 安全性修正（v13.8.0）：原本只驗證「修改前」的 resource.data
        // 是否允許這位 staff 操作，卻沒有限制「這次更新本身能不能修改
        // assignedStaffUids／擁有權/管理欄位」——代表已被指派的 staff，
        // 理論上可以自行把 assignedStaffUids 清空或改成只留自己，等於自己
        // 解除賽事的存取限制。現在明確規定：
        //   - admin 以上：可以修改 assignedStaffUids、visibility、
        //     createdBy 等任何欄位（信任管理層）。
        //   - staff（僅限已被分派或未設限的賽事）：可以修改比分/場次狀態等
        //     一般賽事資料（data、updatedAt 及各項報名狀態鏡像欄位），但
        //     一律不能修改 assignedStaffUids、visibility、createdBy 這三個
        //     屬於賽事「所有權與管理權限」的欄位——只要這次更新的異動欄位
        //     包含其中任何一個，整筆更新直接拒絕。
        match /tournaments/{code} {
          allow read: if isStaffOrAbove();
          allow create: if isAdminOrAbove();
          allow update: if isAdminOrAbove()
            || (
              isAssignedStaff(resource.data)
              && !request.resource.data.diff(resource.data).affectedKeys().hasAny(['assignedStaffUids','visibility','createdBy'])
            );
          allow delete: if isAdminOrAbove();

          match /registrations/{uid} {
            allow read: if isSignedIn() && (request.auth.uid == uid || isStaffOrAbove());
            allow write: if canManageTournament(get(/databases/$(database)/documents/tournaments/$(code)).data);
          }
          match /participants/{playerId} {
            allow read: if isStaffOrAbove();
            allow write: if canManageTournament(get(/databases/$(database)/documents/tournaments/$(code)).data);
          }
        }

        // ==== 賽事公開資料（安全的公開子集）====
        // 內部主鍵與這裡的文件 ID 是同一組值：目前系統沒有另外的
        // tournamentId，賽事代號（例如 BXH-K7M2XQ）本身就是文件 ID、也就是
        // tournamentId；publicCode 一詞若在文件中出現，指的是同一組值，只是
        // 強調「這是拿來公開查詢用的代號」，兩者不是兩個不同系統的 ID。
        //
        // visibility 與 registrationVisibility 是兩個不同的開關，不可混用：
        //   visibility：整場賽事「是否可被觀看」的總開關（例如遊客能不能透過
        //               網址/代碼進入觀賽）。
        //   registrationVisibility：賽事「是否出現在玩家找賽事清單」的開關，
        //               即使 visibility 是 public，registrationVisibility 仍
        //               可以是 private（例如邀請制報名，但仍開放公開觀賽）。
        //
        // 安全性修正（v13.8.0）：
        // 1. read 原本是 resource.data.visibility=='public' || isSignedIn()，
        //    代表任何已登入的 player 都能讀到「非公開」賽事的公開鏡像，與
        //    既定權限矩陣不符。改為 isStaffOrAbove()——非公開賽事只有工作
        //    人員能讀。目前系統沒有「玩家已報名、因此可以讀取非公開賽事」
        //    這個功能（線上報名的正式寫入還在 Phase 3，尚未實作），因此暫時
        //    不開放任何 player 例外；未來若要加入「已報名玩家可讀私人賽事」，
        //    需要新增一個精確條件，例如
        //    exists(/databases/$(database)/documents/tournaments/$(code)/registrations/$(request.auth.uid))，
        //    而不是籠統地用 isSignedIn() 全部放行。
        // 2. create/update 原本只檢查「誰能寫」，沒有限制「能寫哪些欄位、
        //    型別是否正確」，代表如果程式碼哪天不小心把完整 data、
        //    registrations 陣列或工作人員私人資訊寫進來，Rules 完全不會
        //    阻擋。現在依照 HTML 實際產生公開鏡像時使用的欄位，建立明確
        //    白名單並驗證關鍵欄位型別。email、phone、phone3、
        //    internalNotes、reports、registrations 等欄位皆不在白名單內，
        //    一旦出現在寫入內容中就會被整筆拒絕。
        //    （誠實限制：data 欄位本身是字串化的 JSON，Rules 無法檢查字串
        //    內部實際包了哪些欄位——這裡只能確保 data 是字串型別、且頂層
        //    欄位符合白名單；「data 字串內部已經先移除 registrations」這件
        //    事仍然依賴應用程式碼本身正確處理，Rules 對字串內容沒有查驗
        //    能力，這是 Firestore Rules 語言本身的限制，不是本次修正沒做到。）
        match /publicTournaments/{code} {
          allow read: if resource.data.visibility == 'public' || isStaffOrAbove();

          // 安全性修正（v13.7.4）：原本的 create/update 用
          // canManageTournament(get(/databases/.../tournaments/$(code)).data)
          // 檢查是否可操作「對應的那一場」賽事——但 createRoom() 是先寫入
          // tournaments/{code}、再另外寫入 publicTournaments/{code}，這是
          // 兩次獨立、非交易（non-transactional）的寫入。第二次寫入的規則
          // 卻要求讀取第一次寫入的文件，一旦這個跨文件讀取在極端情況下
          // 出現任何時序問題，第二次寫入就會被規則引擎拒絕，導致
          // createRoom() 拋出例外、回傳 null，使用者端顯示「雲端連線
          // 失敗」——這正是實際發生的問題。
          // 修正：不再依賴讀取平行的 tournaments 文件，改為直接檢查寫入者
          // 本身是否為工作人員以上（isStaffOrAbove()）。這裡存放的本來就是
          // 「可公開的鏡像資料」，真正需要保護的「是否為此賽事的被指派人員」
          // 這一層，已經由 tournaments/{code} 本身的規則把關（staff 若沒有
          // 權限操作某場賽事，根本不會、也不能先成功寫入 tournaments/{code}，
          // 自然也不會走到這裡）；此處只需確認寫入者是有效在職工作人員即可。
          allow create: if isStaffOrAbove()
            && request.resource.data.keys().hasOnly([
                 'data','updatedAt','visibility',
                 'registrationEnabled','registrationOpenAt','registrationCloseAt','registrationStatus',
                 'capacity','waitlistEnabled','waitlistCapacity','confirmedCount','waitlistCount',
                 'registrationVisibility','publishedAt','eventDate','checkInAt','startAt','fee','timezone',
                 'assignedStaffUids','tournamentPhase','location','formatType','name'
               ])
            && request.resource.data.data is string
            && request.resource.data.visibility is string
            && request.resource.data.updatedAt is number;

          allow update: if isStaffOrAbove()
            && request.resource.data.diff(resource.data).affectedKeys().hasOnly([
                 'data','updatedAt','visibility',
                 'registrationEnabled','registrationOpenAt','registrationCloseAt','registrationStatus',
                 'capacity','waitlistEnabled','waitlistCapacity','confirmedCount','waitlistCount',
                 'registrationVisibility','publishedAt','eventDate','checkInAt','startAt','fee','timezone',
                 'assignedStaffUids','tournamentPhase','location','formatType','name'
               ])
            && request.resource.data.data is string;
        }
      }
    }

   遷移影響：本次新增 publicTournaments／publicPlayers 兩個新集合，寫入邏輯
   已同步修改為「每次同步時，除了完整資料寫入 tournaments，也會另外寫一份
   過濾後的公開資料到 publicTournaments」，不會刪除或搬移任何既有
   tournaments 文件，賽事代號（文件 ID）維持不變，不需要資料遷移。既有
   users/{uid} 文件的角色與資料欄位皆保留原樣，新規則只是收緊「誰能讀取／
   修改哪些欄位」，不會改變任何欄位的現有內容。

   請注意：canManageTournament() 對「尚未設定 assignedStaffUids」的既有賽事
   採取「開放給任何在職 staff」的過渡設計，讓現職工作人員不會因為這次規則
   收緊而立刻無法操作賽事；若您希望立即收緊到「僅限指定人員」，需要先在
   賽事設定中為該賽事填入 assignedStaffUids，本次已提供最簡易的指派介面。

   建議建立的複合索引（供 Phase 2 玩家瀏覽賽事使用，注意集合改成
   publicTournaments，不是 tournaments——玩家瀏覽走的是公開集合）：
   - publicTournaments 集合：registrationVisibility (ASC) + registrationStatus (ASC) + eventDate (ASC)
     用途：玩家「找賽事」瀏覽開放報名的公開賽事，依日期排序
   - publicTournaments 集合：registrationStatus (ASC) + publishedAt (DESC)
     用途：依發布時間列出最新開放報名的賽事

【Email/Password 登入】
請到 Firebase Console →「Authentication」→「Sign-in method」，啟用
「Email/Password」提供者（若您已經啟用，可略過此步驟）。

【第四步：註冊網頁應用程式，取得設定值】
1. 回到專案總覽頁，點選「</>」（新增網頁應用程式）圖示。
2. 輸入應用程式名稱（例如：bxh-web），完成註冊。
3. Firebase 會顯示一段 firebaseConfig 設定物件，把裡面六個值複製起來。

【第五步：貼入本檔案】
在下方 <script type="module"> 區塊中，找到 FIREBASE_CONFIG 這個物件，
把您剛剛複製的六個值分別貼進對應欄位（apiKey、authDomain、projectId、
storageBucket、messagingSenderId、appId），存檔即可。

【第六步：部署到 GitHub Pages（選用）】
1. 建立一個新的 GitHub Repository，把這個 .html 檔案改名為 index.html
   後上傳（或放進 repo 根目錄）。
2. 到 Repository 的 Settings → Pages，Source 選擇您上傳的分支與資料夾。
3. 幾分鐘後即可透過 GitHub 提供的網址（例如：
   https://your-account.github.io/your-repo/）在任何裝置開啟並使用雲端同步。

【如果沒有設定 Firebase】
FIREBASE_CONFIG 保持空白（預設狀態）時，系統會自動偵測並停留在「僅本機」
模式，所有既有功能完全不受影響，畫面上的雲端連線狀態列會顯示「僅本機」。
========================================================================

<style>
:root{

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}

}

input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{height:8px;width:8px;}

.status-waiting{color:var(--metal);border-color:var(--border);}
.status-live{color:var(--danger);border-color:var(--danger);background:var(--danger-glow);}
.status-done{color:var(--neon);border-color:var(--neon-dim);background:var(--neon-glow);}

nav.tabs{

main{flex:1;padding:16px;max-width:1180px;margin:0 auto;width:100%;}
@media (max-width:640px){main{padding:12px;}}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.panel + .panel{margin-top:14px;}
.panel-title{font-family:var(--font-d);font-weight:700;font-size:16px;color:var(--white);margin:0 0 12px;letter-spacing:0.3px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}

.grid{display:grid;gap:12px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}

.stat-box{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:12px 14px;}
.stat-box .label{font-size:12px;color:var(--metal);margin-bottom:4px;}
.stat-box .value{font-family:var(--font-d);font-weight:700;font-size:26px;color:var(--neon);}

.btn{

.btn-ghost{background:transparent;border-color:var(--border);color:var(--metal);}

.btn-block{width:100%;}
.btn-sm{padding:8px 12px;font-size:13px;min-height:38px;}

.btn-row{display:flex;gap:10px;flex-wrap:wrap;}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:13px;color:var(--metal);font-weight:500;}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number],.field select,.field textarea{

.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--neon-dim);}
.field textarea{min-height:180px;resize:vertical;font-family:var(--font-b);line-height:1.6;}
.hint{font-size:12px;color:var(--metal-dim);margin-top:2px;}
.warn-text{font-size:12px;color:var(--danger);margin-top:4px;}

.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;font-family:var(--font-d);}
.badge-neon{background:var(--neon-glow);color:var(--neon);border:1px solid var(--neon-dim);}
.badge-danger{background:var(--danger-glow);color:var(--danger);border:1px solid var(--danger);}

table.rank-table{width:100%;border-collapse:collapse;font-size:14px;}
table.rank-table th{text-align:left;color:var(--metal);font-weight:600;font-size:12px;padding:8px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}

table.rank-table tr:last-child td{border-bottom:none;}
.rank-scroll{overflow-x:auto;max-height:420px;overflow-y:auto;}
.rank-name{color:var(--white);font-weight:600;}
.rank-num{font-family:var(--font-d);font-weight:700;color:var(--neon);}

.match-live-card{background:linear-gradient(135deg, rgba(255,59,59,0.08), rgba(233,255,46,0.04));border:1px solid var(--danger);border-radius:var(--radius);padding:16px;}
.match-live-card .top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}

.match-live-card .sc{font-family:var(--font-d);font-weight:700;font-size:32px;color:var(--neon);}
.match-live-card .mid{color:var(--metal);font-size:13px;}

.bracket-wrap{position:relative;z-index:1;overflow-x:auto;padding-bottom:8px;}
.event-title-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:12px;}

}
.share-btn{
  position:relative;width:44px;height:44px;flex-shrink:0;border-radius:50%;
  background:rgba(10,10,11,0.72);border:1px solid var(--gold-dim);color:var(--gold);
  display:flex;align-items:center;justify-content:center;
  transition:box-shadow .15s, transform .08s, border-color .15s;
}
.share-btn:hover{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-glow);}

.checkin-btn-done{background:rgba(61,220,132,0.14);border:1px solid var(--ok);color:var(--ok);}

.share-modal-box{max-width:440px;}
.share-modal-header{display:flex;align-items:center;gap:12px;}
.share-modal-logo{width:44px;height:44px;object-fit:contain;flex-shrink:0;}
.share-summary-box{margin-top:12px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.7;color:var(--white);white-space:normal;}
.bracket-wm-wrap{position:relative;}
.bracket-wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;overflow:hidden;}
.bracket-wm img{width:100%;height:100%;object-fit:contain;opacity:0.07;filter:saturate(0.5);}
.se-bracket-outer{position:relative;}
.se-bracket-svg{position:absolute;left:0;top:0;z-index:1;pointer-events:none;}
.se-bracket-cols{display:flex;gap:56px;min-width:max-content;padding:8px 4px;position:relative;z-index:2;}
.se-col{display:flex;flex-direction:column;min-width:220px;position:relative;}
.se-col-title{font-family:var(--font-d);font-weight:700;font-size:13px;color:var(--metal);text-align:center;margin-bottom:14px;letter-spacing:1px;}
.se-col[data-round="0"] .match-box{position:relative;margin-bottom:22px;}
.se-col[data-round="0"] .match-box:last-child{margin-bottom:0;}
.se-col:not([data-round="0"]) .match-box{position:absolute;left:0;right:0;top:0;}
.se-bronze-col{margin-top:0;}
.bracket-cols{display:flex;gap:34px;min-width:max-content;padding:8px 4px;}
.bracket-col{display:flex;flex-direction:column;justify-content:space-around;gap:18px;min-width:220px;}
.bracket-col-title{font-family:var(--font-d);font-weight:700;font-size:13px;color:var(--metal);text-align:center;margin-bottom:6px;letter-spacing:1px;}
.match-box{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;transition:border-color .15s;}
.match-box:hover{border-color:var(--neon-dim);}
.match-box.done{border-color:var(--neon-dim);}
.match-box .mb-head{font-size:11px;color:var(--metal-dim);padding:5px 10px;background:var(--panel-3);display:flex;justify-content:space-between;}
.match-box .mb-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:14px;border-top:1px solid var(--border-soft);}
.match-box .mb-row.winner{color:var(--neon);font-weight:700;}
.match-box .mb-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px;}
.match-box .mb-row .sc{font-family:var(--font-d);font-weight:700;}

/* ==== match status system (pending/ready/in_progress/completed/paused) ==== */
.match-box.ms-card-pending{border-color:#3a3d42;}
.match-box.ms-card-in_progress{
  border-color:#D4AF37;
  background:linear-gradient(160deg, rgba(212,175,55,0.06), var(--panel-2));
  box-shadow:0 0 0 1px rgba(212,175,55,0.25), 0 0 14px rgba(212,175,55,0.35);
  animation:ms-breathe-gold 1.8s ease-in-out infinite;
}
@keyframes ms-breathe-gold{
  0%,100%{ box-shadow:0 0 0 1px rgba(212,175,55,0.22), 0 0 10px rgba(212,175,55,0.22); border-color:#b8933f; }
  50%{ box-shadow:0 0 0 1.5px rgba(243,217,139,0.55), 0 0 22px rgba(212,175,55,0.55); border-color:#F3D98B; }
}
.match-box.ms-card-in_progress .mb-head{color:#D4AF37;}
.match-box.ms-card-in_progress .mb-row .sc{color:#F3D98B;font-size:16px;}

.match-box.ms-card-ready{
  border-color:#4CB8FF;
  background:linear-gradient(160deg, rgba(76,184,255,0.05), var(--panel-2));
  box-shadow:0 0 0 1px rgba(76,184,255,0.2), 0 0 12px rgba(76,184,255,0.3);
  animation:ms-breathe-ice 2.7s ease-in-out infinite;
}
@keyframes ms-breathe-ice{
  0%,100%{ box-shadow:0 0 0 1px rgba(76,184,255,0.18), 0 0 8px rgba(76,184,255,0.18); border-color:#3a92c9; }
  50%{ box-shadow:0 0 0 1.5px rgba(169,226,255,0.5), 0 0 18px rgba(76,184,255,0.4); border-color:#A9E2FF; }
}

.match-box.ms-card-completed{border-color:#6b6248;}
.match-box.ms-card-completed .mb-row.winner{color:#D4AF37;font-weight:700;}
.match-box.ms-card-completed .mb-row:not(.winner){opacity:0.55;}

.match-box.ms-card-paused{border-color:#8A6428;border-style:dashed;}

.match-status-bar{
  font-family:var(--font-d);font-size:11px;font-weight:600;
  padding:4px 10px;margin-top:6px;border-radius:4px;
  display:flex;align-items:center;gap:6px;
}
.ms-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:currentColor;}
.match-status-bar.ms-bar-in_progress{color:#D4AF37;background:rgba(212,175,55,0.12);}
.match-status-bar.ms-bar-in_progress .ms-dot{animation:ms-dot-pulse 1.8s ease-in-out infinite;}
.match-status-bar.ms-bar-ready{color:#4CB8FF;background:rgba(15,30,45,0.55);}
.match-status-bar.ms-bar-ready .ms-dot{animation:ms-dot-pulse 2.7s ease-in-out infinite;}
.match-status-bar.ms-bar-completed{color:#8FAF72;background:rgba(143,175,114,0.08);}
.match-status-bar.ms-bar-pending{color:var(--metal-dim);background:rgba(255,255,255,0.03);}
.match-status-bar.ms-bar-paused{color:#c9a24d;background:rgba(138,100,40,0.12);}
@keyframes ms-dot-pulse{0%,100%{opacity:0.4;}50%{opacity:1;}}

.match-status-legend{
  display:flex;flex-wrap:wrap;gap:14px;
  padding:10px 4px 14px;font-size:12px;color:var(--metal);
}
.legend-item{display:flex;align-items:center;gap:6px;}
.legend-swatch{width:14px;height:14px;border-radius:3px;border:2px solid;flex-shrink:0;}
.legend-in_progress{border-color:#D4AF37;box-shadow:0 0 6px rgba(212,175,55,0.5);}
.legend-ready{border-color:#4CB8FF;box-shadow:0 0 6px rgba(76,184,255,0.4);}
.legend-completed{border-color:#6b6248;}
.legend-pending{border-color:#3a3d42;}

.match-status-controls{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  margin-bottom:12px;padding:8px 12px;background:var(--panel-2);border-radius:8px;border:1px solid var(--border-soft);
}
.msc-label{font-size:12.5px;color:var(--metal);display:flex;align-items:center;gap:8px;}
.msc-btns{display:flex;gap:8px;flex-wrap:wrap;}
.ms-inline{display:inline-flex;align-items:center;gap:6px;font-weight:700;}
.ms-inline-in_progress{color:#D4AF37;}
.ms-inline-ready{color:#4CB8FF;}
.ms-inline-completed{color:#8FAF72;}
.ms-inline-pending{color:var(--metal-dim);}
.ms-inline-paused{color:#c9a24d;}
.ms-inline .ms-dot{animation-play-state:running;}
.ms-inline-in_progress .ms-dot{animation:ms-dot-pulse 1.8s ease-in-out infinite;}
.ms-inline-ready .ms-dot{animation:ms-dot-pulse 2.7s ease-in-out infinite;}

.qd-cards{display:flex;gap:16px;}
.qd-card{

}
.qd-icon{width:44px;height:44px;color:var(--gold-dim);margin-bottom:10px;}
.qd-icon svg{width:100%;height:100%;}
.qd-name{font-family:var(--font-d);font-weight:700;font-size:22px;color:var(--white);word-break:break-word;}
.qd-meta{font-size:12.5px;color:var(--metal);margin-top:6px;margin-bottom:18px;}
.qd-choose-btn{

.scoring-mode-cards{display:flex;gap:12px;margin-top:10px;}
.scoring-mode-card{

  background:var(--panel-2);border:1px solid var(--border);cursor:pointer;
}
.scoring-mode-card.active{border-color:var(--gold);background:linear-gradient(160deg, rgba(217,185,92,0.1), var(--panel-2));}
.scoring-mode-card:disabled{opacity:0.5;cursor:not-allowed;}
.smc-title{font-family:var(--font-d);font-weight:700;font-size:14px;color:var(--white);}
.scoring-mode-card.active .smc-title{color:var(--gold);}
.smc-desc{font-size:12px;color:var(--metal);margin-top:4px;}
@media (max-width:640px){

}
.round-scoring-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.round-scoring-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;background:var(--panel-2);border-radius:8px;}
.rsr-label{font-size:13px;color:var(--white);min-width:80px;font-weight:600;}

/* ==== bracket view mode toggle + board (kiosk) mode ==== */
.bracket-view-toggle{display:flex;gap:8px;margin-bottom:14px;}
.bvt-btn{flex:1;max-width:220px;padding:9px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--metal);font-family:var(--font-d);font-weight:600;font-size:13px;}
.bvt-btn.active{border-color:var(--gold);color:var(--gold);background:linear-gradient(160deg, rgba(217,185,92,0.12), var(--panel-2));}

.board-shell{
  --board-accent: #d9b95c;
  position:relative;border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg, #0d0e0a 0%, #08090a 55%, #030303 100%);
  border:1px solid var(--board-accent);padding:18px;
  box-shadow:0 20px 50px rgba(0,0,0,0.5), inset 0 0 60px rgba(0,0,0,0.4);
}
.board-shell[data-board-theme="gold"]{ --board-accent:#d9b95c; }
.board-shell[data-board-theme="cyan"]{ --board-accent:#2ee6d6; }
.board-shell[data-board-theme="violet"]{ --board-accent:#b48cff; }
.board-shell[data-board-theme="amber"]{ --board-accent:#f0a94e; }
.board-shell[data-board-theme="red"]{ --board-accent:#ef5b5b; }
.board-shell[data-board-theme="rose"]{ --board-accent:#f082b0; }
.board-shell[data-board-theme="ice"]{ --board-accent:#5fc4ff; }
.board-wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;z-index:0;}
.board-wm img{width:55%;max-width:520px;opacity:0.05;}
.board-header{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--board-accent);margin-bottom:14px;}
.board-header-left{display:flex;align-items:center;gap:12px;}
.board-logo{height:44px;width:auto;}
.board-title{font-family:var(--font-d);font-weight:700;font-size:16px;color:var(--board-accent);letter-spacing:1px;}
.board-sub{font-size:12px;color:var(--metal);margin-top:2px;}
.board-status-chip{padding:2px 8px;border-radius:10px;font-weight:700;font-size:11px;}
.board-status-chip.status-waiting{color:var(--metal);background:rgba(255,255,255,0.05);}
.board-status-chip.status-live{color:var(--danger);background:rgba(255,59,59,0.12);}
.board-status-chip.status-done{color:#8FAF72;background:rgba(143,175,114,0.12);}

.board-toolbar{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px;}
.board-toolbar .btn{color:var(--white);}
.board-toolbar .btn:hover{border-color:var(--board-accent);}
.board-zoom-group{display:flex;align-items:center;gap:6px;padding:2px 4px;border:1px solid var(--border);border-radius:8px;}
.board-zoom-group .btn{padding:4px 8px;min-height:0;}
.board-zoom-pct{font-family:var(--font-d);font-weight:700;font-size:12.5px;color:var(--board-accent);min-width:42px;text-align:center;}
.board-theme-select{background:var(--panel-2);color:var(--white);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12.5px;}

.board-viewport{
  position:relative;z-index:1;overflow:hidden;border-radius:10px;

  height:min(70vh,760px);cursor:grab;touch-action:none;
}
.board-canvas{
  transform-origin:0 0;padding:24px;width:max-content;min-width:100%;
  transition:transform .05s linear;
}
.board-champion-area{
  margin-top:26px;padding:22px;border-radius:12px;text-align:center;
  background:linear-gradient(160deg, rgba(217,185,92,0.08), rgba(0,0,0,0.2));
  border:1px solid var(--board-accent);width:220px;
}
.board-trophy{display:inline-block;width:52px;height:52px;color:var(--board-accent);}
.board-trophy svg{width:100%;height:100%;}
.board-champion-label{font-family:var(--font-d);font-weight:700;font-size:12px;letter-spacing:3px;color:var(--board-accent);margin-top:6px;}
.board-champion-name{font-family:var(--font-d);font-weight:700;font-size:22px;margin-top:6px;
  background:linear-gradient(180deg,#FFF0A6,var(--board-accent));-webkit-background-clip:text;background-clip:text;color:transparent;
}
.board-champion-name.pending{color:var(--metal-dim);background:none;-webkit-background-clip:initial;}

.board-footer{position:relative;z-index:1;display:flex;justify-content:flex-end;margin-top:10px;}
.board-code{font-family:var(--font-d);font-size:11px;color:var(--metal-dim);letter-spacing:1px;}

.board-canvas .se-bronze-col .match-box,
.board-canvas .bracket-col.se-bronze-col{border-color:#B87333;}
.board-canvas .se-bronze-col .bracket-col-title{color:#B87333;}

.board-export-freeze .match-box.ms-card-in_progress,
.board-export-freeze .match-box.ms-card-ready{animation:none !important;}
.board-export-freeze .ms-dot{animation:none !important;}

@media (max-width:640px){
  .board-shell{padding:12px;}
  .board-header{flex-direction:column;align-items:flex-start;gap:10px;}
  .board-toolbar{gap:6px;}
  .board-viewport{height:60vh;}
  .board-logo{height:34px;}
}

/* ==== version update page ==== */
.version-page{max-width:760px;margin:0 auto;}
.version-hero{
  position:relative;overflow:hidden;text-align:center;padding:28px 20px;border-radius:14px;margin-top:10px;

}
.version-hero-badge{
  display:inline-block;font-family:var(--font-d);font-weight:700;font-size:32px;

}
.version-hero-internal{font-size:12px;color:var(--metal);margin-top:2px;font-family:var(--font-d);letter-spacing:1px;}
.version-hero-title{font-family:var(--font-d);font-weight:700;font-size:18px;color:var(--white);margin-top:14px;}

.version-level-chip.level-minor{color:var(--gold);background:rgba(217,185,92,0.14);}
.version-level-chip.level-patch{color:#8FAF72;background:rgba(143,175,114,0.14);}

.version-timeline{display:flex;flex-direction:column;gap:10px;margin-top:10px;}

  border-left:3px solid var(--border);
}

.vti-version{font-family:var(--font-d);font-weight:700;font-size:14px;color:var(--white);}
.vti-meta{font-size:11.5px;color:var(--metal-dim);margin-top:2px;}
.vti-title{font-family:var(--font-d);font-weight:600;font-size:13.5px;color:var(--white);margin-top:6px;}
.vti-summary{font-size:12.5px;color:var(--metal);margin-top:4px;line-height:1.5;}
.vti-deploy{font-size:11px;color:var(--metal-dim);margin-top:6px;}

}

.champion-box{text-align:center;padding:40px 20px;background:radial-gradient(circle at 50% 0%, rgba(233,255,46,0.10), transparent 70%);border:1px solid var(--neon-dim);border-radius:var(--radius);}
.champion-box .cap{font-size:13px;letter-spacing:3px;color:var(--metal);margin-bottom:10px;font-family:var(--font-d);}
.champion-box .name{font-family:var(--font-d);font-weight:700;font-size:44px;color:var(--neon);}

.ref-scorecard{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:640px){.ref-scorecard{grid-template-columns:1fr;}}
.side-panel{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.side-panel .side-name{font-family:var(--font-d);font-weight:700;font-size:20px;color:var(--white);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.side-panel .side-score{font-family:var(--font-d);font-weight:700;font-size:56px;color:var(--neon);line-height:1;margin:10px 0;}
.side-panel .score-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.side-panel .score-btns button{background:var(--panel-3);border:1px solid var(--border);color:var(--white);border-radius:8px;padding:12px 6px;font-size:13px;font-weight:600;min-height:52px;}
.side-panel .score-btns button:active{transform:scale(0.96);}
.side-panel.leading{border-color:var(--neon-dim);}

.score-log{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.score-log span{font-size:11px;background:var(--panel-3);border:1px solid var(--border);color:var(--metal);padding:3px 8px;border-radius:10px;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:22px;max-width:420px;width:100%;}
.modal-box h3{font-family:var(--font-d);font-size:19px;margin:0 0 10px;color:var(--white);}
.modal-box p{font-size:14px;color:var(--metal);line-height:1.6;margin:0 0 18px;}
.modal-box .radio-row{display:flex;gap:10px;margin-bottom:18px;}
.modal-box .radio-opt{flex:1;border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;font-weight:600;cursor:pointer;}
.modal-box .radio-opt.selected{border-color:var(--neon);color:var(--neon);background:var(--neon-glow);}
.modal-box .radio-opt.result-winner{
  cursor:default;border:1px solid #D4AF37;color:#F3D98B;
  background:linear-gradient(160deg, rgba(212,175,55,0.14), rgba(212,175,55,0.03));
  box-shadow:0 0 0 1px rgba(212,175,55,0.2), 0 0 14px rgba(212,175,55,0.25);
}
.modal-box .radio-opt.result-winner .result-crown{color:#D4AF37;display:inline-block;margin-bottom:2px;}
.modal-box .radio-opt.result-loser{
  cursor:not-allowed;pointer-events:none;user-select:none;
  border:1px solid var(--border);color:var(--metal-dim);opacity:0.55;background:var(--panel-3);
}
.modal-box .radio-opt.result-locked{
  cursor:not-allowed;pointer-events:none;border:1px solid var(--border);color:var(--metal-dim);opacity:0.6;
}
.result-tag{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;}
.result-tag-win{color:#141208;background:linear-gradient(90deg,#F3D98B,#D4AF37);}
.result-tag-lose{color:var(--metal-dim);background:rgba(255,255,255,0.05);}
.result-invalid-msg{color:var(--danger);text-align:center;font-weight:600;margin-bottom:12px;}

.toast-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--panel-2);border:1px solid var(--neon-dim);color:var(--white);padding:10px 18px;border-radius:8px;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,0.4);}

.empty-state{text-align:center;padding:40px 20px;color:var(--metal);}
.empty-state .big{font-family:var(--font-d);font-size:18px;color:var(--white);margin-bottom:8px;}

.banner{border:1px solid var(--neon-dim);background:var(--neon-glow);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.banner span{font-size:13px;color:var(--white);}
.banner.warn{border-color:var(--danger);background:var(--danger-glow);}

.pill-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.dup-list{font-size:12px;color:var(--danger);margin-top:6px;}

.nav-arrows{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:12px;}
.nav-arrows .center{font-family:var(--font-d);font-weight:600;font-size:14px;color:var(--metal);min-width:120px;text-align:center;}

.celebration-overlay{
  position:fixed;inset:0;z-index:500;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(212,175,55,0.10) 0%, transparent 45%),
    linear-gradient(180deg, #0d0e0a 0%, var(--obsidian) 55%, #030303 100%);
  display:flex;flex-direction:column;align-items:center;
  overflow-y:auto;padding:0 0 40px;
  animation:hoc-bg-fade 0.9s ease-out both;
}

.hoc-beams{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:0.5;}
.hoc-beams::before,.hoc-beams::after{
  content:"";position:absolute;top:-10%;width:140%;height:120%;left:-20%;
  background:conic-gradient(from 90deg at 50% 0%, transparent 0deg, rgba(212,175,55,0.05) 8deg, transparent 16deg, transparent 40deg, rgba(212,175,55,0.04) 48deg, transparent 56deg, transparent 100deg, rgba(212,175,55,0.05) 108deg, transparent 116deg);
}
.hoc-ambient{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.hoc-dust{position:absolute;border-radius:50%;background:var(--champagne-gold);opacity:0;animation:hoc-drift linear infinite;}
@keyframes hoc-drift{0%{opacity:0;transform:translateY(0);}10%{opacity:0.5;}90%{opacity:0.4;}100%{opacity:0;transform:translateY(-120px);}}
.celebration-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1;}

.hoc-content{position:relative;z-index:2;width:100%;max-width:960px;display:flex;flex-direction:column;align-items:center;padding:30px 18px 0;}

.hoc-header{display:flex;flex-direction:column;align-items:center;text-align:center;}
.hoc-logo-wrap{position:relative;width:64px;height:64px;margin-bottom:6px;}
.hoc-logo-glow{position:absolute;inset:-40%;background:radial-gradient(circle, rgba(212,175,55,0.35) 0%, transparent 70%);}
.hoc-logo-wrap img{position:relative;width:100%;height:100%;object-fit:contain;}
.celeb-brand{font-family:var(--font-d);font-weight:700;font-size:20px;letter-spacing:5px;color:var(--ivory);margin-top:2px;}
.hoc-subbrand{font-family:var(--font-d);font-weight:700;font-size:12px;letter-spacing:6px;background:linear-gradient(90deg,var(--champagne-gold),var(--imperial-gold));-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:4px;}
.celeb-title{font-family:var(--font-b);font-weight:500;font-size:13px;letter-spacing:2px;color:var(--gold-dim);margin-top:8px;}
.celeb-event-name{font-family:var(--font-d);font-weight:600;font-size:17px;color:var(--ivory);margin-top:10px;text-align:center;opacity:0.9;}

.hoc-trophy-svg{position:relative;width:92px;height:92px;filter:drop-shadow(0 4px 10px rgba(0,0,0,0.5));}
.hoc-champion-title{font-family:var(--font-d);font-weight:700;font-size:14px;letter-spacing:5px;color:var(--champagne-gold);margin-top:10px;}
.hoc-champion-row{display:flex;align-items:center;gap:16px;margin-top:6px;}

.hoc-champion-name{
  font-family:var(--font-d);font-weight:700;font-size:44px;line-height:1.15;text-align:center;max-width:440px;

  position:relative;

.hoc-champion-plate{
  margin-top:20px;padding:2px;border-radius:14px;
  background:linear-gradient(135deg,var(--champagne-gold),var(--bronze-gold));
}
.hoc-champion-plate-inner{
  background:linear-gradient(160deg, rgba(20,19,14,0.92), rgba(6,6,5,0.96));
  border-radius:12px;padding:10px 26px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.06), 0 10px 24px rgba(0,0,0,0.5);
}

.hoc-ranks-row{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:38px;width:100%;flex-wrap:wrap;animation:hoc-rise 1s ease-out 1.5s both;}
.hoc-rank-card{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  width:156px;padding:16px 12px 18px;border-radius:12px;
  background:linear-gradient(160deg, rgba(255,255,255,0.03), rgba(0,0,0,0.25));
  border:1px solid var(--rank-border, rgba(255,255,255,0.12));
  box-shadow:0 8px 18px rgba(0,0,0,0.35);
}
.hoc-rank-medal{width:38px;height:52px;margin-bottom:8px;}
.hoc-rank-cn{font-family:var(--font-d);font-weight:700;font-size:14px;letter-spacing:1.5px;color:var(--rank-color,var(--ivory));}
.hoc-rank-en{font-family:var(--font-d);font-weight:500;font-size:10px;letter-spacing:2.5px;color:var(--metal);margin-top:1px;}
.hoc-rank-name{font-family:var(--font-d);font-weight:700;font-size:20px;color:var(--ivory);margin-top:8px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;}
.hoc-rank-silver{--rank-border:rgba(196,201,209,0.4);--rank-color:#D7DCE3;}
.hoc-rank-bronze{--rank-border:rgba(154,109,58,0.45);--rank-color:var(--bronze-gold);}
.hoc-rank-fourth{--rank-border:rgba(90,74,38,0.4);--rank-color:#8f8055;}

.hoc-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:36px;position:relative;z-index:2;width:100%;max-width:640px;}
.hoc-btn{
  font-family:var(--font-d);font-weight:700;font-size:13px;letter-spacing:0.5px;
  height:44px;padding:0 18px;border-radius:8px;flex:1 1 150px;max-width:220px;
  display:flex;align-items:center;justify-content:center;
  transition:transform .08s, box-shadow .15s;
}
.hoc-btn:active{transform:scale(0.97);}
.hoc-btn-primary{background:linear-gradient(180deg,var(--champagne-gold),var(--imperial-gold));color:#141208;border:none;}
.hoc-btn-primary:hover{box-shadow:0 0 0 3px var(--gold-glow);}
.hoc-btn-secondary{background:rgba(7,8,8,0.5);color:var(--champagne-gold);border:1px solid var(--gold-dim);}
.hoc-btn-secondary:hover{border-color:var(--imperial-gold);}

.fw-particle{position:absolute;width:6px;height:6px;border-radius:50%;opacity:0;animation:fw-burst 1.5s ease-out forwards;box-shadow:0 0 6px currentColor;}
@keyframes fw-burst{0%{transform:translate(0,0) scale(1);opacity:1;}100%{transform:translate(var(--dx),var(--dy)) scale(0.15);opacity:0;}}
.fw-confetti{position:absolute;width:6px;height:12px;opacity:0;animation:fw-fall 3.6s linear forwards;}
@keyframes fw-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(360px) rotate(320deg);opacity:0;}}
.fw-static{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--champagne-gold);opacity:0.5;}
@media (max-width:640px){
  .hoc-content{padding:20px 14px 0;}
  .celeb-event-name{font-size:15px;}
  .hoc-champion-name{font-size:30px;max-width:280px;}
  .hoc-laurel{width:26px;height:60px;}
  .hoc-trophy-wrap{width:80px;height:80px;}
  .hoc-trophy-svg{width:68px;height:68px;}
  .hoc-ranks-row{flex-direction:column;align-items:center;gap:12px;margin-top:26px;}
  .hoc-rank-card{width:100%;max-width:260px;flex-direction:row;text-align:left;gap:12px;padding:12px 16px;}
  .hoc-rank-medal{margin-bottom:0;}
  .hoc-actions{max-width:100%;}
  .hoc-btn{flex:1 1 45%;max-width:none;}
}
@media (prefers-reduced-motion: reduce){
  .celebration-overlay,.hoc-champion-zone,.hoc-trophy-wrap,.hoc-ranks-row,.celebration-wm{animation:none !important;}
  .hoc-champion-name::after{animation:none !important;}
  .hoc-trophy-halo{animation:none !important;}
}

/* ==== auth / landing screens ==== */
.auth-shell{
  position:fixed;inset:0;z-index:400;overflow-y:auto;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(212,175,55,0.09) 0%, transparent 45%),
    linear-gradient(180deg, #0d0e0a 0%, var(--obsidian) 55%, #020303 100%);
  display:flex;flex-direction:column;align-items:center;
  padding:34px 16px 50px;
  animation:hoc-bg-fade 0.7s ease-out both;
}
.auth-beams{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0.4;
  background:conic-gradient(from 90deg at 50% 0%, transparent 0deg, rgba(212,175,55,0.05) 8deg, transparent 16deg, transparent 40deg, rgba(212,175,55,0.04) 48deg, transparent 56deg);
}
.auth-wm{position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;}
.auth-wm img{width:56%;max-width:600px;height:auto;opacity:0.05;filter:saturate(0.6);}
.auth-particles{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.auth-dust{position:absolute;bottom:0;width:3px;height:3px;border-radius:50%;background:var(--champagne-gold);opacity:0;animation:hoc-drift 6s linear infinite;}
.auth-content{position:relative;z-index:2;width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;}
.auth-brand-header{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:10px;}
.auth-logo-wrap{position:relative;width:104px;height:104px;margin-bottom:8px;}
.auth-logo-glow{position:absolute;inset:-35%;background:radial-gradient(circle, rgba(212,175,55,0.32) 0%, transparent 70%);}
.auth-logo-wrap img{position:relative;width:100%;height:100%;object-fit:contain;}
.auth-tagline{font-family:var(--font-b);font-size:14px;color:var(--champagne-gold);letter-spacing:1px;margin-top:18px;text-align:center;}
.auth-footnote{margin-top:30px;font-size:12px;color:var(--metal-dim);text-align:center;}

.role-cards{display:flex;gap:16px;justify-content:center;align-items:stretch;flex-wrap:wrap;margin-top:26px;width:100%;}
.role-card{
  flex:1 1 200px;max-width:230px;min-height:250px;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;
  padding:26px 18px 20px;border-radius:14px;
  background:linear-gradient(160deg, rgba(255,255,255,0.03), rgba(0,0,0,0.3));
  border:1px solid rgba(255,255,255,0.1);
  transition:transform .15s, border-color .15s, box-shadow .15s;
}
.role-card:hover{transform:translateY(-3px);}
.role-card:focus-visible{outline:2px solid var(--imperial-gold);outline-offset:2px;}
.role-card-icon{width:46px;height:46px;margin-bottom:6px;}
.role-card-icon svg{width:100%;height:100%;}
.role-card-cn{font-family:var(--font-d);font-weight:700;font-size:19px;color:var(--ivory);}
.role-card-en{font-family:var(--font-d);font-weight:600;font-size:11px;letter-spacing:3px;color:var(--metal);}
.role-card-desc{font-size:12.5px;color:var(--metal);line-height:1.5;margin-top:4px;flex:1;}
.role-card-enter{font-family:var(--font-d);font-weight:700;font-size:13px;opacity:0;transition:opacity .15s;margin-top:6px;}
.role-card:hover .role-card-enter{opacity:1;}
.role-card-admin{border-color:rgba(212,175,55,0.5);}
.role-card-admin .role-card-icon{color:var(--imperial-gold);}
.role-card-admin:hover{border-color:var(--imperial-gold);box-shadow:0 0 0 1px var(--imperial-gold), 0 10px 28px rgba(212,175,55,0.18);}
.role-card-admin .role-card-icon svg{filter:drop-shadow(0 0 6px rgba(212,175,55,0.5));}
.role-card-admin .role-card-enter{color:var(--imperial-gold);}
.role-card-player{border-color:rgba(243,217,139,0.35);}
.role-card-player .role-card-icon{color:var(--champagne-gold);}
.role-card-player:hover{border-color:var(--champagne-gold);box-shadow:0 0 0 1px var(--champagne-gold), 0 10px 24px rgba(243,217,139,0.12);}
.role-card-player .role-card-enter{color:var(--champagne-gold);}
.role-card-guest{border-color:rgba(150,150,150,0.35);}
.role-card-guest .role-card-icon{color:#9a9a9a;}
.role-card-guest:hover{border-color:var(--bronze-gold);box-shadow:0 0 0 1px var(--bronze-gold);}
.role-card-guest .role-card-enter{color:var(--bronze-gold);}

.auth-card{
  width:100%;max-width:420px;margin-top:22px;padding:28px 26px;border-radius:16px;
  background:linear-gradient(160deg, rgba(20,19,14,0.9), rgba(5,5,4,0.94));
  border:1px solid var(--gold-dim);box-shadow:0 20px 50px rgba(0,0,0,0.5);
}
.auth-card-title{font-family:var(--font-d);font-weight:700;font-size:20px;color:var(--ivory);text-align:center;}
.auth-card-sub{font-size:13px;color:var(--metal);text-align:center;margin-top:4px;margin-bottom:18px;}
.auth-error{background:rgba(42,9,13,0.5);border:1px solid var(--wine);color:#e8a3ab;font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:14px;text-align:center;}
.auth-verifying{background:rgba(217,185,92,0.1);border:1px solid var(--gold-dim);color:var(--gold);font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:14px;text-align:center;}
.pw-eye-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;background:transparent;border:none;color:var(--metal);display:flex;align-items:center;justify-content:center;}
.pw-eye-btn svg{width:18px;height:18px;}
.auth-links{display:flex;justify-content:space-between;margin-top:14px;flex-wrap:wrap;gap:8px;}
.link-btn{background:none;border:none;color:var(--champagne-gold);font-size:12.5px;text-decoration:underline;padding:4px;}
.auth-fineprint{font-size:11px;color:var(--metal-dim);text-align:center;margin-top:18px;line-height:1.6;}
.btn-block{width:100%;}

.account-menu-wrap{position:relative;}
.account-badge{
  display:flex;align-items:center;gap:8px;background:rgba(217,185,92,0.08);
  border:1px solid var(--gold-dim);border-radius:20px;padding:6px 12px;
  font-family:var(--font-d);
}
.account-role-dot{width:8px;height:8px;border-radius:50%;background:var(--imperial-gold);}
.account-name{font-size:13px;color:var(--ivory);font-weight:600;}
.account-role-label{font-size:11px;color:var(--gold);}
.account-menu{
  position:absolute;top:calc(100% + 8px);right:0;min-width:170px;z-index:60;
  background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;
  box-shadow:0 10px 24px rgba(0,0,0,0.5);
}
.account-menu button{
  display:block;width:100%;text-align:left;padding:11px 14px;background:none;border:none;
  color:var(--white);font-size:13px;border-bottom:1px solid var(--border-soft);
}
.account-menu button:last-child{border-bottom:none;}
.account-menu button:hover{background:var(--panel-2);}
.account-menu button.danger{color:var(--danger);}
.role-indicator{
  background:var(--panel-2);border-bottom:1px solid var(--border);
  padding:8px 16px;font-size:12.5px;color:var(--metal);text-align:center;
}

/* ---------- player center (Phase 2): tabbed shell ---------- */
.player-main{max-width:720px;margin:0 auto;padding-bottom:76px;}
.player-desktop-logout{display:none;}
.player-tabs{
  display:flex;gap:2px;background:var(--panel-2);border-bottom:1px solid var(--border);
}
.player-tab-btn{
  flex:1;padding:11px 4px;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--metal);font-family:var(--font-d);font-weight:600;font-size:12.5px;
}
.player-tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);}
.player-tabs-bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  border-top:1px solid var(--gold-dim);border-bottom:none;
  background:var(--panel-1);box-shadow:0 -6px 20px rgba(0,0,0,0.4);
  padding-bottom:env(safe-area-inset-bottom,0);
}
.player-tabs-bottom .player-tab-btn{padding:10px 2px 8px;min-height:44px;}
@media (min-width:900px){
  .player-tabs-bottom{display:none;}
  .player-desktop-logout{display:inline-flex;}
  .player-main{padding-bottom:24px;}
}
@media (max-width:899px){
  .stickytop .player-tabs:not(.player-tabs-bottom){display:none;}
}

.player-id-card{
  text-align:center;padding:28px 20px;margin:14px auto;max-width:420px;border-radius:16px;
  background:linear-gradient(160deg, rgba(217,185,92,0.14), rgba(0,0,0,0.35));
  border:1px solid var(--gold);box-shadow:0 12px 30px rgba(0,0,0,0.4);
}
.player-id-badge{
  width:68px;height:68px;border-radius:50%;margin:0 auto 12px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:var(--panel-3);border:2px solid var(--gold-dim);color:var(--gold-dim);
}
.player-id-badge img{width:100%;height:100%;object-fit:cover;}
.player-id-badge svg{width:34px;height:34px;}
.player-id-name{font-family:var(--font-d);font-weight:700;font-size:20px;color:var(--gold);}
.player-id-realname{font-size:13px;color:var(--metal);margin-top:2px;}
.player-id-row{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap;}
.player-id-chip{padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700;background:var(--panel-3);color:var(--metal);}
.player-id-chip.ok{color:#8FAF72;background:rgba(143,175,114,0.14);}
.player-id-chip.bad{color:var(--danger);background:rgba(255,59,59,0.12);}
.player-id-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px;}
.player-id-stat .v{font-family:var(--font-d);font-weight:700;font-size:18px;color:var(--white);}
.player-id-stat .l{font-size:10.5px;color:var(--metal-dim);margin-top:2px;}

.find-event-card{padding:14px;border-radius:10px;background:var(--panel-2);border:1px solid var(--border-soft);margin-bottom:10px;}
.find-event-card:last-child{margin-bottom:0;}
.fe-name{font-family:var(--font-d);font-weight:700;font-size:14.5px;color:var(--white);}
.fe-meta{font-size:12px;color:var(--metal);margin-top:2px;}
.fe-status-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
.fe-status-chip{padding:2px 9px;border-radius:9px;font-size:11px;font-weight:700;}
.fe-status-chip.status-scheduled{color:var(--metal);background:rgba(255,255,255,0.06);}
.fe-status-chip.status-open{color:var(--gold);background:rgba(217,185,92,0.14);}
.fe-status-chip.status-full{color:#e8c547;background:rgba(232,197,71,0.14);}
.fe-status-chip.status-closed{color:var(--metal-dim);background:rgba(255,255,255,0.05);}
.fe-status-chip.status-cancelled{color:var(--danger);background:rgba(255,59,59,0.12);}
.fe-status-chip.status-started{color:#3ddc84;background:rgba(61,220,132,0.12);}
.fe-status-chip.status-live{color:#3ddc84;background:rgba(61,220,132,0.12);}
.fe-status-chip.status-waiting{color:var(--metal);background:rgba(255,255,255,0.06);}
.fe-status-chip.status-done{color:var(--metal-dim);background:rgba(255,255,255,0.05);}

.cloud-status-bar{
  display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  background:var(--panel-2);border-bottom:1px solid var(--border);
  padding:7px 14px;font-size:12px;font-family:var(--font-d);
}
.cloud-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.cloud-dot.connected{background:var(--ok);box-shadow:0 0 6px var(--ok);}
.cloud-dot.connecting{background:var(--gold);animation:cloud-pulse 1s ease-in-out infinite;}
.cloud-dot.local{background:var(--metal-dim);}
.cloud-dot.error{background:var(--danger);}
@keyframes cloud-pulse{0%,100%{opacity:0.4;}50%{opacity:1;}}
.cloud-dot-v2{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.cloud-dot-v2.green{background:#3ddc84;box-shadow:0 0 6px #3ddc84;}
.cloud-dot-v2.yellow{background:#e8c547;box-shadow:0 0 6px #e8c547;animation:cloud-pulse 1s ease-in-out infinite;}
.cloud-dot-v2.red{background:#ff4d4d;box-shadow:0 0 6px #ff4d4d;}
.cloud-dot-v2.gray{background:#6c7078;}
.cloud-code-chip{background:var(--panel-3);border:1px solid var(--gold-dim);color:var(--gold);padding:2px 10px;border-radius:10px;letter-spacing:2px;font-weight:700;}
.cloud-status-bar button{font-size:11.5px;padding:4px 10px;min-height:0;}
@media (max-width:640px){
  .role-cards{flex-direction:column;align-items:stretch;}
  .role-card{max-width:none;min-height:0;}
  .auth-logo-wrap{width:80px;height:80px;}
}


@media print{
  @page{ size: landscape; margin: 12mm; }
  body *{visibility:hidden;}
  #print-bracket, #print-bracket *{visibility:visible;}
  #print-bracket{position:absolute;top:0;left:0;width:100%;background:#fff;color:#111;padding:20px;}
  #print-bracket .match-box{border:1px solid #999;background:#fff;}
  #print-bracket .mb-head{background:#eee;color:#333;}
  #print-bracket .mb-row.winner{color:#0a5c1c;}
  #print-bracket .se-col-title{color:#555;}
  #print-bracket .se-path-won{stroke:#b8860b !important;}
  #print-bracket .se-path-pending{stroke:rgba(120,120,120,0.35) !important;}
}

function cloudAvailable(){
  return (typeof window!=="undefined" && window.cloudSync && typeof window.cloudSync.isEnabled==="function" && window.cloudSync.isEnabled());
}

function applyRemoteState(remote){
  try{
    if(!remote || !remote.id) return;
    if(remote.id !== state.id) return; // safety: only accept updates for the room we're actually in
    const localUpdated = state.updatedAt || 0;
    const remoteUpdated = remote.updatedAt || 0;
    if(remoteUpdated <= localUpdated) return; // ignore stale/older data (avoid clobbering newer local edits)
    const keepCode = state.cloudCode;
    state = Object.assign(defaultState(remote.id), remote);
    state.cloudCode = keepCode;
    cloudLastSyncAt = Date.now();
    saveRecord(state);
    // Firebase-driven updates should never yank the viewport back to the top —
    // this is a live data refresh, not a navigation action, so the person's
    // current scroll position (mid-read on a long bracket/roster list, etc.)
    // is preserved across the re-render.
    const scrollY = (typeof window!=="undefined" && window.scrollY) || 0;
    render();
    if(typeof window!=="undefined" && window.scrollTo){
      try{ window.scrollTo(0, scrollY); }catch(e){}
    }
  }catch(e){ /* ignore malformed remote payloads */ }
}

// Phase 1: tournaments connect to the cloud automatically — no manual button.
// Idempotent: if this tournament already has a fixed cloudCode, this is a no-op
// (the code is permanent for the life of the tournament, per spec). Only ever
// called for admin-tier sessions; guests/players never create rooms.
async function ensureCloudRoomForTournament(){
  if(!hasAdminAccess()) return;
  if(state.cloudCode) return;
  if(!(typeof window!=="undefined" && window.cloudSync && window.cloudSync.connect)) return;
  cloudStatus = "connecting"; render();
  await window.cloudSync.connect();
  if(!cloudAvailable()){
    cloudStatus = "local"; render();
    return;
  }
  const code = await window.cloudSync.createRoom(state);
  if(!code){
    cloudStatus = "error"; render();
    return;
  }
  state.cloudCode = code;
  await saveRecord(state);
  if(cloudUnsub){ try{ cloudUnsub(); }catch(e){} }
  cloudUnsub = window.cloudSync.subscribe(code, applyRemoteState);
  cloudStatus = "connected";
  cloudLastSyncAt = Date.now();
  render();
}

}

/* ---------- one Firebase Auth account, multiple usable modes ---------- */
// activeMode is PURELY a front-end interface state — which interface (admin
// or player) the current session is currently showing. It is never sent to
// Firestore Security Rules and never affects users/{uid}.role. Role stays the
// account's real permission level; activeMode just decides which UI is shown
// right now for accounts whose role permits more than one.
let activeMode = null; // 'admin' | 'player' | null
const ACTIVE_MODE_KEY = "bxh_active_mode_v1";
// Set immediately before calling signIn()/signInWithGoogle(), so the ONE
// onAuthStateChanged listener (the sole routing authority) knows WHICH entry
// point this specific sign-in attempt came through, without needing a second
// competing routing path. Cleared as soon as it's been consumed.
let pendingLoginIntent = null; // 'admin' | 'player' | null

// Races a promise against a timeout; resolves to {ok:false, error:"..."} on
// timeout instead of leaving the caller's await hanging forever. Used to
// bound every Firebase Auth call from the login screens so a hang anywhere
// in the chain (IndexedDB, network, the SDK itself) can never leave the UI
// permanently stuck on a "verifying" screen — this is the actual fix for the
// mobile-first-load race, not a band-aid: the underlying tryInitFirebase()
// hang is fixed separately in the module, and this is a second, independent
// safety net around the call site itself.
function withLoginTimeout(promise, ms){
  return new Promise((resolve)=>{
    let settled = false;
    const timer = setTimeout(()=>{
      if(!settled){ settled = true; resolve({ ok:false, error:"驗證逾時，請檢查網路連線後重試", timedOut:true }); }
    }, ms);
    Promise.resolve(promise).then(
      (v)=>{ if(!settled){ settled=true; clearTimeout(timer); resolve(v); } },
      (e)=>{ if(!settled){ settled=true; clearTimeout(timer); resolve({ ok:false, error:(e&&e.message)||"發生未知錯誤" }); } }
    );
  });
}
const LOGIN_TIMEOUT_MS = 10000;
let verifyingTimeoutHandle = null;
let loginAttemptGeneration = 0; // incremented on every new/retried login attempt; lets an
  // orphaned (cancelled) attempt's eventual resolution recognize it's stale and no-op
  // instead of clobbering whatever a newer attempt has since set.

// Starts (or restarts) a hard ceiling on how long the "正在驗證帳號權限……"
// state can be shown. Covers BOTH failure points that could otherwise hang
// forever: the signIn()/signInWithGoogle() call itself, AND onAuthChange's
// own getUserProfile() Firestore read after sign-in succeeds — either one
// hanging (IndexedDB, network, SDK internals) used to leave the UI stuck
// with no way out except a manual page reload. Requirement: never silently
// auto-retry to paper over a hang — surface a real error and a manual
// "重新驗證" button instead.
function startVerifyingTimeout(){
  clearVerifyingTimeout();
  verifyingTimeoutHandle = setTimeout(()=>{
    verifyingTimeoutHandle = null;
    if(!authVerifying) return; // already resolved through the normal path
    (async ()=>{
      // Before giving up: maybe the sign-in actually succeeded and
      // onAuthStateChanged's event simply never fired or never finished
      // processing (an observed possibility in some restricted mobile
      // WebViews, independent of the earlier IndexedDB/getUserProfile fixes).
      // Check Firebase's OWN current-user state directly and, if a session
      // really is active, manually run it through the exact same
      // single-authority function the event itself would have called —
      // never a second, differently-written routing path.
      if(window.cloudAuth && window.cloudAuth.getCurrentUser && processAuthStateChange){
        const cu = window.cloudAuth.getCurrentUser();
        if(cu){
          try{ await processAuthStateChange(cu); }catch(e){}
          return; // processAuthStateChange's own finally{} clears state and renders
        }
      }
      authVerifying = false;
      loginBusy = false; playerLoginBusy = false;
      loginError = "驗證逾時，請檢查網路連線後重試";
      playerLoginError = "驗證逾時，請檢查網路連線後重試";
      render();
    })();
  }, LOGIN_TIMEOUT_MS);
}
function clearVerifyingTimeout(){
  if(verifyingTimeoutHandle){ clearTimeout(verifyingTimeoutHandle); verifyingTimeoutHandle = null; }
}

// Always-available manual escape hatch while the verifying screen is shown —
// does NOT depend on any timer firing correctly. Signs out cleanly (so
// Firebase Auth's own state is reset, not left in some half-signed-in limbo)
// and returns control to the login form immediately.
function cancelVerifyingAndRetry(){
  loginAttemptGeneration++; // orphan any in-flight attempt's eventual callback
  clearVerifyingTimeout();
  authVerifying = false;
  loginBusy = false; playerLoginBusy = false;
  pendingLoginIntent = null;
  loginError = "已取消驗證，請重新嘗試登入";
  playerLoginError = "已取消驗證，請重新嘗試登入";
  try{ if(window.cloudAuth && window.cloudAuth.isReady()) window.cloudAuth.signOutUser(); }catch(e){}
  render();
}

// Converts an epoch-ms timestamp to a YYYY-MM-DD calendar date as seen in
// Asia/Taipei (UTC+8, no DST), used as a normalized, comparable date string.
function taipeiDateFromTimestamp(ts){
  if(!ts) return "";
  const d = new Date(ts + 8*3600*1000);
  return d.toISOString().slice(0,10);
}
// The date a record should be filtered/sorted by: the manually-entered event
// date if the admin filled it in, otherwise falls back to when the tournament
// was actually completed/archived — never leaves a blank meta.date silently
// unmatched against a real completion date.
function recordFilterDate(r){
  if(r.date) return r.date;
  return taipeiDateFromTimestamp(r.completedAt || r.archivedAt) || "";
}

function summarizeRecord(st){
  const champ = st.championId ? (st.players.find(p=>p.id===st.championId)||{}).name : null;
  return {
    id: st.id, name: st.meta.name, date: st.meta.date, location: st.meta.location,
    formatType: st.meta.formatType, format: st.meta.format,
    playerCount: st.players.length, championName: champ || null,
    archiveStatus: st.archiveStatus,
    updatedAt: st.updatedAt, createdAt: st.createdAt, completedAt: st.completedAt, archivedAt: st.archivedAt
  };
}
async function upsertIndex(st){
  let idx = await loadIndex();
  const summary = summarizeRecord(st);
  const i = idx.findIndex(x=>x.id===st.id);
  if(i>=0) idx[i]=summary; else idx.push(summary);
  await saveIndexArr(idx);
  return idx;
}
async function removeFromIndex(id){
  let idx = await loadIndex();
  idx = idx.filter(x=>x.id!==id);
  await saveIndexArr(idx);
  return idx;
}
