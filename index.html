function queueCloudSyncRetry(tournamentId, code){
  cloudSyncPending = true;
  if(cloudSyncQueueTimer) return;
  cloudSyncQueueTimer = setInterval(async ()=>{
    if(!cloudSyncPending || state.id!==tournamentId || state.cloudCode!==code || !cloudAvailable()){
      clearInterval(cloudSyncQueueTimer); cloudSyncQueueTimer=null; return;
    }
    try{
      const ok = await window.cloudSync.pushUpdate(code, state);
      if(ok){
        cloudSyncPending=false;
        clearInterval(cloudSyncQueueTimer); cloudSyncQueueTimer=null;
        showToast("已同步雲端");
        render();
      }
    }catch(e){ /* keep retrying on the interval */ }
  }, 15000);
}

// Builds a copy of the tournament state safe to expose to unauthenticated
// guests / any public reader. Same overall shape as `state` (so the existing
// guest-facing rendering code — live tab, bracket, history — works completely
// unchanged), but with the ONE genuinely sensitive field (`registrations`,
// which stores partial phone numbers for admin duplicate-checking) removed.
// This is what gets written to the separate `publicTournaments/{code}`
// document; the full `state` (including registrations) only ever goes to the
// admin/staff-only `tournaments/{code}` document.
function buildPublicTournamentSnapshot(st){
  return Object.assign({}, st, { registrations: [] });
}

async function saveState(){
  state.updatedAt = Date.now();
  if(state.meta && state.meta.registrationEnabled){
    state.meta.registrationStatus = computeRegistrationStatus(state.meta);
  }
  try{ saveRecord(state); }catch(e){}
  if(state.cloudCode && cloudAvailable() && currentRole!=="guest"){
    try{
      const ok = await window.cloudSync.pushUpdate(state.cloudCode, state);
      if(ok){ cloudSyncPending = false; return true; }
      queueCloudSyncRetry(state.id, state.cloudCode);
      return false;
    }catch(e){
      queueCloudSyncRetry(state.id, state.cloudCode);
      return false;
    }
  }
  return null; // no cloud room active; local save only, cloud status not applicable
}

// Idempotent: safe to call multiple times for the same tournament (re-opened celebration
// screen, page refresh, remote-state re-application) — only performs the archive write once.
async function performAutoArchive(){
  if(state.archiveStatus==="completed" && state.archivedAt) return;
  const wasAlreadyIndexed = recordIndex.some(r=>r.id===state.id);
  state.archiveStatus = "completed";
  state.archivedAt = Date.now();
  if(!state.completedAt) state.completedAt = Date.now();
  state.updatedAt = Date.now();

  const localOk = await saveRecord(state);
  if(!localOk){
    // Roll back the in-memory flags so this can genuinely be retried later,
    // and be explicit that the archive did NOT actually happen.
    state.archiveStatus = "ongoing";
    state.archivedAt = null;
    showToast("封存失敗：無法建立賽事快照，請確認儲存空間後重試", true);
    return;
  }
  recordIndex = await loadIndex();
  showToast(wasAlreadyIndexed ? "既有賽事紀錄已更新" : "賽事紀錄建立成功");

  const hadCloudRoom = !!state.cloudCode;
  if(hadCloudRoom && cloudAvailable() && currentRole!=="guest"){
    try{
      const ok = await window.cloudSync.pushUpdate(state.cloudCode, state);
      if(ok){ cloudSyncPending = false; showToast("已同步雲端"); }
      else { queueCloudSyncRetry(state.id, state.cloudCode); showToast("已儲存本機，等待雲端同步"); }
    }catch(e){
      queueCloudSyncRetry(state.id, state.cloudCode);
      showToast("已儲存本機，等待雲端同步");
    }
  }
}

async function performUnarchiveRecord(rid){
  const hasCurrentData = state.players.length>0 || state.matches.length>0;
  if(hasCurrentData && state.id!==rid && state.archiveStatus==="ongoing"){
    state.archiveStatus="paused"; await saveRecord(state);
  }
  const rec = rid===state.id ? state : (await loadRecord(rid));
  if(!rec){ showToast("找不到該筆紀錄", true); return; }
  const before = { championId: rec.championId, runnerUpId: rec.runnerUpId, thirdId: rec.thirdId, fourthId: rec.fourthId, archiveStatus: rec.archiveStatus };
  if(!rec.correctionLog) rec.correctionLog = [];
  rec.correctionLog.push({
    action: "unarchive-for-correction",
    before,
    modifiedBy: adminDisplayName || (userProfile&&userProfile.email) || "admin",
    modifiedAt: Date.now()
  });
  rec.archiveStatus="ongoing";
  state = rec;
  await saveRecord(state);
  await setCurrentId(state.id);
  recordIndex = await loadIndex();
  viewingRecordId=null; viewingRecordData=null;
  activeTab="live";
  render();
  showToast("已解除封存，可以繼續編輯（已記錄此次操作）");
}

async function importRecordsWithCollisionCheck(recordsToImport){
  const idx = await loadIndex();
  const existingIds = new Set(idx.map(r=>r.id));
  const collisions = recordsToImport.filter(r=>existingIds.has(r.id));
  const fresh = recordsToImport.filter(r=>!existingIds.has(r.id));
  for(const r of fresh){ await saveRecord(r); }
  recordIndex = await loadIndex();
  render();
  if(collisions.length>0){
    openModal({ type:"generic", title:"匯入備份 - 發現重複賽事", message:"以下 "+collisions.length+" 筆賽事的 ID 與現有紀錄相同：" + collisions.map(r=>r.meta.name).join("、") + "。是否要覆蓋現有資料？", danger:true, confirmLabel:"確定覆蓋", onConfirm:()=>{
      (async ()=>{
        for(const r of collisions){ await saveRecord(r); }
        recordIndex = await loadIndex();
        render();
        showToast("匯入完成，共匯入 "+recordsToImport.length+" 筆賽事");
      })();
    }});
  } else {
    showToast("已匯入 "+fresh.length+" 筆新賽事");
  }
}

function showToast(msg, isErr){
  const root = document.getElementById("toast-root");
  const el = document.createElement("div");
  el.className = "toast" + (isErr ? " err" : "");
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .3s"; setTimeout(()=>el.remove(),300); }, 2400);
}

/* ==== shared bracket utilities ==== */
function nextPow2(n){ let p=2; while(p<n) p*=2; return p; }

function seedOrder(size){
  let order=[1];
  while(order.length<size){
    const total = order.length*2+1;
    const next=[];
    order.forEach(s=>{ next.push(s); next.push(total-s); });
    order=next;
  }
  return order;
}

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function getMatch(id){ return state.matches.find(m=>m.id===id); }
function orderedMatches(){ return state.matches.slice().sort((x,y)=> (x.seq!=null&&y.seq!=null) ? x.seq-y.seq : (x.round-y.round || x.indexInRound-y.indexInRound)); }
function refereeMatches(){ return orderedMatches().filter(m=>!m.isBye); }
function matchesInRound(r){ return state.matches.filter(m=>m.round===r && (m.bracket==null || m.bracket==="SE")).sort((a,b)=>a.indexInRound-b.indexInRound); }
function matchesInRoundBracket(bracket, r){ return state.matches.filter(m=>m.bracket===bracket && m.round===r).sort((a,b)=>a.indexInRound-b.indexInRound); }
function numRoundsTotal(){ return state.bracketSize ? Math.log2(state.bracketSize) : 0; }

function applyPropagatedSlots(m, newA, newB){
  const curA = m.a ? m.a.playerId : null;
  const curB = m.b ? m.b.playerId : null;
  if(newA!==curA || newB!==curB){
    m.a = newA ? {type:"player", playerId:newA} : null;
    m.b = newB ? {type:"player", playerId:newB} : null;
    m.scoreA=0; m.scoreB=0; m.log=[]; m.winnerId=null; m.loserId=null; m.completed=false;
  }
}

/* ==== dispatcher: generate bracket ==== */
function generateBracket(){
  if(!hasAdminAccess()){ showToast("目前身分沒有此操作權限。", true); return false; }
  const fmt = state.meta.formatType || "single";
  if(fmt==="double") return generateDoubleElim();
  if(fmt==="roundrobin") return generateRoundRobin();
  return generateSingleElim();
}

/* ==== dispatcher: propagate results ==== */
/* ==== match status (pending/ready/in_progress/completed/paused) ==== */
function ensureMatchStatusFields(m){
  if(!m.status) m.status = m.completed ? "completed" : "pending";
  if(m.startedAt===undefined) m.startedAt = null;
  if(m.completedAt===undefined) m.completedAt = null;
  if(m.updatedAt===undefined) m.updatedAt = null;
  if(m.updatedBy===undefined) m.updatedBy = null;
}

function roundGroupsForScoringConfig(){
  const groups = {};
  state.matches.forEach(m=>{
    if(m.isBye) return;
    const key = m.bracket+":"+m.round;
    if(!groups[key]) groups[key] = { bracket:m.bracket, round:m.round, label: matchLabel({bracket:m.bracket, round:m.round}), matches:[] };
    groups[key].matches.push(m);
  });
  return Object.values(groups).sort((a,b)=> (a.round-b.round) || (a.bracket<b.bracket?-1:1));
}
function roundGroupLocked(group){
  return group.matches.some(m => m.completed || m.status==="completed" || m.status==="in_progress" || (m.log&&m.log.length>0) || m.scoreA>0 || m.scoreB>0);
}

function resolveScoringModeForRound(bracket, round){
  const key = bracket+":"+round;
  const rm = state.meta.roundScoringModes || {};
  if(rm[key]) return rm[key];
  return state.meta.scoringMode || "standard";
}
function ensureMatchScoringFields(m){
  if(!m.scoringMode) m.scoringMode = resolveScoringModeForRound(m.bracket, m.round);
  if(m.resultMethod===undefined) m.resultMethod = m.completed ? "score" : null;
  if(m.confirmedBy===undefined) m.confirmedBy = null;
  if(m.confirmedAt===undefined) m.confirmedAt = null;
}

function syncMatchStatuses(){
  if(!state.meta.scoringMode) state.meta.scoringMode = "standard";
  if(!state.meta.roundScoringModes) state.meta.roundScoringModes = {};
  state.matches.forEach(m=>{
    ensureMatchStatusFields(m);
    ensureMatchScoringFields(m);
    if(m.isBye){
      if(m.status!=="completed"){ m.status = "completed"; if(!m.completedAt) m.completedAt = m.completedAt || Date.now(); }
      return;
    }
    if(m.completed && m.status!=="completed"){
      m.status = "completed";
      if(!m.completedAt) m.completedAt = Date.now();
    }
  });
  autoAdvanceReadyMatches();
}

function autoAdvanceReadyMatches(){
  const readyStations = new Set();
  state.matches.forEach(m=>{ if(!m.isBye && m.status==="ready" && m.station!=null) readyStations.add(m.station); });

  const candidates = state.matches.filter(m=>
    !m.isBye &&
    m.status==="pending" &&
    !m.completed &&
    m.a && m.b &&
    m.station!=null &&
    !readyStations.has(m.station)
  );

  candidates.sort((a,b)=>{
    if((a.round||0)!==(b.round||0)) return (a.round||0)-(b.round||0);
    return (a.indexInRound||0)-(b.indexInRound||0);
  });

  const claimed = new Set();
  candidates.forEach(m=>{
    if(claimed.has(m.station)) return;
    m.status = "ready";
    m.updatedAt = Date.now();
    claimed.add(m.station);
  });
}

function setMatchInProgress(matchId, force){
  if(!hasAdminAccess()){ showToast("目前身分沒有此操作權限。", true); return; }
  const m = getMatch(matchId);
  if(!m || m.isBye) return;
  if(!m.a || !m.b){ showToast("此場次尚未確定兩位選手，無法設為進行中", true); return; }
  const conflict = state.matches.find(x=> x.id!==m.id && !x.isBye && x.station===m.station && x.status==="in_progress");
  if(conflict && !force){
    openModal({ type:"generic", title:"比賽台衝突", message:`台${m.station}目前已有比賽進行中，是否取代目前場次？`, danger:true, confirmLabel:"確定取代", onConfirm:()=>{ setMatchInProgress(matchId, true); } });
    return;
  }
  if(conflict && force){
    conflict.status = "ready";
    conflict.updatedAt = Date.now();
  }
  m.status = "in_progress";
  m.startedAt = Date.now();
  m.updatedAt = Date.now();
  m.updatedBy = adminDisplayName || (userProfile&&userProfile.email) || "admin";
  saveState();
  render();
}

function setMatchReady(matchId){
  if(!hasAdminAccess()){ showToast("目前身分沒有此操作權限。", true); return; }
  const m = getMatch(matchId);
  if(!m || m.isBye) return;
  if(m.completed || m.status==="completed"){ showToast("此場次已完成，無法設為預備中", true); return; }
  if(!m.a || !m.b){ showToast("此場次尚未確定兩位選手，無法設為預備中", true); return; }
  if(m.station==null){ showToast("此場次尚未指定比賽台，無法設為預備中", true); return; }
  state.matches.forEach(x=>{
    if(x.id!==m.id && !x.isBye && x.station===m.station && x.status==="ready"){
      x.status = "pending";
      x.updatedAt = Date.now();
    }
  });
  m.status = "ready";
  m.updatedAt = Date.now();
  m.updatedBy = adminDisplayName || (userProfile&&userProfile.email) || "admin";
  saveState();
  render();
}

function pauseMatchStatus(matchId){
  if(!hasAdminAccess()){ showToast("目前身分沒有此操作權限。", true); return; }
  const m = getMatch(matchId);
  if(!m || m.status!=="in_progress") return;
  m.status = "paused";
  m.updatedAt = Date.now();
  m.updatedBy = adminDisplayName || (userProfile&&userProfile.email) || "admin";
  saveState();
  render();
}

function resumeMatchStatus(matchId){
  if(!hasAdminAccess()){ showToast("目前身分沒有此操作權限。", true); return; }
  const m = getMatch(matchId);
  if(!m || m.status!=="paused") return;
  m.status = "in_progress";
  m.updatedAt = Date.now();
  m.updatedBy = adminDisplayName || (userProfile&&userProfile.email) || "admin";
  saveState();
  render();
}

function rebuildPropagation(){
  const fmt = state.meta.formatType || "single";
  if(fmt==="double") rebuildPropagationDouble();
  else if(fmt==="roundrobin") rebuildPropagationRoundRobin();
  else rebuildPropagationSingle();
  syncMatchStatuses();
}

/* ======================================================================
   FORMAT 1: SINGLE ELIMINATION (existing, unchanged logic)
   ====================================================================== */
function eligiblePlayers(){
  return state.players.filter(p => p && p.checkedIn === true);
}

function isPlayerInBracket(playerId){
  if(!state.bracketSize && state.matches.length===0) return false;
  return state.matches.some(m => (m.a && m.a.playerId===playerId) || (m.b && m.b.playerId===playerId));
}

function generateSingleElim(){
  const eligible = eligiblePlayers();
  if(eligible.length<2){ showToast("完成報到的選手不足兩人，無法建立賽事。", true); return false; }
  const shuffled = shuffle(eligible);
  const N = shuffled.length;
  const size = nextPow2(N);
  const order = seedOrder(size);
  const seedToPos = {};
  order.forEach((seed,idx)=>{ seedToPos[seed]=idx; });
  const slots = new Array(size).fill(null);
  for(let seed=1; seed<=size; seed++){
    const pos = seedToPos[seed];
    slots[pos] = seed<=N ? { type:"player", playerId: shuffled[seed-1].id } : { type:"bye" };
  }
  const numRounds = Math.log2(size);
  const matches=[];
  let matchCounter=0;
  let seq=0;

  const round0=[];
  for(let i=0;i<size;i+=2){
    const a=slots[i], b=slots[i+1];
    const m = {
      id: uid("m"), seq: seq++, bracket:"SE", round:0, indexInRound: i/2,
      a: a.type==="player" ? {type:"player", playerId:a.playerId} : null,
      b: b.type==="player" ? {type:"player", playerId:b.playerId} : null,
      isBye: a.type==="bye" || b.type==="bye",
      scoreA:0, scoreB:0, log:[], winnerId:null, loserId:null, completed:false, station:(matchCounter % state.meta.stations)+1
    };
    matchCounter++;
    if(a.type==="bye" && b.type==="player"){ m.winnerId=b.playerId; m.completed=true; m.a=null; }
    else if(b.type==="bye" && a.type==="player"){ m.winnerId=a.playerId; m.completed=true; m.b=null; }
    else if(a.type==="bye" && b.type==="bye"){ m.completed=true; m.winnerId=null; }
    round0.push(m);
  }
  matches.push(...round0);

  for(let r=1;r<numRounds;r++){
    const count = size/Math.pow(2,r+1);
    for(let i=0;i<count;i++){
      matches.push({ id: uid("m"), seq: seq++, bracket:"SE", round:r, indexInRound:i, a:null, b:null, isBye:false, scoreA:0, scoreB:0, log:[], winnerId:null, loserId:null, completed:false, station:(matchCounter % state.meta.stations)+1 });
      matchCounter++;
    }
  }

  state.bracketSize = size;
  state.matches = matches;
  state.drawnAt = Date.now();
  state.championId = null; state.runnerUpId = null; state.thirdId = null; state.fourthId = null;
  state.celebrationShown = false;
  rebuildPropagationSingle();
  syncMatchStatuses();
  const first = orderedMatches().find(m=>!m.isBye && !m.completed);
  state.currentMatchId = first ? first.id : null;
  return true;
}

function rebuildPropagationSingle(){
  const total = numRoundsTotal();
  for(let r=1;r<total;r++){
    matchesInRound(r).forEach(m=>{
      const lower = matchesInRound(r-1);
      const srcA = lower[m.indexInRound*2];
      const srcB = lower[m.indexInRound*2+1];
      const newA = srcA && srcA.winnerId ? srcA.winnerId : null;
      const newB = srcB && srcB.winnerId ? srcB.winnerId : null;
      applyPropagatedSlots(m, newA, newB);
    });
  }
  const finalRound = total-1;
  const finalMatches = matchesInRound(finalRound);
  if(finalMatches.length===1 && finalMatches[0].completed && finalMatches[0].winnerId){
    state.championId = finalMatches[0].winnerId;
    state.runnerUpId = finalMatches[0].loserId || null;
  } else {
    state.championId = null; state.runnerUpId = null;
  }

  // bronze match (3rd place) — additive, optional, must live in state.matches so the referee can play it
  state.bronzeMatchId = state.bronzeMatchId || null;
  if(state.meta.bronzeMatch && total>=2){
    const semis = matchesInRound(total-2).filter(m=>!m.isBye);
    if(semis.length===2 && semis[0].completed && semis[1].completed){
      const loserA = semis[0].loserId, loserB = semis[1].loserId;
      if(loserA && loserB){
        let bronze = state.bronzeMatchId ? getMatch(state.bronzeMatchId) : null;
        if(!bronze){
          bronze = { id: uid("bz"), seq: (state.matches.reduce((mx,x)=>Math.max(mx,x.seq||0),0))+0.5, bracket:"BZ", round:total-2, indexInRound:0, isBye:false, scoreA:0,scoreB:0, log:[], winnerId:null, loserId:null, completed:false, station: semis[0].station };
          state.matches.push(bronze);
          state.bronzeMatchId = bronze.id;
        }
        const curA = bronze.a?bronze.a.playerId:null, curB = bronze.b?bronze.b.playerId:null;
        if(curA!==loserA || curB!==loserB){
          bronze.a={type:"player",playerId:loserA}; bronze.b={type:"player",playerId:loserB};
          bronze.scoreA=0;bronze.scoreB=0;bronze.log=[];bronze.winnerId=null;bronze.loserId=null;bronze.completed=false;
        }
      }
    }
    const bronzeNow = state.bronzeMatchId ? getMatch(state.bronzeMatchId) : null;
    if(bronzeNow && bronzeNow.completed){
      state.thirdId = bronzeNow.winnerId;
      state.fourthId = bronzeNow.loserId;
    } else {
      state.thirdId = null; state.fourthId = null;
    }
  } else {
    if(state.bronzeMatchId){
      state.matches = state.matches.filter(mm=>mm.id!==state.bronzeMatchId);
      state.bronzeMatchId = null;
    }
    state.thirdId = null; state.fourthId = null;
  }
}



/* ======================================================================
   FORMAT 2: DOUBLE ELIMINATION
   ====================================================================== */
function generateDoubleElim(){
  const eligible = eligiblePlayers();
  if(eligible.length<2){ showToast("完成報到的選手不足兩人，無法建立賽事。", true); return false; }
  const shuffled = shuffle(eligible);
  const N = shuffled.length;
  const size = nextPow2(N);
  const order = seedOrder(size);
  const seedToPos = {};
  order.forEach((seed,idx)=>{ seedToPos[seed]=idx; });
  const slots = new Array(size).fill(null);
  for(let seed=1; seed<=size; seed++){
    const pos = seedToPos[seed];
    slots[pos] = seed<=N ? {type:"player", playerId: shuffled[seed-1].id} : {type:"bye"};
  }
  const k = Math.log2(size);
  const matches = [];
  let seq=0;
  let stationCounter=0;
  const nextStation = ()=> (stationCounter++ % state.meta.stations)+1;

  const wbRounds = [];
  const wb0 = [];
  for(let i=0;i<size;i+=2){
    const a=slots[i], b=slots[i+1];
    const m = { id:uid("m"), seq:seq++, bracket:"WB", round:0, indexInRound:i/2,
      a: a.type==="player"?{type:"player",playerId:a.playerId}:null,
      b: b.type==="player"?{type:"player",playerId:b.playerId}:null,
      isBye: a.type==="bye"||b.type==="bye",
      scoreA:0,scoreB:0,log:[],winnerId:null,loserId:null,completed:false, station: nextStation() };
    if(a.type==="bye" && b.type==="player"){ m.winnerId=b.playerId; m.completed=true; m.a=null; }
    else if(b.type==="bye" && a.type==="player"){ m.winnerId=a.playerId; m.completed=true; m.b=null; }
    else if(a.type==="bye" && b.type==="bye"){ m.completed=true; }
    wb0.push(m);
  }
  matches.push(...wb0);
  wbRounds.push(wb0);
  for(let r=1;r<k;r++){
    const count = size/Math.pow(2,r+1);
    const roundArr=[];
    for(let i=0;i<count;i++){
      roundArr.push({ id:uid("m"), seq:seq++, bracket:"WB", round:r, indexInRound:i, a:null,b:null, isBye:false, scoreA:0,scoreB:0, log:[], winnerId:null, loserId:null, completed:false, station: nextStation() });
    }
    matches.push(...roundArr);
    wbRounds.push(roundArr);
  }

  const lbRounds = [];
  let currentSurvivors = null;
  for(let r=0;r<k;r++){
    if(r===0){
      const roundArr=[];
      for(let i=0;i<wb0.length;i+=2){
        const srcA = wb0[i], srcB = wb0[i+1];
        roundArr.push({ id:uid("m"), seq:seq++, bracket:"LB", round: lbRounds.length, indexInRound: roundArr.length,
          a:null,b:null, isBye:false, scoreA:0,scoreB:0, log:[], winnerId:null, loserId:null, completed:false, station: nextStation(),
          lbSrc:{ type:"first", srcAId:srcA.id, srcBId: srcB?srcB.id:null } });
      }
      matches.push(...roundArr);
      lbRounds.push(roundArr);
      currentSurvivors = roundArr;
    } else {
      const droppers = wbRounds[r];
      const mergeArr=[];
      for(let i=0;i<currentSurvivors.length;i++){
        mergeArr.push({ id:uid("m"), seq:seq++, bracket:"LB", round: lbRounds.length, indexInRound:i,
          a:null,b:null, isBye:false, scoreA:0,scoreB:0, log:[], winnerId:null, loserId:null, completed:false, station: nextStation(),
          lbSrc:{ type:"merge", survivorMatchId: currentSurvivors[i].id, dropperMatchId: droppers[i] ? droppers[i].id : null } });
      }
      matches.push(...mergeArr);
      lbRounds.push(mergeArr);
      currentSurvivors = mergeArr;
      if(r<k-1 && currentSurvivors.length>1){
        const combineArr=[];
        for(let i=0;i<currentSurvivors.length;i+=2){
          const sA=currentSurvivors[i], sB=currentSurvivors[i+1];
          combineArr.push({ id:uid("m"), seq:seq++, bracket:"LB", round: lbRounds.length, indexInRound: combineArr.length,
            a:null,b:null, isBye:false, scoreA:0,scoreB:0, log:[], winnerId:null, loserId:null, completed:false, station: nextStation(),
            lbSrc:{ type:"combine", srcAMatchId: sA.id, srcBMatchId: sB?sB.id:null } });
        }
        matches.push(...combineArr);
        lbRounds.push(combineArr);
        currentSurvivors = combineArr;
      }
    }
  }

  const wbFinal = wbRounds[k-1][0];
  const lbFinalMatch = currentSurvivors && currentSurvivors[0] ? currentSurvivors[0] : null;
  const gf = { id:uid("m"), seq:seq++, bracket:"GF", round:0, indexInRound:0, a:null,b:null, isBye:false,
    scoreA:0,scoreB:0, log:[], winnerId:null, loserId:null, completed:false, station: nextStation(),
    gfSrc:{ wbFinalId: wbFinal.id, lbFinalId: lbFinalMatch ? lbFinalMatch.id : null } };
  matches.push(gf);

  state.bracketSize = size;
  state.matches = matches;
  state.drawnAt = Date.now();
  state.championId=null; state.runnerUpId=null; state.thirdId=null; state.fourthId=null;
  state.celebrationShown = false;
  state.gfMatchId = gf.id;
  state.gfResetMatchId = null;
  rebuildPropagationDouble();
  syncMatchStatuses();
  const first = orderedMatches().find(m=>!m.isBye && !m.completed);
  state.currentMatchId = first ? first.id : null;
  return true;
}

function dblSideWillNeverArrive(src, side){
  if(src.type==="first"){
    const id = side==="A" ? src.srcAId : src.srcBId;
    const sm = id?getMatch(id):null;
    return !sm || (sm.completed && sm.isBye);
  }
  if(src.type==="merge"){
    if(side==="A"){ const sm=getMatch(src.survivorMatchId); return !sm; }
    const sm = src.dropperMatchId?getMatch(src.dropperMatchId):null;
    return !sm || (sm.completed && sm.isBye);
  }
  if(src.type==="combine"){
    const id = side==="A"?src.srcAMatchId:src.srcBMatchId;
    const sm = id?getMatch(id):null;
    return !sm;
  }
  return false;
}

function rebuildPropagationDouble(){
  const k = numRoundsTotal();
  for(let r=1;r<k;r++){
    matchesInRoundBracket("WB", r).forEach(m=>{
      const lower = matchesInRoundBracket("WB", r-1);
      const srcA = lower[m.indexInRound*2];
      const srcB = lower[m.indexInRound*2+1];
      const newA = srcA && srcA.winnerId ? srcA.winnerId : null;
      const newB = srcB && srcB.winnerId ? srcB.winnerId : null;
      applyPropagatedSlots(m, newA, newB);
    });
  }

  const lbMatches = state.matches.filter(m=>m.bracket==="LB").sort((a,b)=> a.round-b.round || a.indexInRound-b.indexInRound);
  lbMatches.forEach(m=>{
    const src = m.lbSrc;
    if(!src) return;
    let newA=null, newB=null;
    if(src.type==="first"){
      const srcA = getMatch(src.srcAId), srcB = src.srcBId?getMatch(src.srcBId):null;
      newA = srcA && srcA.completed && srcA.loserId ? srcA.loserId : null;
      newB = srcB && srcB.completed && srcB.loserId ? srcB.loserId : null;
    } else if(src.type==="merge"){
      const surv = getMatch(src.survivorMatchId);
      const drop = src.dropperMatchId ? getMatch(src.dropperMatchId) : null;
      newA = surv && surv.completed && surv.winnerId ? surv.winnerId : null;
      newB = drop && drop.completed && drop.loserId ? drop.loserId : null;
    } else if(src.type==="combine"){
      const sA = getMatch(src.srcAMatchId), sB = src.srcBMatchId?getMatch(src.srcBMatchId):null;
      newA = sA && sA.completed && sA.winnerId ? sA.winnerId : null;
      newB = sB && sB.completed && sB.winnerId ? sB.winnerId : null;
    }
    applyPropagatedSlots(m, newA, newB);
    if(!m.completed){
      const aReady = m.a!=null, bReady = m.b!=null;
      if(aReady && !bReady && dblSideWillNeverArrive(src,"B")){
        m.isBye=true; m.completed=true; m.winnerId=m.a.playerId; m.loserId=null;
      } else if(bReady && !aReady && dblSideWillNeverArrive(src,"A")){
        m.isBye=true; m.completed=true; m.winnerId=m.b.playerId; m.loserId=null;
      } else {
        m.isBye=false;
      }
    }
  });

  const gf = state.gfMatchId ? getMatch(state.gfMatchId) : null;
  if(gf){
    const wbFinal = getMatch(gf.gfSrc.wbFinalId);
    const lbFinal = gf.gfSrc.lbFinalId ? getMatch(gf.gfSrc.lbFinalId) : null;
    const newA = wbFinal && wbFinal.completed && wbFinal.winnerId ? wbFinal.winnerId : null;
    const newB = lbFinal && lbFinal.completed && lbFinal.winnerId ? lbFinal.winnerId : null;
    applyPropagatedSlots(gf, newA, newB);
  }

  if(gf && gf.completed && gf.winnerId){
    const wbFinal = getMatch(gf.gfSrc.wbFinalId);
    const wbChampionId = wbFinal ? wbFinal.winnerId : null;
    if(gf.winnerId === wbChampionId){
      state.championId = gf.winnerId;
      state.runnerUpId = gf.loserId;
      if(state.gfResetMatchId){
        state.matches = state.matches.filter(mm=>mm.id!==state.gfResetMatchId);
        state.gfResetMatchId=null;
      }
    } else {
      if(!state.gfResetMatchId){
        const maxSeq = state.matches.reduce((mx,x)=> Math.max(mx, x.seq||0), 0);
        const resetM = { id:uid("m"), seq:maxSeq+1, bracket:"GFR", round:0, indexInRound:0,
          a:{type:"player",playerId:gf.a.playerId}, b:{type:"player",playerId:gf.b.playerId},
          isBye:false, scoreA:0,scoreB:0, log:[], winnerId:null, loserId:null, completed:false, station: gf.station };
        state.matches.push(resetM);
        state.gfResetMatchId = resetM.id;
      } else {
        const resetM = getMatch(state.gfResetMatchId);
        if(resetM && !resetM.completed){
          resetM.a = {type:"player",playerId:gf.a.playerId};
          resetM.b = {type:"player",playerId:gf.b.playerId};
        }
      }
      const resetM = getMatch(state.gfResetMatchId);
      if(resetM && resetM.completed && resetM.winnerId){
        state.championId = resetM.winnerId;
        state.runnerUpId = resetM.loserId;
      } else {
        state.championId = null; state.runnerUpId = null;
      }
    }
  } else {
    state.championId = null; state.runnerUpId = null;
    if(state.gfResetMatchId){
      state.matches = state.matches.filter(mm=>mm.id!==state.gfResetMatchId);
      state.gfResetMatchId=null;
    }
  }
}

/* ======================================================================
   FORMAT 3: ROUND ROBIN
   ====================================================================== */
function generateRoundRobin(){
  const eligible = eligiblePlayers();
  if(eligible.length<2){ showToast("完成報到的選手不足兩人，無法建立賽事。", true); return false; }
  let arr = shuffle(eligible).map(p=>({id:p.id}));
  if(arr.length % 2 !== 0) arr.push({id:null});
  const n = arr.length;
  const rounds = n-1;
  const matches=[];
  let seq=0;
  let stationCounter=0;
  const nextStation = ()=> (stationCounter++ % state.meta.stations)+1;
  let arrCopy = arr.slice();
  for(let r=0;r<rounds;r++){
    let idxInRound=0;
    for(let i=0;i<n/2;i++){
      const p1 = arrCopy[i], p2 = arrCopy[n-1-i];
      if(p1.id && p2.id){
        matches.push({ id:uid("m"), seq:seq++, bracket:"RR", round:r, indexInRound: idxInRound++,
          a:{type:"player",playerId:p1.id}, b:{type:"player",playerId:p2.id},
          isBye:false, scoreA:0,scoreB:0, log:[], winnerId:null, loserId:null, completed:false, station: nextStation() });
      }
    }
    const fixed = arrCopy[0];
    const rest = arrCopy.slice(1);
    rest.unshift(rest.pop());
    arrCopy = [fixed, ...rest];
  }
  state.bracketSize = n;
  state.matches = matches;
  state.drawnAt = Date.now();
  state.rrRounds = rounds;
  state.championId=null; state.runnerUpId=null; state.thirdId=null; state.fourthId=null;
  state.celebrationShown = false;
  syncMatchStatuses();
  const first = orderedMatches().find(m=>!m.isBye && !m.completed);
  state.currentMatchId = first ? first.id : null;
  return true;
}

function computeRoundRobinStandings(){
  const map = {};
  state.players.forEach(p=>{ map[p.id] = { id:p.id, name:p.name, played:0, wins:0, losses:0, scoreFor:0, scoreAgainst:0, diff:0, tied:false, rank:0 }; });
  const h2h = {};
  state.matches.filter(m=>m.bracket==="RR" && m.completed && m.winnerId).forEach(m=>{
    const aId=m.a.playerId, bId=m.b.playerId;
    const loserId = m.winnerId===aId?bId:aId;
    const isQuick = m.resultMethod==="quick_decision";
    if(map[m.winnerId]){ map[m.winnerId].played++; map[m.winnerId].wins++; if(!isQuick){ map[m.winnerId].scoreFor+=(m.winnerId===aId?m.scoreA:m.scoreB); map[m.winnerId].scoreAgainst+=(m.winnerId===aId?m.scoreB:m.scoreA); } }
    if(map[loserId]){ map[loserId].played++; map[loserId].losses++; if(!isQuick){ map[loserId].scoreFor+=(loserId===aId?m.scoreA:m.scoreB); map[loserId].scoreAgainst+=(loserId===aId?m.scoreB:m.scoreA); } }
    h2h[m.winnerId] = h2h[m.winnerId]||{}; h2h[m.winnerId][loserId]='win';
    h2h[loserId] = h2h[loserId]||{}; h2h[loserId][m.winnerId]='loss';
  });
  Object.values(map).forEach(p=>p.diff=p.scoreFor-p.scoreAgainst);
  let list = Object.values(map);
  const sameStats = (a,b)=> a.wins===b.wins && a.diff===b.diff && a.scoreFor===b.scoreFor;
  list.sort((a,b)=>{
    if(b.wins!==a.wins) return b.wins-a.wins;
    if(h2h[a.id] && h2h[a.id][b.id]) return h2h[a.id][b.id]==='win' ? -1 : 1;
    if(b.diff!==a.diff) return b.diff-a.diff;
    if(b.scoreFor!==a.scoreFor) return b.scoreFor-a.scoreFor;
    return 0;
  });
  let i=0;
  while(i<list.length){
    let j=i;
    while(j+1<list.length && sameStats(list[j+1],list[i])) j++;
    if(j>i){
      const group = list.slice(i,j+1);
      group.forEach(p=>{ p.subWins=0; });
      for(let x=0;x<group.length;x++){
        for(let y=0;y<group.length;y++){
          if(x!==y && h2h[group[x].id] && h2h[group[x].id][group[y].id]==='win') group[x].subWins++;
        }
      }
      group.sort((a,b)=>b.subWins-a.subWins);
      for(let x=0;x<group.length;x++) list[i+x]=group[x];
      let gi=i;
      while(gi<=j){
        let gj=gi;
        while(gj+1<=j && list[gj+1].subWins===list[gi].subWins) gj++;
        const tied = gj>gi;
        for(let x=gi;x<=gj;x++){ list[x].tied=tied; list[x].rank=i+1; }
        gi=gj+1;
      }
    } else {
      list[i].tied=false; list[i].rank=i+1;
    }
    i=j+1;
  }
  return list;
}

function rebuildPropagationRoundRobin(){
  const real = state.matches.filter(m=>m.bracket==="RR");
  const allDone = real.length>0 && real.every(m=>m.completed);
  if(!allDone){ state.championId=null; state.runnerUpId=null; state.thirdId=null; state.fourthId=null; return; }
  const standings = computeRoundRobinStandings();
  state.championId = standings[0] && !standings[0].tied ? standings[0].id : null;
  state.runnerUpId = standings[1] && !standings[1].tied ? standings[1].id : null;
  state.thirdId = standings[2] && !standings[2].tied ? standings[2].id : null;
  state.fourthId = standings[3] && !standings[3].tied ? standings[3].id : null;
}

/* ==== scoring ==== */
const POINT_TYPES = { spin:1, knockout:2, burst:2, extreme:3 };
const POINT_LABELS = { spin:"旋轉勝利＋1分", knockout:"擊飛勝利＋2分", burst:"爆裂勝利＋2分", extreme:"極限勝利＋3分" };

function checkWinnerSide(m){
  if(m.scoreA>=4 && m.scoreA>m.scoreB) return "A";
  if(m.scoreB>=4 && m.scoreB>m.scoreA) return "B";
  return null;
}

function addScore(matchId, side, type){
  if(!hasAdminAccess()){ showToast("目前身分沒有此操作權限。", true); return; }
  const m = getMatch(matchId);
  if(!m) return;
  if(pendingModal && pendingModal.type==="confirm-result" && pendingModal.matchId===matchId) return;
  const pts = POINT_TYPES[type];
  if(side==="A") m.scoreA+=pts; else m.scoreB+=pts;
  m.log.push({side,type,points:pts,t:Date.now()});
  saveState();
  const winSide = checkWinnerSide(m);
  if(winSide){
    pendingModal = { type:"confirm-result", matchId:matchId, title:"確認比賽結果", confirmLabel:"確認比分並送出結果" };
  }
  render();
}

function undoLast(matchId){
  if(!hasAdminAccess()){ showToast("目前身分沒有此操作權限。", true); return; }
  const m = getMatch(matchId);
  if(!m || m.log.length===0) return;
  const last = m.log.pop();
  if(last.side==="A") m.scoreA-=last.points; else m.scoreB-=last.points;
  saveState(); render();
}

function rematch(matchId){
  if(!hasAdminAccess()){ showToast("目前身分沒有此操作權限。", true); return; }
  const m = getMatch(matchId);
  if(!m) return;
  m.scoreA=0; m.scoreB=0; m.log=[]; m.winnerId=null; m.loserId=null; m.completed=false;
  m.status = "in_progress";
  m.updatedAt = Date.now();
  m.updatedBy = adminDisplayName || (userProfile&&userProfile.email) || "admin";
  rebuildPropagation();
  saveState(); render();
}

function evaluateMatchCompletion(m){
  if(!m) return { ok:false, reason:"not-found" };
  if(m.completed || m.status==="completed") return { ok:false, reason:"already-completed" };
  if(!m.a || !m.b || !m.a.playerId || !m.b.playerId) return { ok:false, reason:"missing-players" };
  const scoreA = Number(m.scoreA), scoreB = Number(m.scoreB);
  if(!Number.isFinite(scoreA) || !Number.isFinite(scoreB) || scoreA<0 || scoreB<0) return { ok:false, reason:"invalid-score" };
  if(scoreA===scoreB) return { ok:false, reason:"tie" };
  // Authoritative winner is ALWAYS recomputed here from the current live score, never
  // trusted from any UI selection state, click target, or caller-supplied value.
  const winnerSide = checkWinnerSide(m);
  if(!winnerSide) return { ok:false, reason:"no-winner" };
  const winnerId = winnerSide==="A" ? m.a.playerId : m.b.playerId;
  const loserId = winnerSide==="A" ? m.b.playerId : m.a.playerId;
  if(!winnerId || !loserId) return { ok:false, reason:"missing-players" };
  return { ok:true, winnerSide, winnerId, loserId };
}

function completionFailureMessage(reason){
  const map = {
    "already-completed": "此場比賽已完成確認",
    "missing-players": "選手資料不存在，無法確認結果。",
    "invalid-score": "比分已變更或不符合獲勝條件，請重新確認。",
    "tie": "目前比分相同，無法確認獲勝者。",
    "no-winner": "比分已變更或不符合獲勝條件，請重新確認。",
    "not-found": "找不到此場比賽。",
    "cloud-unavailable": "比分已變更或不符合獲勝條件，請重新確認。"
  };
  return map[reason] || "比分已變更或不符合獲勝條件，請重新確認。";
}

function applyMatchCompletionFields(m, evalResult, actor){
  m.winnerId = evalResult.winnerId;
  m.loserId = evalResult.loserId;
  m.completed = true;
  m.status = "completed";
  m.resultMethod = "score";
  m.confirmedBy = actor || "admin";
  m.confirmedAt = Date.now();
  m.completedAt = Date.now();
  m.updatedAt = Date.now();
  m.updatedBy = actor || "admin";
}

function confirmResult(matchId){
  if(!hasAdminAccess()){ showToast("目前身分沒有此操作權限。", true); return false; }
  const m = getMatch(matchId);
  const evalResult = evaluateMatchCompletion(m);
  if(!evalResult.ok){
    showToast(completionFailureMessage(evalResult.reason), true);
    return false;
  }
  applyMatchCompletionFields(m, evalResult, adminDisplayName || (userProfile&&userProfile.email) || "admin");
  rebuildPropagation();
  const rm = refereeMatches();
  const idx = rm.findIndex(x=>x.id===matchId);
  const nextM = rm.slice(idx+1).find(x=>!x.completed);
  state.currentMatchId = nextM ? nextM.id : (rm[idx+1] ? rm[idx+1].id : matchId);
  saveState(); render();
  showToast("比賽結果已確認");

  if(!state.celebrationShown && isTournamentFullyDecided()){
    state.celebrationShown = true;
    performAutoArchive();
    celebrationData = buildCelebrationData(state);
    celebrationOpen = true;
    render();
  }
  return true;
}

// When a cloud room is active, this routes the confirmation through a real Firestore
// transaction: it re-reads the latest server-known match data and re-validates the
// win condition against THAT (not the local screen), so a stale/already-changed score
// on another device cannot be confirmed here. Falls back to the plain local path
// (confirmResult) when no cloud room is active or the transaction API is unavailable.
async function confirmResultWithCloudGuard(matchId){
  if(!hasAdminAccess()){ showToast("目前身分沒有此操作權限。", true); return false; }
  const m = getMatch(matchId);
  const localEval = evaluateMatchCompletion(m);
  if(!localEval.ok){
    showToast(completionFailureMessage(localEval.reason), true);
    return false;
  }
  if(!(state.cloudCode && cloudAvailable() && window.cloudSync.confirmMatchTransaction)){
    return confirmResult(matchId);
  }
  const actor = adminDisplayName || (userProfile&&userProfile.email) || "admin";
  const result = await window.cloudSync.confirmMatchTransaction(state.cloudCode, (remoteState)=>{
    const remoteMatch = (remoteState.matches||[]).find(x=>x.id===matchId);
    const remoteEval = evaluateMatchCompletion(remoteMatch);
    if(!remoteEval.ok) return { ok:false, reason: remoteEval.reason };
    applyMatchCompletionFields(remoteMatch, remoteEval, actor);
    return { ok:true, state: remoteState };
  });
  if(!result.ok){
    showToast("比分已變更或不符合獲勝條件，請重新確認。", true);
    return false;
  }
  const keepCode = state.cloudCode;
  state = Object.assign(defaultState(result.state.id), result.state);
  state.cloudCode = keepCode;
  rebuildPropagation();
  saveRecord(state);
  const rm = refereeMatches();
  const idx = rm.findIndex(x=>x.id===matchId);
  const nextM = rm.slice(idx+1).find(x=>!x.completed);
  state.currentMatchId = nextM ? nextM.id : (rm[idx+1] ? rm[idx+1].id : matchId);
  render();
  showToast("比賽結果已確認");

  if(!state.celebrationShown && isTournamentFullyDecided()){
    state.celebrationShown = true;
    await performAutoArchive();
    celebrationData = buildCelebrationData(state);
    celebrationOpen = true;
    render();
  }
  return true;
}

/* ==== quick decision mode (裁判直接選擇獲勝方，不記錄比分) ==== */
function evaluateQuickDecision(m, selectedWinnerId){
  if(!m) return { ok:false, reason:"not-found" };
  if(m.completed || m.status==="completed" || m.winnerId) return { ok:false, reason:"already-completed" };
  if(!m.a || !m.b || !m.a.playerId || !m.b.playerId) return { ok:false, reason:"missing-players" };
  if(!selectedWinnerId) return { ok:false, reason:"no-selection" };
  if(selectedWinnerId!==m.a.playerId && selectedWinnerId!==m.b.playerId) return { ok:false, reason:"invalid-selection" };
  const loserId = selectedWinnerId===m.a.playerId ? m.b.playerId : m.a.playerId;
  return { ok:true, winnerId:selectedWinnerId, loserId };
}

function quickDecisionFailureMessage(reason){
  const map = {
    "already-completed": "本場比賽已完成判定。",
    "missing-players": "選手資料不存在，無法確認結果。",
    "no-selection": "尚未選擇獲勝方。",
    "invalid-selection": "選擇的選手不屬於本場比賽。",
    "not-found": "找不到此場比賽。"
  };
  return map[reason] || "賽事資料已變更或不符合判定條件，請重新確認。";
}

function applyQuickDecisionFields(m, evalResult, actor){
  m.winnerId = evalResult.winnerId;
  m.loserId = evalResult.loserId;
  m.completed = true;
  m.status = "completed";
  m.resultMethod = "quick_decision";
  m.confirmedBy = actor || "admin";
  m.confirmedAt = Date.now();
  m.completedAt = Date.now();
  m.updatedAt = Date.now();
  m.updatedBy = actor || "admin";
  // Quick decisions never record scores — explicitly ensure no fictional score exists.
  m.scoreA = null; m.scoreB = null; m.log = [];
}

function confirmQuickDecision(matchId, selectedWinnerId){
  if(!hasAdminAccess()){ showToast("目前身分沒有此操作權限。", true); return false; }
  const m = getMatch(matchId);
  const ev = evaluateQuickDecision(m, selectedWinnerId);
  if(!ev.ok){
    showToast(quickDecisionFailureMessage(ev.reason), true);
    return false;
  }
  applyQuickDecisionFields(m, ev, adminDisplayName || (userProfile&&userProfile.email) || "admin");
  rebuildPropagation();
  const rm = refereeMatches();
  const idx = rm.findIndex(x=>x.id===matchId);
  const nextM = rm.slice(idx+1).find(x=>!x.completed);
  state.currentMatchId = nextM ? nextM.id : (rm[idx+1] ? rm[idx+1].id : matchId);
  saveState(); render();
  showToast("已確認獲勝並晉級");

  if(!state.celebrationShown && isTournamentFullyDecided()){
    state.celebrationShown = true;
    performAutoArchive();
    celebrationData = buildCelebrationData(state);
    celebrationOpen = true;
    render();
  }
  return true;
}

async function confirmQuickDecisionWithCloudGuard(matchId, selectedWinnerId){
  if(!hasAdminAccess()){ showToast("目前身分沒有此操作權限。", true); return false; }
  const m = getMatch(matchId);
  const localEval = evaluateQuickDecision(m, selectedWinnerId);
  if(!localEval.ok){
    showToast(quickDecisionFailureMessage(localEval.reason), true);
    return false;
  }
  if(!(state.cloudCode && cloudAvailable() && window.cloudSync.confirmMatchTransaction)){
    return confirmQuickDecision(matchId, selectedWinnerId);
  }
  const actor = adminDisplayName || (userProfile&&userProfile.email) || "admin";
  const result = await window.cloudSync.confirmMatchTransaction(state.cloudCode, (remoteState)=>{
    const remoteMatch = (remoteState.matches||[]).find(x=>x.id===matchId);
    const ev = evaluateQuickDecision(remoteMatch, selectedWinnerId);
    if(!ev.ok) return { ok:false, reason: ev.reason };
    applyQuickDecisionFields(remoteMatch, ev, actor);
    return { ok:true, state: remoteState };
  });
  if(!result.ok){
    showToast("賽事資料已變更或不符合判定條件，請重新確認。", true);
    return false;
  }
  const keepCode = state.cloudCode;
  state = Object.assign(defaultState(result.state.id), result.state);
  state.cloudCode = keepCode;
  rebuildPropagation();
  saveRecord(state);
  const rm = refereeMatches();
  const idx = rm.findIndex(x=>x.id===matchId);
  const nextM = rm.slice(idx+1).find(x=>!x.completed);
  state.currentMatchId = nextM ? nextM.id : (rm[idx+1] ? rm[idx+1].id : matchId);
  render();
  showToast("已確認獲勝並晉級");

  if(!state.celebrationShown && isTournamentFullyDecided()){
    state.celebrationShown = true;
    await performAutoArchive();
    celebrationData = buildCelebrationData(state);
    celebrationOpen = true;
    render();
  }
  return true;
}

function isTournamentFullyDecided(){
  const fmt = state.meta.formatType||"single";
  if(!state.championId || !state.runnerUpId) return false;
  if(fmt==="single" && state.meta.bronzeMatch){
    if(!state.thirdId || !state.fourthId) return false;
  }
  if(fmt==="roundrobin"){
    const n = state.players.length;
    if(n>=3 && !state.thirdId) return false;
    if(n>=4 && !state.fourthId) return false;
  }
  return true;
}

function buildCelebrationData(rec){
  const saved = state;
  state = rec;
  let thirdLabel = null;
  try{
    const fmt = rec.meta.formatType || "single";
    if(fmt==="single" && !rec.meta.bronzeMatch){
      const total = numRoundsTotal();
      const semis = matchesInRound(total-2).filter(m=>!m.isBye);
      const names = semis.map(m=>m.loserId).filter(Boolean).map(id=>recName(rec,id));
      if(names.length) thirdLabel = names.join("、");
    } else if(fmt==="roundrobin" && !rec.thirdId){
      const standings = computeRoundRobinStandings();
      const tied3 = standings.filter(s=>s.rank===3);
      if(tied3.length) thirdLabel = tied3.map(s=>s.name).join("、");
    }
  } finally {
    state = saved;
  }
  return {
    recordId: rec.id,
    name: rec.meta.name,
    formatType: rec.meta.formatType || "single",
    championId: rec.championId, runnerUpId: rec.runnerUpId, thirdId: rec.thirdId, fourthId: rec.fourthId,
    championName: rec.championId ? recName(rec, rec.championId) : null,
    runnerUpName: rec.runnerUpId ? recName(rec, rec.runnerUpId) : null,
    thirdName: rec.thirdId ? recName(rec, rec.thirdId) : null,
    fourthName: rec.fourthId ? recName(rec, rec.fourthId) : null,
    thirdLabel: thirdLabel
  };
}

/* ==== stats ==== */
function computeStats(){
  const fmt = state.meta.formatType || "single";
  if(fmt==="roundrobin") return computeRoundRobinStandings();
  if(fmt==="double") return computeStatsDouble();
  return computeStatsSingle();
}

function computeStatsSingle(){
  const map = {};
  state.players.forEach(p=>{ map[p.id] = { id:p.id, name:p.name, wins:0, losses:0, scoreFor:0, scoreAgainst:0, diff:0, status:"未出賽" }; });
  if(state.bracketSize){
    state.players.forEach(p=>{ if(map[p.id]) map[p.id].status="等待中"; });
  }
  state.matches.forEach(m=>{
    if(m.isBye){
      if(m.winnerId && map[m.winnerId]) map[m.winnerId].status="已晉級";
      return;
    }
    if(m.completed && m.winnerId){
      const aId = m.a && m.a.playerId, bId = m.b && m.b.playerId;
      const loserId = m.winnerId===aId ? bId : aId;
      const isQuick = m.resultMethod==="quick_decision";
      if(map[m.winnerId]){
        map[m.winnerId].wins++;
        if(!isQuick){ map[m.winnerId].scoreFor += (m.winnerId===aId?m.scoreA:m.scoreB); map[m.winnerId].scoreAgainst += (m.winnerId===aId?m.scoreB:m.scoreA); }
        map[m.winnerId].status="已晉級";
      }
      if(loserId && map[loserId]){
        map[loserId].losses++;
        if(!isQuick){ map[loserId].scoreFor += (loserId===aId?m.scoreA:m.scoreB); map[loserId].scoreAgainst += (loserId===aId?m.scoreB:m.scoreA); }
        map[loserId].status="已淘汰";
      }
    }
  });
  if(state.currentMatchId){
    const cm = getMatch(state.currentMatchId);
    if(cm && !cm.completed){
      if(cm.a && map[cm.a.playerId]) map[cm.a.playerId].status="比賽中";
      if(cm.b && map[cm.b.playerId]) map[cm.b.playerId].status="比賽中";
    }
  }
  Object.values(map).forEach(p=> p.diff = p.scoreFor - p.scoreAgainst );
  const list = Object.values(map);
  list.sort((a,b)=> b.wins-a.wins || b.diff-a.diff || b.scoreFor-a.scoreFor );
  return list;
}

function computeStatsDouble(){
  const map = {};
  state.players.forEach(p=>{ map[p.id] = { id:p.id, name:p.name, wins:0, losses:0, scoreFor:0, scoreAgainst:0, diff:0, status:"未出賽", bracketPos:"W" }; });
  state.players.forEach(p=>{ if(map[p.id]) map[p.id].status="等待中"; });
  state.matches.forEach(m=>{
    if(m.isBye){
      if(m.winnerId && map[m.winnerId]){ map[m.winnerId].status="已晉級"; }
      return;
    }
    if(m.completed && m.winnerId){
      const aId = m.a && m.a.playerId, bId = m.b && m.b.playerId;
      const loserId = m.loserId || (m.winnerId===aId ? bId : aId);
      const isQuick2 = m.resultMethod==="quick_decision";
      if(map[m.winnerId]){
        map[m.winnerId].wins++;
        if(!isQuick2){ map[m.winnerId].scoreFor += (m.winnerId===aId?m.scoreA:m.scoreB); map[m.winnerId].scoreAgainst += (m.winnerId===aId?m.scoreB:m.scoreA); }
        if(map[m.winnerId].status!=="已淘汰") map[m.winnerId].status = m.winnerId===state.championId ? "已晉級" : "已晉級";
      }
      if(loserId && map[loserId]){
        map[loserId].losses++;
        if(!isQuick2){ map[loserId].scoreFor += (loserId===aId?m.scoreA:m.scoreB); map[loserId].scoreAgainst += (loserId===aId?m.scoreB:m.scoreA); }
        if(m.bracket==="WB"){ map[loserId].bracketPos="L"; }
        if(map[loserId].losses>=2){ map[loserId].status="已淘汰"; map[loserId].bracketPos="out"; }
      }
    }
  });
  if(state.currentMatchId){
    const cm = getMatch(state.currentMatchId);
    if(cm && !cm.completed){
      if(cm.a && map[cm.a.playerId]) map[cm.a.playerId].status="比賽中";
      if(cm.b && map[cm.b.playerId]) map[cm.b.playerId].status="比賽中";
    }
  }
  Object.values(map).forEach(p=> p.diff = p.scoreFor - p.scoreAgainst );
  const list = Object.values(map);
  list.sort((a,b)=> b.wins-a.wins || a.losses-b.losses || b.diff-a.diff || b.scoreFor-a.scoreFor );
  return list;
}

/* ==== registration / check-in ==== */
const REG_STATUS_LABELS = { confirmed:"正取", waitlist:"備取", walkin:"現場遞補", cancelled:"已取消" };
const CHECKIN_STATUS_LABELS = { pending:"未報到", checked:"已報到", noshow:"未到場" };

function nextRegPlayerNo(){
  const nums = state.registrations.map(r=>{
    const m = /^R(\d+)$/.exec(r.playerNo||"");
    return m ? parseInt(m[1],10) : 0;
  });
  const max = nums.length ? Math.max(...nums) : 0;
  return "R" + String(max+1).padStart(3,"0");
}

function isRegistrationEligible(reg){
  if(!reg) return false;
  if(reg.regStatus==="waitlist" || reg.regStatus==="cancelled") return false;
  if(state.meta.checkinRequired){
    return reg.checkinStatus==="checked";
  }
  return true;
}

function regCheckinDisplayLabel(reg){
  if(!state.meta.checkinRequired) return "本場免報到";
  return CHECKIN_STATUS_LABELS[reg.checkinStatus] || "未報到";
}

function playerName(id){
  const p = state.players.find(pl=>pl.id===id);
  return p ? p.name : "—";
}

// Registration status priority (per spec): cancelled > started > closed (past
// deadline) > full (capacity reached) > scheduled (not yet open) > open.
// Returns null when online registration isn't enabled for this tournament at all.
function computeRegistrationStatus(m){
  if(!m || !m.registrationEnabled) return null;
  if(m.eventCancelled) return "cancelled";
  if(state.bracketSize > 0) return "started";
  const now = Date.now();
  if(m.registrationCloseAt && now > m.registrationCloseAt) return "closed";
  const capacity = m.registrationCapacity;
  // Phase 1 note: no real registrations exist yet (that's Phase 3), so the
  // confirmed count is always 0 here — this branch is correctly unreachable
  // until Phase 3 wires it up to the real registrations subcollection.
  const confirmedCount = 0;
  if(capacity && confirmedCount >= capacity) return "full";
  if(m.registrationOpenAt && now < m.registrationOpenAt) return "scheduled";
  return "open";
}

async function publishRegistrationConfig(){
  state.meta.publishedAt = Date.now();
  state.meta.registrationStatus = computeRegistrationStatus(state.meta);
  const hadCloudRoom = !!state.cloudCode;
  const syncResult = await saveState();
  render();
  showToast("賽事已完成架構並發布");
  if(hadCloudRoom){
    if(syncResult===true) showToast("已同步雲端");
    else if(syncResult===false) showToast("已儲存本機，等待雲端同步");
  } else if(!cloudAvailable()){
    showToast("目前僅本機模式，尚未同步至雲端，玩家將無法從其他裝置查詢到此賽事", true);
  }
}

function tournamentStatus(){
  const real = state.matches.filter(m=>!m.isBye);
  if(real.length===0) return "waiting";
  const allDone = real.every(m=>m.completed);
  return allDone ? "done" : "live";
}

  const curIdx = currentMatch ? rm.findIndex(x=>x.id===currentMatch.id) : -1;

    const sidePlayerId = side==="A" ? (m.a&&m.a.playerId) : (m.b&&m.b.playerId);
    return (m.winnerId && sidePlayerId && m.winnerId===sidePlayerId) ? '<span class="qd-win-tag">勝</span>' : "";
  }
  if(m.isBye && !(side==="A"?m.a:m.b)) return "";
  return (m.completed || m.log.length) ? esc(String(side==="A"?m.scoreA:m.scoreB)) : "";
}

  if(m.isBye || m.scoringMode!=="quick") return "";
  return '<span class="qd-tag">簡易判定</span>';
}

/* ==== single-elim tree: dynamic DOM-measured layout + SVG connectors ==== */
function layoutSingleElimBracket(suffix){
  suffix = suffix || "";
  try{
    const outer = document.getElementById("se-bracket-outer"+suffix);
    if(!outer || typeof outer.querySelectorAll !== "function") return;
    const round0Col = outer.querySelector('.se-col[data-round="0"]');
    if(!round0Col) return;
    const round0Boxes = Array.from(round0Col.querySelectorAll(".match-box"))
      .sort((a,b)=> (+a.getAttribute("data-index")) - (+b.getAttribute("data-index")));
    if(round0Boxes.length===0) return;

    const allCols = Array.from(outer.querySelectorAll(".se-col[data-round]"));
    const maxRound = allCols.reduce((mx,c)=> Math.max(mx, +c.getAttribute("data-round")), 0);

    let prevCenters = round0Boxes.map(b=> b.offsetTop + b.offsetHeight/2);
    const round0Height = round0Col.scrollHeight;
    allCols.forEach(c=>{ c.style.minHeight = round0Height + "px"; });

    for(let r=1; r<=maxRound; r++){
      const col = outer.querySelector('.se-col[data-round="'+r+'"]');
      if(!col) break;
      const boxes = Array.from(col.querySelectorAll(".match-box"))
        .sort((a,b)=> (+a.getAttribute("data-index")) - (+b.getAttribute("data-index")));
      const newCenters = [];
      boxes.forEach((box,i)=>{
        const c1 = prevCenters[i*2];
        const c2 = prevCenters[i*2+1]!==undefined ? prevCenters[i*2+1] : c1;
        const mid = (c1+c2)/2;
        const h = box.offsetHeight;
        box.style.top = Math.max(0, mid - h/2) + "px";
        newCenters.push(mid);
      });
      prevCenters = newCenters;
    }

    drawSingleElimConnectors(outer, allCols, maxRound, suffix);
  }catch(e){ /* no-op outside a real browser DOM */ }
}

function drawSingleElimConnectors(outer, allCols, maxRound, suffix){
  suffix = suffix || "";
  const svg = document.getElementById("se-bracket-svg"+suffix);
  if(!svg) return;
  const colsWrap = document.getElementById("se-bracket-cols"+suffix);
  const outerRect = outer.getBoundingClientRect();
  const totalWidth = colsWrap ? colsWrap.scrollWidth : outer.scrollWidth;
  const totalHeight = colsWrap ? colsWrap.scrollHeight : outer.scrollHeight;
  svg.setAttribute("width", totalWidth);
  svg.setAttribute("height", totalHeight);
  svg.setAttribute("viewBox", "0 0 " + totalWidth + " " + totalHeight);

  let paths = "";
  for(let r=1; r<=maxRound; r++){
    const prevCol = outer.querySelector('.se-col[data-round="'+(r-1)+'"]');
    const curCol = outer.querySelector('.se-col[data-round="'+r+'"]');
    if(!prevCol || !curCol) continue;
    const prevBoxes = Array.from(prevCol.querySelectorAll(".match-box")).sort((a,b)=>(+a.getAttribute("data-index"))-(+b.getAttribute("data-index")));
    const curBoxes = Array.from(curCol.querySelectorAll(".match-box")).sort((a,b)=>(+a.getAttribute("data-index"))-(+b.getAttribute("data-index")));
    curBoxes.forEach((curBox, i)=>{
      const sources = [prevBoxes[i*2], prevBoxes[i*2+1]];
      sources.forEach((srcBox, sideIdx)=>{
        if(!srcBox) return;
        const matchId = srcBox.getAttribute("data-id");
        const m = getMatch(matchId);
        const rowEls = srcBox.querySelectorAll(".mb-row");
        let winnerRowEl = null;
        rowEls.forEach(rowEl=>{ if(rowEl.classList.contains("winner")) winnerRowEl = rowEl; });
        const useRowEl = winnerRowEl || rowEls[0];
        if(!useRowEl) return;
        const srcRect = srcBox.getBoundingClientRect();
        const rowRect = useRowEl.getBoundingClientRect();
        const startX = srcRect.right - outerRect.left;
        const startY = rowRect.top - outerRect.top + rowRect.height/2;

        const curRowEls = curBox.querySelectorAll(".mb-row");
        const destRowEl = curRowEls[sideIdx];
        if(!destRowEl) return;
        const curRect = curBox.getBoundingClientRect();
        const destRowRect = destRowEl.getBoundingClientRect();
        const endX = curRect.left - outerRect.left;
        const endY = destRowRect.top - outerRect.top + destRowRect.height/2;

        const midX = (startX+endX)/2;
        const isWinnerPath = !!winnerRowEl;
        const stroke = isWinnerPath ? "#e9ff2e" : "rgba(130,132,138,0.28)";
        const glowAttr = isWinnerPath ? ' filter="url(#se-glow'+suffix+')"' : "";
        const pathClass = isWinnerPath ? "se-path-won" : "se-path-pending";
        paths += `<path class="${pathClass}" d="M ${startX} ${startY} H ${midX} V ${endY} H ${endX}" fill="none" stroke="${stroke}" stroke-width="2"${glowAttr}/>`;
      });
    });
  }
  svg.innerHTML = '<defs><filter id="se-glow'+suffix+'" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>' + paths;
}

let __seRelayoutQueued = false;
function scheduleSeRelayout(){
  if(__seRelayoutQueued) return;
  __seRelayoutQueued = true;
  const raf = (typeof requestAnimationFrame === "function") ? requestAnimationFrame : (fn)=>setTimeout(fn,16);
  raf(()=>{ __seRelayoutQueued = false; layoutSingleElimBracket(""); });
}
if(typeof window !== "undefined" && typeof window.addEventListener === "function"){
  let __seResizeTimer = null;
  window.addEventListener("resize", ()=>{
    clearTimeout(__seResizeTimer);
    __seResizeTimer = setTimeout(scheduleSeRelayout, 120);
  });
}

function renderPrintBracket(){
  if(!state.bracketSize) return "";
  const fmt = state.meta.formatType || "single";
  const header = `<h2>${esc(state.meta.name)}</h2><p>${esc(state.meta.date)} ${esc(state.meta.location)}　賽制：${esc(FORMAT_LABELS[fmt]||"")}</p>`;
  const printBox = (m)=>{
    const aName = m.a ? playerName(m.a.playerId) : (m.isBye?"（輪空）":"待定");
    const bName = m.b ? playerName(m.b.playerId) : (m.isBye?"（輪空）":"待定");
    const aWin = m.completed && m.winnerId && m.a && m.winnerId===m.a.playerId;
    const bWin = m.completed && m.winnerId && m.b && m.winnerId===m.b.playerId;
    return `<div class="match-box"><div class="mb-head">${matchLabel(m)} · ${m.indexInRound+1}場</div>
      <div class="mb-row ${aWin?'winner':''}"><span class="nm">${esc(aName)}</span><span class="sc">${m.completed?m.scoreA:''}</span></div>
      <div class="mb-row ${bWin?'winner':''}"><span class="nm">${esc(bName)}</span><span class="sc">${m.completed?m.scoreB:''}</span></div></div>`;
  };
  if(fmt==="roundrobin"){
    const rr = state.matches.filter(m=>m.bracket==="RR");
    let cols = "";
    for(let r=0;r<(state.rrRounds||0);r++){
      const ms = rr.filter(m=>m.round===r);
      cols += `<div class="bracket-col">第${r+1}輪${ms.map(printBox).join("")}</div>`;
    }
    return wrapPrintWatermark(header + `<div class="bracket-cols" style="display:flex;gap:20px;flex-wrap:wrap;">${cols}</div>`);
  }
  if(fmt==="double"){
    const total = numRoundsTotal();
    let wbCols=""; for(let r=0;r<total;r++){ wbCols += `<div class="bracket-col">勝部R${r+1}${matchesInRoundBracket("WB",r).map(printBox).join("")}</div>`; }
    const lbRoundNums = Array.from(new Set(state.matches.filter(m=>m.bracket==="LB").map(m=>m.round))).sort((a,b)=>a-b);
    let lbCols=""; lbRoundNums.forEach((r,i)=>{ lbCols += `<div class="bracket-col">敗部R${i+1}${matchesInRoundBracket("LB",r).map(printBox).join("")}</div>`; });
    const gf = state.gfMatchId?getMatch(state.gfMatchId):null;
    const reset = state.gfResetMatchId?getMatch(state.gfResetMatchId):null;
    const gfCol = gf ? `<div class="bracket-col">總決賽${printBox(gf)}${reset?printBox(reset):""}</div>` : "";
    return wrapPrintWatermark(header + `<div class="bracket-cols" style="display:flex;gap:20px;flex-wrap:wrap;">${wbCols}${lbCols}${gfCol}</div>`);
  }
  const total = numRoundsTotal();
  let cols = "";
  for(let r=0;r<total;r++){
    const ms = matchesInRound(r);
    const title = r===total-1 ? "冠軍賽" : (r===total-2 ? "四強" : `第 ${r+1} 輪`);
    const boxes = ms.map((m,i)=> seMatchBoxHtml(m, r, i, `${m.indexInRound+1}場`)).join("");
    cols += `<div class="se-col" data-round="${r}"><div class="se-col-title">${title}</div>${boxes}</div>`;
  }
  const bronze = state.bronzeMatchId?getMatch(state.bronzeMatchId):null;
  const bronzeCol = bronze ? `<div class="bracket-col se-bronze-col"><div class="bracket-col-title">季軍賽</div>${matchBoxHtml(bronze,"季軍賽")}</div>` : "";
  const treeHtml = `<div class="se-bracket-outer" id="se-bracket-outer-print">
    <svg class="se-bracket-svg" id="se-bracket-svg-print"></svg>
    <div class="se-bracket-cols" id="se-bracket-cols-print">${cols}${bronzeCol}</div>
  </div>`;
  return wrapPrintWatermark(header + treeHtml);
}

    <img src="${LOGO_SRC}" alt="" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38%;max-width:480px;height:auto;opacity:0.09;filter:saturate(0.6);pointer-events:none;z-index:0;">

function renderReferee(){

        ${m.status==="in_progress" ? `<button class="btn btn-ghost btn-sm" data-action="pause-match-status" data-id="${m.id}">暫停比賽</button>` : ""}
        ${m.status==="paused" ? `<button class="btn btn-ghost btn-sm" data-action="resume-match-status" data-id="${m.id}">恢復比賽</button>` : ""}
      </div>

        <div class="score-btns">
          ${scoreBtn('A','spin')}${scoreBtn('A','knockout')}${scoreBtn('A','burst')}${scoreBtn('A','extreme')}

      </div>

function epochToDatetimeLocal(ts){
  if(!ts) return "";
  const d = new Date(ts);
  const pad = n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes());
}
function datetimeLocalToEpoch(str){
  if(!str) return null;
  const t = new Date(str).getTime();
  return isNaN(t) ? null : t;
}

function renderSettings(){
  const showTestBanner = state.players.length===0 && !state.testDataDismissed;
  const dupNames = (()=>{
    const seen={}, dups=new Set();
    state.players.forEach(p=>{ const n=p.name.trim(); if(seen[n]) dups.add(n); seen[n]=true; });
    return Array.from(dups);
  })();

  return `
  <div class="panel">
    <div class="panel-title">賽事基本資料</div>
    <div class="grid grid-2">
      <div class="field"><label>賽事名稱</label><input type="text" id="f-name" value="${esc(state.meta.name)}"></div>
      <div class="field"><label>活動日期</label><input type="date" id="f-date" value="${esc(state.meta.date)}"></div>
      <div class="field"><label>活動地點</label><input type="text" id="f-location" value="${esc(state.meta.location)}"></div>
      <div class="field"><label>賽制</label><select id="f-format">
        <option value="single" ${state.meta.formatType==='single'?'selected':''}>單淘汰賽</option>
        <option value="double" ${state.meta.formatType==='double'?'selected':''}>雙敗制</option>
        <option value="roundrobin" ${state.meta.formatType==='roundrobin'?'selected':''}>單循環賽</option>
      </select></div>
      <div class="field"><label>報到時間</label><input type="time" id="f-checkin" value="${esc(state.meta.checkin)}"></div>
      <div class="field"><label>開賽時間</label><input type="time" id="f-start" value="${esc(state.meta.startTime)}"></div>
      <div class="field"><label>戰鬥台數量</label><input type="number" min="1" max="32" id="f-stations" value="${state.meta.stations}"></div>
    </div>
    <div class="field" style="flex-direction:row;align-items:center;gap:10px;">
      <input type="checkbox" id="f-bronze" ${state.meta.bronzeMatch?'checked':''} style="width:20px;height:20px;">
      <label style="margin:0;">四強敗者加賽季軍賽（僅單淘汰賽適用）</label>
    </div>
    <button class="btn btn-primary" data-action="save-meta">儲存賽事資料</button>
  </div>

  <div class="panel">
    <div class="panel-title">是否需要報到</div>
    ${(state.rosterLocked||state.bracketSize>0) ? `<div class="banner warn"><span>賽事已經開始，無法更改是否需要報到的設定。</span></div>` : ""}
    <div class="btn-row">
      <button class="btn ${state.meta.checkinRequired?'btn-primary':'btn-ghost'}" data-action="set-checkin-required" data-value="true" ${(state.rosterLocked||state.bracketSize>0)?'disabled':''}>需要報到</button>
      <button class="btn ${!state.meta.checkinRequired?'btn-primary':'btn-ghost'}" data-action="set-checkin-required" data-value="false" ${(state.rosterLocked||state.bracketSize>0)?'disabled':''}>不需要報到</button>
    </div>
    ${state.meta.checkinRequired ? `
    <div class="field" style="margin-top:14px;max-width:280px;">
      <label>報到提前時間</label>
      <select id="f-checkin-lead" ${(state.rosterLocked||state.bracketSize>0)?'disabled':''}>
        <option value="30" ${state.meta.checkinLeadMinutes===30?'selected':''}>活動開始前 30 分鐘</option>
        <option value="60" ${state.meta.checkinLeadMinutes===60?'selected':''}>活動開始前 60 分鐘</option>
        <option value="90" ${state.meta.checkinLeadMinutes===90?'selected':''}>活動開始前 90 分鐘</option>
        <option value="120" ${state.meta.checkinLeadMinutes===120?'selected':''}>活動開始前 120 分鐘</option>
      </select>
    </div>
    <p class="hint" style="margin-top:10px;">需要報到：新增選手時預設為未報到，必須完成報到才能列入賽事編排。</p>` : `<p class="hint" style="margin-top:10px;">不需要報到：新增選手時自動視為已報到，直接可列入賽事編排。</p>`}
  </div>

  ${renderRegistrationSettingsPanel()}

  ${renderStaffAssignmentPanel()}

  <div class="panel">
    <div class="panel-title">比賽判定模式</div>
    <p class="hint">選擇本場賽事預設的判定方式，也可以針對各輪次分別設定。</p>
    <div class="scoring-mode-cards">
      <button class="scoring-mode-card ${state.meta.scoringMode==="standard"?"active":""}" data-action="set-scoring-mode" data-mode="standard" ${!isAdminTierOrAbove()?'disabled':''}>
        <div class="smc-title">標準計分模式</div>
        <div class="smc-desc">逐筆記錄勝利方式與比分，率先取得4分者獲勝。</div>
      </button>
      <button class="scoring-mode-card ${state.meta.scoringMode==="quick"?"active":""}" data-action="set-scoring-mode" data-mode="quick" ${!isAdminTierOrAbove()?'disabled':''}>
        <div class="smc-title">簡易判定模式</div>
        <div class="smc-desc">不記錄比分，由裁判直接選擇本場獲勝方。</div>
      </button>
    </div>
    ${state.bracketSize>0 ? (()=>{
      const groups = roundGroupsForScoringConfig();
      if(groups.length===0) return "";
      return `
      <div class="panel-title" style="font-size:14px;margin-top:18px;">各輪判定模式</div>
      <div class="round-scoring-list">
        ${groups.map(g=>{
          const locked = roundGroupLocked(g);
          const mode = g.matches[0].scoringMode || state.meta.scoringMode || "standard";
          return `<div class="round-scoring-row">
            <span class="rsr-label">${esc(g.label)}</span>
            <div class="btn-row" style="margin:0;">
              <button class="btn btn-sm ${mode==='standard'?'btn-primary':'btn-ghost'}" data-action="set-round-scoring-mode" data-bracket="${g.bracket}" data-round="${g.round}" data-mode="standard" ${locked||!isAdminTierOrAbove()?'disabled':''}>標準計分</button>
              <button class="btn btn-sm ${mode==='quick'?'btn-primary':'btn-ghost'}" data-action="set-round-scoring-mode" data-bracket="${g.bracket}" data-round="${g.round}" data-mode="quick" ${locked||!isAdminTierOrAbove()?'disabled':''}>簡易判定</button>
            </div>
            ${locked ? '<span class="hint" style="margin-left:8px;">此輪已開始或已有結果，無法切換</span>' : ''}
          </div>`;
        }).join("")}
      </div>`;
    })() : `<p class="hint" style="margin-top:10px;">產生對戰表後可以針對各輪次分別設定判定模式。</p>`}
  </div>

  <div class="panel">
    <div class="panel-title">選手名單<span class="badge badge-metal" id="player-count-badge">共 ${state.players.length} 人</span></div>
    ${showTestBanner ? `<div class="banner"><span>第一次使用嗎？可以載入 8 人測試名單快速體驗系統。</span><button class="btn btn-sm btn-ghost" data-action="load-test">載入測試名單</button></div>` : ""}
    <div class="field">
      <label>每行輸入一位選手姓名（可直接貼上 Excel / Google 試算表整欄姓名，會取代整份名單）</label>
      <textarea id="player-textarea" placeholder="黑爸&#10;小宇&#10;阿哲">${esc(state.players.map(p=>p.name).join(String.fromCharCode(10)))}</textarea>
      <div class="hint" id="player-live-count">目前輸入 ${state.players.length} 行</div>
      <div class="dup-list" id="player-dup-warn">${dupNames.length ? "重複姓名：" + dupNames.map(esc).join("、") : ""}</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" data-action="update-players">更新選手名單</button>
      <button class="btn btn-ghost" data-action="load-test">載入測試名單</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">選手報到狀態<span class="badge badge-metal">共 ${state.players.length} 人</span></div>
    <div class="grid grid-3" style="margin-bottom:14px;">
      <div class="stat-box"><div class="label">選手總人數</div><div class="value small">${state.players.length}</div></div>
      <div class="stat-box"><div class="label">已報到人數</div><div class="value small">${eligiblePlayers().length}</div></div>
      <div class="stat-box"><div class="label">未報到人數</div><div class="value small">${state.players.length - eligiblePlayers().length}</div></div>
    </div>
    <div class="field">
      <label>快速新增選手（每行一位姓名）</label>
      <textarea id="quick-add-textarea" placeholder="黑爸&#10;小宇"></textarea>
    </div>
    <div class="btn-row" style="margin-bottom:14px;">
      <button class="btn btn-primary" data-action="quick-add-players">新增選手</button>
    </div>
    ${state.players.length===0 ? '<div class="empty-state">尚無選手資料</div>' : `
    <div class="rank-scroll">
    <table class="rank-table">
      <thead><tr><th>編號</th><th>姓名</th><th>報到</th><th>報到狀態</th><th>操作</th></tr></thead>
      <tbody>${state.players.map((p,i)=>`
      <tr>
        <td>${i+1}</td>
        <td class="rank-name">${esc(p.name)}</td>
        <td><input type="checkbox" class="player-checkin-box" data-id="${p.id}" ${p.checkedIn?'checked':''} style="width:20px;height:20px;"></td>
        <td><span class="badge ${p.checkedIn?'badge-neon':'badge-metal'}">${p.checkedIn?'已報到':'未報到'}</span></td>
        <td>
          <div class="btn-row" style="gap:6px;">
            <button class="btn btn-sm ${p.checkedIn?'checkin-btn-done':'checkin-btn-pending'}" data-action="toggle-checkin-btn" data-id="${p.id}">${p.checkedIn?'已報到':'報到'}</button>
            <button class="btn btn-danger btn-sm" data-action="delete-player" data-id="${p.id}">刪除</button>
          </div>
        </td>
      </tr>`).join("")}</tbody>
    </table>
    </div>`}
  </div>

  <div class="panel">
    <div class="panel-title">對戰表操作</div>
    <p class="hint" style="margin-bottom:12px;">目前賽制：${esc(FORMAT_LABELS[state.meta.formatType]||"單淘汰賽")}　|　對戰表狀態：${state.bracketSize ? (state.meta.formatType==='roundrobin' ? `已產生（共 ${state.rrRounds} 輪）` : `已產生（${state.bracketSize} 個籤位）`) : "尚未產生"}</p>
    <div class="btn-row">
      <button class="btn btn-primary" data-action="draw-bracket">${state.bracketSize ? "重新抽籤並產生對戰表" : "產生對戰表"}</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">資料保存</div>
    <div class="btn-row">
      <button class="btn btn-ghost" data-action="export-data">匯出賽事資料</button>
      <button class="btn btn-ghost" data-action="import-data">匯入賽事資料</button>
      <button class="btn btn-danger" data-action="clear-data">清除全部資料</button>
    </div>
    <input type="file" id="import-file-input" accept="application/json" style="display:none;">
  </div>
  `;
}

function passwordStrengthLabel(pw){
  if(!pw) return "";
  let score = 0;
  if(pw.length>=6) score++;
  if(pw.length>=10) score++;
  if(/[0-9]/.test(pw) && /[a-zA-Z]/.test(pw)) score++;
  if(/[^a-zA-Z0-9]/.test(pw)) score++;
  return ["非常弱","弱","中等","強","非常強"][score] || "弱";
}

async function copyTextToClipboard(text, successMessage){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      showToast(successMessage);
      return true;
    }
    throw new Error("no clipboard api");
  }catch(e){
    try{
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      showToast(successMessage);
      return true;
    }catch(e2){
      showToast("複製失敗，請手動選取文字複製", true);
      return false;
    }
  }
}

function matchResultSummaryText(m){
  if(!m || !m.winnerId) return "";
  const winName = playerName(m.winnerId);
  if(m.resultMethod==="quick_decision"){
    return winName + " 勝";
  }
  const loserName = m.loserId ? playerName(m.loserId) : "";
  const winScore = (m.a && m.a.playerId===m.winnerId) ? m.scoreA : m.scoreB;
  const loseScore = (m.a && m.a.playerId===m.winnerId) ? m.scoreB : m.scoreA;
  return winName + " " + winScore + "：" + loseScore + " " + loserName;
}

function buildShareSummary(){
  const fmt = state.meta.formatType || "single";
  const realMatches = state.matches.filter(m=>!m.isBye);
  const done = realMatches.filter(m=>m.completed).length;
  const total = realMatches.length;
  const cur = state.currentMatchId ? getMatch(state.currentMatchId) : null;
  const st = tournamentStatus();
  let progress;
  if(st==="waiting") progress = "賽事尚未開始";
  else if(st==="done") progress = "賽事已完成";
  else if(cur && cur.a && cur.b && !cur.completed) progress = matchLabel(cur) + "：" + playerName(cur.a.playerId) + " vs " + playerName(cur.b.playerId) + (cur.scoringMode==="quick" ? "" : "（" + cur.scoreA + ":" + cur.scoreB + "）");
  else progress = "賽事進行中";
  const lines = [
    "⚔️ BXH ARENA｜即時賽況",
    "賽事：" + (state.meta.name || "未命名賽事"),
    "賽制：" + (FORMAT_LABELS[fmt] || ""),
    "參賽人數：" + state.players.length + " 人",
    "目前進度：" + progress,
    "已完成：" + done + "/" + total
  ];
  if(st==="done" && state.championId){
    lines.push("冠軍：" + playerName(state.championId));
  }
  return lines.join("\n");
}

function playFireworks(){
  try{
    clearFireworks();
    const fx = document.getElementById("celebration-fx");
    if(!fx) return;
    const reduced = (typeof window!=="undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const isMobile = (typeof window!=="undefined" && window.innerWidth && window.innerWidth<640);
    const colors = ["#D4AF37","#F3D98B","#F7F2E8","#8A6428","#2A090D"];
    let html = "";
    if(reduced){
      const dotCount = isMobile ? 10 : 18;
      for(let i=0;i<dotCount;i++){
        const x = Math.random()*100, y = 10+Math.random()*70;
        html += `<div class="fw-static" style="left:${x}%;top:${y}%;background:${colors[i%colors.length]};"></div>`;
      }
      fx.innerHTML = html;
      return;
    }
    const origins = isMobile
      ? [{x:6,y:28},{x:94,y:28},{x:10,y:55},{x:90,y:55}]
      : [{x:6,y:22},{x:12,y:48},{x:94,y:22},{x:88,y:48},{x:20,y:10},{x:80,y:10}];
    let idx=0;
    origins.forEach((origin, oi)=>{
      const particleCount = isMobile ? 8 : 12;
      for(let i=0;i<particleCount;i++){
        const angle = (Math.PI*2*i)/particleCount + Math.random()*0.4;
        const dist = 55 + Math.random()*65;
        const dx = Math.cos(angle)*dist;
        const dy = Math.sin(angle)*dist;
        const color = (idx % 8===7) ? colors[4] : colors[idx % 4]; idx++;
        const delay = (oi*0.4 + Math.random()*0.3).toFixed(2);
        html += `<div class="fw-particle" style="left:${origin.x}%;top:${origin.y}%;background:${color};color:${color};--dx:${dx}px;--dy:${dy}px;animation-delay:${delay}s;"></div>`;
      }
    });
    const confettiCount = isMobile ? 10 : 22;
    for(let i=0;i<confettiCount;i++){
      const x = Math.random()*100;
      const color = (i % 9===8) ? colors[4] : colors[i % 4];
      const delay = (1.2 + Math.random()*2.4).toFixed(2);
      html += `<div class="fw-confetti" style="left:${x}%;top:-20px;background:${color};animation-delay:${delay}s;"></div>`;
    }
    fx.innerHTML = html;
    __fxTimer = setTimeout(()=>{
      const fx2 = document.getElementById("celebration-fx");
      if(fx2) fx2.innerHTML = "";
    }, 8000);
  }catch(e){ /* no-op outside a real browser DOM */ }
}
